---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster (nodes in maintenance mode)
    dir: '{{.TALOS_DIR}}'
    cmds:
      # topf secrets generates secrets.sops.yaml only if it doesn't exist yet
      - '{{if eq .SECRETS_EXIST "false"}}topf secrets > /dev/null && sops --encrypt --in-place secrets.sops.yaml{{end}}'
      - topf apply --auto-bootstrap
      - topf talosconfig
      - until topf kubeconfig --validity 8760h > {{.ROOT_DIR}}/kubeconfig; do sleep 10; done
    vars:
      SECRETS_EXIST:
        sh: test -f {{.TALOS_DIR}}/secrets.sops.yaml && echo true || echo false
    preconditions:
      - test -f {{.SOPS_CONFIG_FILE}}
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TOPFCONFIG}}
      - which topf sops

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmds:
      - until kubectl wait --for=condition=Ready=False nodes --all --timeout=600s; do sleep 10; done
      - kubectl create namespace argo-system --dry-run=client -o yaml | kubectl apply --server-side --filename -
      # The age key for ksops in the argo repo-server. The Secret name is historical (helm-secrets is gone).
      - '{{if eq .SOPS_SECRET_EXISTS "false"}}cat {{.SOPS_AGE_KEY_FILE}} | kubectl --namespace argo-system create secret generic helm-secrets-private-keys --from-file=key.txt=/dev/stdin{{end}}'
      - helmfile --file {{.KUBERNETES_DIR}}/bootstrap/helmfile.yaml apply --skip-diff-on-install --suppress-diff
      - kubectl apply --server-side --filename {{.KUBERNETES_DIR}}/argo
    vars:
      SOPS_SECRET_EXISTS:
        sh: kubectl --namespace argo-system get secret helm-secrets-private-keys &>/dev/null && echo true || echo false
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.KUBERNETES_DIR}}/bootstrap/helmfile.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which helmfile kubectl sops
