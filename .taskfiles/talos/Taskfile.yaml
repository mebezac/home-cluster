---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# topf renders every node's machine config from topf.yaml + the patch dirs and diffs it against
# the live node before applying (asks first). Rendered configs contain plaintext secrets - they
# only ever go to the gitignored ./rendered dir.

tasks:
  render:
    desc: Render Talos machine configs to ./rendered and validate them
    dir: '{{.TALOS_DIR}}'
    cmds:
      - topf render --output ./rendered --confirm=false
      - for f in rendered/*.yaml; do talosctl validate --mode metal --config "$f"; done
    preconditions:
      - which topf talosctl

  diff:
    desc: Show pending config changes for every node without applying them
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --dry-run

  apply:
    desc: Apply Talos config to all nodes (shows a diff and asks first)
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply

  apply-node:
    desc: Apply Talos config to one node [NODE=required] [MODE=auto|no-reboot|reboot|staged|try]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --nodes-filter '^{{.NODE}}$' --mode '{{.MODE}}'
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [NODE]

  nodes:
    desc: List all nodes and their current state
    dir: '{{.TALOS_DIR}}'
    cmd: topf nodes

  upgrade-node:
    desc: Upgrade Talos on one node [NODE=required] - prefer the talos-upgrade skill (Longhorn evacuation, talmac quirks)
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade --nodes-filter '^{{.NODE}}$'
    requires:
      vars: [NODE]

  upgrade-k8s:
    desc: Upgrade Kubernetes to kubernetesVersion in topf.yaml (topf deliberately doesn't manage this)
    dir: '{{.TALOS_DIR}}'
    cmd: talosctl --nodes "$(yq '[.nodes[] | select(.role == "control-plane")][0].ip' topf.yaml)" upgrade-k8s --to "$(yq '.kubernetesVersion' topf.yaml)"
    preconditions:
      - which talosctl yq

  talosconfig:
    desc: Regenerate ./talosconfig from the secrets bundle
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig

  reset:
    desc: Reset ALL nodes back to maintenance mode (DESTRUCTIVE)
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --confirm=false
