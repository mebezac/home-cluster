# Human-only mise config. Loaded on top of .mise.toml only when MISE_ENV=human
# (set in your shell profile). Agents run with MISE_ENV=agent, so they get the
# tool pins from .mise.toml but never these paths or the decrypted MCP token.

[settings]
# mise decrypts the _.file below itself; it does not read SOPS_AGE_KEY_FILE from [env].
sops.age_key_file = "{{config_root}}/age.key"

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/kubernetes/bootstrap/talos/talosconfig"
TOPFCONFIG = "{{config_root}}/kubernetes/bootstrap/talos/topf.yaml"
TASK_X_ENV_PRECEDENCE = 1
TASK_X_MAP_VARIABLES = 0
# ARGOCD_API_TOKEN for the argocd-mcp server in .mcp.json (token of the ArgoCD
# account "mcp"). Claude Code passes its own environment to MCP servers, so
# restart it after changing this file. A missing file is skipped.
_.file = { path = "{{config_root}}/mcp-secrets.sops.json", redact = true }
