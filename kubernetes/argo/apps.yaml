---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argo-system
spec:
  project: default
  source:
    repoURL: https://github.com/mebezac/home-cluster.git
    path: kubernetes/argo/apps
    targetRevision: main
    directory:
      recurse: true
  destination:
    name: in-cluster
    namespace: argo-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # Only the automated block is ignored, so auto-sync can still be paused/toggled by hand on a
  # child app. Ignoring all of /spec/syncPolicy silently dropped later git edits to syncOptions
  # and managedNamespaceMetadata on existing apps.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/syncPolicy/automated
