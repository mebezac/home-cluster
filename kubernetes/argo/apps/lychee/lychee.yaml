---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lychee
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/lychee/lychee
      targetRevision: main
      ref: lychee-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: lychee
        valueFiles:
          - $lychee-repo/kubernetes/apps/lychee/lychee/values.yaml
    # Kopiur backups of lychee-data (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: lychee-data-backup
        valuesObject:
          pvc: lychee-data
          mover:
            runAsUser: 1000
          restore:
            enabled: true
    # Kopiur backups of lychee-uploads (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: lychee-uploads-backup
        valuesObject:
          pvc: lychee-uploads
          copyMethod: Direct
          mover:
            runAsUser: 33
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: lychee
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
