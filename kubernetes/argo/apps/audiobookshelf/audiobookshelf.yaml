---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audiobookshelf
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/audiobookshelf/audiobookshelf
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: audiobookshelf
        valueFiles:
          - $repo/kubernetes/apps/audiobookshelf/audiobookshelf/values.yaml
    # Kopiur backups of audiobookshelf-config (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: audiobookshelf-config-backup
        valuesObject:
          pvc: audiobookshelf-config
          mover:
            runAsUser: 3000
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: audiobookshelf
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
