apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calibre-nextgen
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/calibre-nextgen/calibre-nextgen
      targetRevision: main
      ref: calibre-nextgen-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: calibre-nextgen
        valueFiles:
          - $calibre-nextgen-repo/kubernetes/apps/calibre-nextgen/calibre-nextgen/values.yaml
    # Back up the existing bound PVCs in place. A populator requires a separate PVC cutover.
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: calibre-nextgen-library-backup
        valuesObject:
          pvc: calibre-nextgen-library
          tier: critical
          mover:
            runAsUser: 3000
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: calibre-nextgen-config-backup
        valuesObject:
          pvc: calibre-nextgen-config
          tier: critical
          mover:
            runAsUser: 3000
  destination:
    name: in-cluster
    namespace: calibre-nextgen
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
