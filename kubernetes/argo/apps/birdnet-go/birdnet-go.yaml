apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: birdnet-go
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/birdnet-go/birdnet-go
      targetRevision: main
      ref: birdnet-go-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: birdnet-go
        valueFiles:
          - $birdnet-go-repo/kubernetes/apps/birdnet-go/birdnet-go/values.yaml
    # Kopiur backups of birdnet-go-config (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: birdnet-go-config-backup
        valuesObject:
          pvc: birdnet-go-config
          mover:
            runAsUser: 1000
          restore:
            enabled: true
    # Kopiur backups of birdnet-go-data-v2 (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: birdnet-go-data-v2-backup
        valuesObject:
          pvc: birdnet-go-data-v2
          mover:
            runAsUser: 1000
          restore:
            enabled: true
    # Kopiur backups of birdnet-go-clips (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: birdnet-go-clips-backup
        valuesObject:
          pvc: birdnet-go-clips
          copyMethod: Direct
          mover:
            runAsUser: 1000
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: birdnet-go
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
