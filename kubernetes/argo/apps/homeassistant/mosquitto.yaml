---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mosquitto
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/homeassistant/mosquitto
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: mosquitto
        valueFiles:
          - $repo/kubernetes/apps/homeassistant/mosquitto/values.yaml
    # Kopiur backups of mosquitto-data (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: mosquitto-data-backup
        valuesObject:
          pvc: mosquitto-data
          mover:
            runAsUser: 1000
            runAsGroup: 100
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: homeassistant
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
