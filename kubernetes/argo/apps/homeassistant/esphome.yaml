---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: esphome
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/homeassistant/esphome
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: esphome
        valueFiles:
          - $repo/kubernetes/apps/homeassistant/esphome/values.yaml
    # Kopiur backups of esphome-config (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: esphome-config-backup
        valuesObject:
          pvc: esphome-config
          mover:
            runAsUser: 3000     # the pod's user; the files are 3000-owned since #132
          ignore:
            - /.esphome/platformio
            - /.esphome/build
            - /.esphome/idf_components
            # Framework downloads: the home-operations image sets HOME=/config.
            - /.cache
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: homeassistant
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
