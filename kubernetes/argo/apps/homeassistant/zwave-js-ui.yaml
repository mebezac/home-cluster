---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zwave-js-ui
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/homeassistant/zwave-js-ui
      targetRevision: main
      ref: zwave-js-ui-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: zwave-js-ui
        valueFiles:
          - $zwave-js-ui-repo/kubernetes/apps/homeassistant/zwave-js-ui/values.yaml
    # Kopiur backups of zwave-js-ui-config (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: zwave-js-ui-config-backup
        valuesObject:
          pvc: zwave-js-ui-config
          mover:
            privileged: true
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: homeassistant
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/warn-version: latest
      annotations:
        # Kopiur may run root movers here: homeassistant-config, esphome-config
        # and zwave-js-ui-config are root-owned (kubernetes/charts/kopiur-backup
        # mover.privileged).
        kopiur.home-operations.com/privileged-movers: "true"
    syncOptions:
      - CreateNamespace=true
