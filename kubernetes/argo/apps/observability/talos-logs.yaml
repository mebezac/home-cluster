apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-logs
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/observability/talos-logs
      targetRevision: main
      ref: talos-logs-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: talos-logs
        valueFiles:
          - $talos-logs-repo/kubernetes/apps/observability/talos-logs/values.yaml
  destination:
    name: in-cluster
    namespace: observability
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
