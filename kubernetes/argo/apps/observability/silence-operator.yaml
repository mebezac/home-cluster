apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: silence-operator
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/observability/silence-operator
      targetRevision: main
      ref: silence-operator-repo
    - repoURL: gsoci.azurecr.io/charts/giantswarm
      chart: silence-operator
      # changelog: GH releases giantswarm/silence-operator (CHANGELOG.md); chart version = appVersion = image tag (values.yaml)
      targetRevision: 0.22.0
      helm:
        releaseName: silence-operator
        valueFiles:
          - $silence-operator-repo/kubernetes/apps/observability/silence-operator/values.yaml
    # The Silence CRs (how-to in kustomization.yaml). Same app as the operator, so Argo
    # applies the CRD before the CRs. No PVC: the operator is stateless, so no Kopiur.
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/observability/silences
      targetRevision: main
  destination:
    name: in-cluster
    namespace: observability
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
