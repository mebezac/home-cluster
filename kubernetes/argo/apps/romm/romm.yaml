---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: romm
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/romm/romm
      targetRevision: main
      ref: romm-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: romm
        valueFiles:
          - $romm-repo/kubernetes/apps/romm/romm/values.yaml
    # Kopiur backups of romm-data (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: romm-data-backup
        valuesObject:
          pvc: romm-data
          mover:
            runAsUser: 3000
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: romm
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
