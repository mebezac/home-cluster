---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-barman-cloud
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/database/plugin-barman-cloud
      targetRevision: main
      ref: plugin-barman-cloud-repo
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      # changelog: gh api repos/cloudnative-pg/charts/releases, filtered to plugin-barman-cloud-*.
      # The PR body is worse than empty - Renovate renders the WRONG chart's notes (cluster-v*).
      # The chart appVersion is overridden by the image tags in our values.yaml, so the chart PR and
      # both image PRs must be merged as one set. Bumping the sidecar tag rolls all 3 Postgres
      # instances with a primary switchover - merge just after the @daily backup, not mid-window.
      targetRevision: 0.7.1
      helm:
        releaseName: cloudnative-pg
        valueFiles:
          - $plugin-barman-cloud-repo/kubernetes/apps/database/plugin-barman-cloud/values.yaml
  destination:
    name: in-cluster
    namespace: database
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
