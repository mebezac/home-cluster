apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calibre-web-automated
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/calibre-web-automated/calibre-web-automated
      targetRevision: main
      ref: calibre-web-automated-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: calibre-web-automated
        valueFiles:
          - $calibre-web-automated-repo/kubernetes/apps/calibre-web-automated/calibre-web-automated/values.yaml
    # Kopiur backups of calibre-web-automated-data (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: calibre-web-automated-data-backup
        valuesObject:
          pvc: calibre-web-automated-data
          mover:
            runAsUser: 1000
          restore:
            enabled: true
    # Kopiur backups of calibre-web-automated-media: the Calibre library
    # (books + metadata.db) and the ingest folder, on NFS.
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: calibre-web-automated-media-backup
        valuesObject:
          pvc: calibre-web-automated-media
          copyMethod: Direct
          mover:
            runAsUser: 1000
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: calibre-web-automated
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
