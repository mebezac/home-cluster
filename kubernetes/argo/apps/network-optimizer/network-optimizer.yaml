---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-optimizer
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/network-optimizer/network-optimizer
      targetRevision: main
      ref: network-optimizer-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: network-optimizer
        valueFiles:
          - $network-optimizer-repo/kubernetes/apps/network-optimizer/network-optimizer/values.yaml
    # Kopiur backups of network-optimizer-data (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: network-optimizer-data-backup
        valuesObject:
          pvc: network-optimizer-data
          mover:
            runAsUser: 1654
          restore:
            enabled: true
    # Kopiur backups of network-optimizer-ssh-keys (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: network-optimizer-ssh-keys-backup
        valuesObject:
          pvc: network-optimizer-ssh-keys
          mover:
            runAsUser: 1654
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: network-optimizer
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/warn-version: latest
    syncOptions:
      - CreateNamespace=true
