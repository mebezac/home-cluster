---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    argocd.argoproj.io/instance: argo
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/argo-system/argo-cd
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/argoproj/argo-helm
      chart: argo-cd
      # changelog: Renovate ships NO release notes for this chart. Fastest read is the per-version
      # changelog annotation: `helm show chart oci://ghcr.io/argoproj/argo-helm/argo-cd --version X
      # | sed -n '/artifacthub.io\/changes/,/signKey/p'`, stepped across each intermediate version.
      # Then the decisive check: `helm template` BOTH versions against our values.yaml and diff - an
      # identical render (bar the chart label) proves a no-op, and catches a silently dropped key on
      # the self-managed ArgoCD. Always check Chart.yaml appVersion: a chart minor is often the same
      # ArgoCD build. Bump kubernetes/bootstrap/helmfile.yaml to match.
      targetRevision: 10.8.0
      helm:
        releaseName: argo-cd
        valueFiles:
          - $repo/kubernetes/apps/argo-system/argo-cd/values.yaml
          - $repo/kubernetes/apps/argo-system/argo-cd/values.sops.yaml
  destination:
    name: in-cluster
    namespace: argo-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ClientSideApplyMigration=false
