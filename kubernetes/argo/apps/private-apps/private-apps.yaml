---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private-apps
  namespace: argo-system
spec:
  project: kubernetes
  source:
    repoURL: https://github.com/mebezac/home-cluster-private.git
    path: kubernetes/argo/apps
    targetRevision: main
    directory:
      recurse: true
  destination:
    name: in-cluster
    namespace: argo-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # Only the automated block is ignored (same as apps.yaml), so auto-sync can
  # still be paused by hand on a child app. Ignoring all of /spec/syncPolicy
  # silently dropped git edits to syncOptions and managedNamespaceMetadata.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/syncPolicy/automated
