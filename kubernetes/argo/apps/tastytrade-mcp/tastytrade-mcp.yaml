apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tastytrade-mcp
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/tastytrade-mcp/tastytrade-mcp
      targetRevision: main
      ref: tastytrade-mcp-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: tastytrade-mcp
        valueFiles:
          - $tastytrade-mcp-repo/kubernetes/apps/tastytrade-mcp/tastytrade-mcp/values.yaml
  destination:
    name: in-cluster
    namespace: tastytrade-mcp
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: restricted
