---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocis
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/owncloud/ocis
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: ocis
        valueFiles:
          - $repo/kubernetes/apps/owncloud/ocis/values.yaml
    # Kopiur backups of ocis-data (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: ocis-data-backup
        valuesObject:
          pvc: ocis-data
          tier: critical
          mover:
            runAsUser: 1000
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: owncloud
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
