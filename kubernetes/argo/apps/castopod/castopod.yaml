apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: castopod
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/castopod/castopod
      targetRevision: main
      ref: castopod-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: castopod
        valueFiles:
          - $castopod-repo/kubernetes/apps/castopod/castopod/values.yaml
    # Kopiur backups of castopod-mariadb (kubernetes/charts/kopiur-backup).
    # Media is in the SILO bucket castopod (versioned, replicated to SILO B).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: castopod-mariadb-backup
        valuesObject:
          pvc: castopod-mariadb
          tier: standard   # castopod is not a critical service (user, 2026-11-27)
          mover:
            runAsUser: 3000
          restore:
            enabled: true
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: castopod-mariadb-lts-backup
        valuesObject:
          pvc: castopod-mariadb-lts
          tier: standard
          mover:
            runAsUser: 3000
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: castopod
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
