apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencloud
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/opencloud/opencloud
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: opencloud
        valueFiles:
          - $repo/kubernetes/apps/opencloud/opencloud/values.yaml
    # Kopiur backups of opencloud-data (kubernetes/charts/kopiur-backup). The user
    # files are blobs in SILO A (replicated to B); this PVC holds the metadata that
    # maps them, so it is critical like oCIS was.
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: opencloud-data-backup
        valuesObject:
          pvc: opencloud-data
          tier: critical
          mover:
            runAsUser: 3000
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: opencloud
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
