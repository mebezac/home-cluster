---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/openebs-system/openebs
      targetRevision: main
      ref: repo
    - repoURL: https://openebs.github.io/openebs
      chart: openebs
      targetRevision: 4.6.1
      helm:
        releaseName: openebs
        valueFiles:
          - $repo/kubernetes/apps/openebs-system/openebs/values.yaml
  destination:
    name: in-cluster
    namespace: openebs-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    # localpv-provisioner runs its init/cleanup helper pods (hostPath + privileged) in this
    # namespace; under the cluster-wide baseline PSA they are forbidden and PV deletes stall.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/warn-version: latest
    syncOptions:
    - CreateNamespace=true
