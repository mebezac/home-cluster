---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/kube-system/spegel
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/spegel-org/helm-charts
      chart: spegel
      # changelog: GH releases spegel-org/spegel (not in PR body)
      targetRevision: 0.7.4
      helm:
        releaseName: spegel
        valueFiles:
          - $repo/kubernetes/apps/kube-system/spegel/values.yaml
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Client-side apply merges containerPorts by number only, so the chart's
    # router-quic (5001/UDP) next to router-tcp (5001/TCP) was silently dropped.
    - ServerSideApply=true
