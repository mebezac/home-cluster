---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The bootstrap helmfile installed these objects as field manager `helm`
    # (client-side Update). Under ServerSideApply, fields that `helm` still
    # co-owns survive their removal from values.yaml. The CSA migration moves
    # `helm` ownership to argocd-controller on the next sync. Checked against
    # 1.20.2: the 7 helm-only cilium-config keys are unread or equal to the
    # defaults; dropping the old envoy-admin port rolls every cilium-agent.
    argocd.argoproj.io/client-side-apply-migration-manager: helm
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/kube-system/cilium
      targetRevision: main
      ref: repo
    - repoURL: https://helm.cilium.io
      chart: cilium
      # changelog: cilium GH releases per tag; BREAKING items live only in docs.cilium.io/en/vX.Y/operations/upgrade/#upgrade-notes, never the PR body
      targetRevision: 1.20.2
      helm:
        releaseName: cilium
        valueFiles:
          - $repo/kubernetes/apps/kube-system/cilium/values.yaml
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      name: cilium-agent
      jsonPointers:
        - /spec/endpoints/0/relabelings/0/action
    # The chart regenerates the CA and Hubble certs on every render (helm
    # method; ArgoCD has no `lookup`). Without these, any commit to main
    # flags them OutOfSync and selfHeal rotates the whole chain. Certs now
    # renew only when the Cilium manifests really change (e.g. chart bumps).
    - kind: Secret
      name: cilium-ca
      jsonPointers:
        - /data/ca.crt
        - /data/ca.key
    - kind: Secret
      name: hubble-relay-client-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - kind: Secret
      name: hubble-server-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
