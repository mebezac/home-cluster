apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: l2-fencer
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  # No Kopiur source: no PVC (the fencer keeps no state; its state is the node label).
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/kube-system/l2-fencer
      targetRevision: main
      ref: l2-fencer-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: l2-fencer
        valueFiles:
          - $l2-fencer-repo/kubernetes/apps/kube-system/l2-fencer/values.yaml
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
