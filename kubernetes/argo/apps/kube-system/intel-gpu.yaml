---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-gpu
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/kube-system/intel-gpu
      targetRevision: main
      ref: repo
    - repoURL: https://intel.github.io/helm-charts
      chart: intel-device-plugins-operator
      # changelog: gh release view vX.Y.Z -R intel/intel-device-plugins-for-kubernetes (chart release/PR body are stubs); helm pull + diff crds/ for removed CRDs
      targetRevision: 0.37.2
      helm:
        releaseName: intel-device-plugins-operator
        valuesObject:
          manager:
            # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
            # The chart builds <hub>/intel-deviceplugin-operator:<tag>.
            image:
              hub: intel
              tag: "0.37.2@sha256:2e80ab5a7782bfc049db9159e8c2e4085dce24c06ce4164db854db138900e52f"
    - repoURL: https://intel.github.io/helm-charts
      chart: intel-device-plugins-gpu
      # changelog: gh release view vX.Y.Z -R intel/intel-device-plugins-for-kubernetes (chart release/PR body are stubs); bump together with the operator above, GPU FIRST (or in one commit) - operator >=0.37.1 enforces ImageMinVersion = its own version and its webhook rejects an older plugin image, so the sync fails
      targetRevision: 0.37.2
      helm:
        releaseName: intel-device-plugins-gpu
        valueFiles:
          - $repo/kubernetes/apps/kube-system/intel-gpu/values.yaml
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: deviceplugin.intel.com
      kind: GpuDevicePlugin
      jsonPointers:
        - /spec/resourceManager
