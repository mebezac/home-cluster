---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: kubernetes
  sources:
    # Experimental channel, on the exact version Envoy Gateway bundles (see
    # gateway-crds-helm templates in ../network/envoy-gateway.yaml). Bump the
    # two together.
    - repoURL: https://github.com/kubernetes-sigs/gateway-api
      # changelog: GH releases kubernetes-sigs/gateway-api. MUST equal the bundle-version in gateway-crds-helm templates/*gatewayapi-crds.yaml at the EG version in ../network/envoy-gateway.yaml (also check EG go.mod) - a lone bump here breaks lockstep
      # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
      targetRevision: v1.6.1
      path: config/crd/experimental
  destination:
    name: in-cluster
  syncPolicy:
    automated:
      allowEmpty: true
      prune: false
      selfHeal: true
    syncOptions:
      # The Gateway API CRDs are far too large for the client-side
      # last-applied-configuration annotation.
      - ServerSideApply=true
