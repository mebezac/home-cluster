apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talos-backup
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/kube-system/talos-backup
      targetRevision: main
      ref: talos-backup-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: talos-backup
        valueFiles:
          - $talos-backup-repo/kubernetes/apps/kube-system/talos-backup/values.yaml
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
