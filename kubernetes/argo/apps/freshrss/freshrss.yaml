apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freshrss
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/freshrss/freshrss
      targetRevision: main
      ref: freshrss-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: freshrss
        valueFiles:
          - $freshrss-repo/kubernetes/apps/freshrss/freshrss/values.yaml
    # Kopiur backups of the data PVC (kubernetes/charts/kopiur-backup).
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/charts/kopiur-backup
      targetRevision: main
      helm:
        releaseName: freshrss-data-backup
        valuesObject:
          pvc: freshrss-data
          # The image runs as root; the data is www-data (33) and group-readable.
          mover:
            runAsUser: 33
          restore:
            enabled: true
  destination:
    name: in-cluster
    namespace: freshrss
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
