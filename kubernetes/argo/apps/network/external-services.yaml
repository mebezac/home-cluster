---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-services
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  # Single source, so no `ref:` (an unconsumed ref panics the app-controller).
  source:
    repoURL: https://github.com/mebezac/home-cluster.git
    path: kubernetes/apps/network/external-services
    targetRevision: main
  destination:
    name: in-cluster
    namespace: network
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
