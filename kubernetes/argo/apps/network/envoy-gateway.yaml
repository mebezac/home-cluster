---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # With ServerSideApply, the client-side diff flags every CRD-defaulted
    # field (parentRefs group/kind, default path matches...) as OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: kubernetes
  sources:
    # Gateways, policies, certificates, monitors.
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/network/envoy-gateway
      targetRevision: main
      ref: repo
    # Envoy Gateway's own CRDs only. Gateway API CRDs belong to the
    # `gateway-api-crds` app; keep that on the Gateway API version this chart
    # bundles (gateway-crds-helm/templates/*gatewayapi-crds.yaml bundle-version).
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      targetRevision: v1.9.2
      helm:
        releaseName: envoy-gateway-crds
        valuesObject:
          crds:
            gatewayAPI:
              enabled: false
            envoyGateway:
              enabled: true
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.2
      helm:
        releaseName: envoy-gateway
        valueFiles:
          - $repo/kubernetes/apps/network/envoy-gateway/values.yaml
  destination:
    name: in-cluster
    namespace: network
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The EnvoyProxy/policy CRs are applied in the same sync as their CRDs.
      - SkipDryRunOnMissingResource=true
      # Envoy Gateway's CRDs are too large for client-side apply.
      - ServerSideApply=true
