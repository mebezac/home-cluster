---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/network/tailscale-operator
      targetRevision: main
      ref: repo
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      # changelog: tailscale.com/changelog (GH release bodies and PR body are stubs); real diff = helm template tailscale-operator --version X then diff. Proxy image tag = chart appVersion unless proxyConfig.image is set
      targetRevision: 1.102.3
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $repo/kubernetes/apps/network/tailscale-operator/values.sops.yaml
  destination:
    name: in-cluster
    namespace: network
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/warn-version: latest
    syncOptions:
      - CreateNamespace=true
