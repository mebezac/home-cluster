# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-cd/stable/docs/schemas/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/mebezac/home-cluster.git
      path: kubernetes/apps/security/authelia
      targetRevision: main
      ref: authelia-repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: authelia
        valueFiles:
          - $authelia-repo/kubernetes/apps/security/authelia/values.yaml
  destination:
    name: in-cluster
    namespace: security
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    # Namespace `security` (authelia + lldap) enforces PodSecurity restricted.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: latest
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
