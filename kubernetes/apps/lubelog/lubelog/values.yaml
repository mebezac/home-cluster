defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  lubelog:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          pullPolicy: IfNotPresent
        envFrom: &envFrom
          - secretRef:
              name: lubelog-secret
    containers:
      app:
        image:
          repository: ghcr.io/hargata/lubelogger
          # changelog: GH releases hargata/lubelog - notes understate the diff; check the tag-to-tag
          # compare for controller/routing changes (v1.7.1 moved /images,/documents,/translations,/temp
          # from static middleware to an [Authorize] FilesController route).
          tag: v1.7.4@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2
        env:
          TZ: America/New_York
          LC_ALL: en_US.UTF-8
        envFrom: *envFrom
        resources:
          # 7d metrics (2026-09-08): peak 37Mi, CPU peak 10m.
          requests:
            cpu: 15m
            memory: 64Mi
          limits:
            memory: 192Mi
service:
  app:
    controller: lubelog
    ports:
      http:
        port: 8080
route:
  app:
    hostnames:
      - lubelog.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    globalMounts:
      - path: /App/config
        subPath: config
      - path: /App/data
        subPath: data
      - path: /App/wwwroot/translations
        subPath: translations
      - path: /App/wwwroot/documents
        subPath: documents
      - path: /App/wwwroot/images
        subPath: images
      - path: /App/log
        subPath: log
      - path: /root/.aspnet/DataProtection-Keys
        subPath: keys
  tmp:
    type: emptyDir
    globalMounts:
      - path: /App/wwwroot/temp
