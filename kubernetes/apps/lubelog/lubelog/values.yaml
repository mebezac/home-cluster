defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  lubelog:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          pullPolicy: IfNotPresent
        envFrom: &envFrom
          - secretRef:
              name: lubelog-secret
    containers:
      app:
        image:
          repository: ghcr.io/hargata/lubelogger
          # changelog: GH releases hargata/lubelog - notes understate the diff; check the tag-to-tag
          # compare for controller/routing changes (v1.7.1 moved /images,/documents,/translations,/temp
          # from static middleware to an [Authorize] FilesController route).
          tag: v1.7.3@sha256:c9d2bbb48c7f84d90e54496e2cd60422e56a5f2345c8a539ebe09f77e629d321
        env:
          TZ: America/New_York
          LC_ALL: en_US.UTF-8
        envFrom: *envFrom
        resources:
          # 7d metrics (2026-09-08): peak 37Mi, CPU peak 10m.
          requests:
            cpu: 15m
            memory: 64Mi
          limits:
            memory: 192Mi
service:
  app:
    controller: lubelog
    ports:
      http:
        port: 8080
ingress:
  app:
    className: internal
    hosts:
      - host: lubelog.laboratory.casa
        paths:
          - path: /
            service:
              identifier: app
              port: http
persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    globalMounts:
      - path: /App/config
        subPath: config
      - path: /App/data
        subPath: data
      - path: /App/wwwroot/translations
        subPath: translations
      - path: /App/wwwroot/documents
        subPath: documents
      - path: /App/wwwroot/images
        subPath: images
      - path: /App/log
        subPath: log
      - path: /root/.aspnet/DataProtection-Keys
        subPath: keys
  tmp:
    type: emptyDir
    globalMounts:
      - path: /App/wwwroot/temp
