defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  lubelog:
    annotations:
      reloader.stakater.com/auto: "true"
    # The database and role are CNPG-managed (database/postgres-17-cluster: managed.roles +
    # databases.yaml), so there is no postgres-init container and no superuser password here.
    containers:
      app:
        image:
          repository: ghcr.io/hargata/lubelogger
          # changelog: GH releases hargata/lubelog - notes understate the diff; check the tag-to-tag
          # compare for controller/routing changes (v1.7.1 moved /images,/documents,/translations,/temp
          # from static middleware to an [Authorize] FilesController route).
          tag: v1.7.4@sha256:483a9d7582c4e6258615fd822b3de4193b4fcc4230d0a92432c6d407faf75af2
        env:
          TZ: America/New_York
          LC_ALL: en_US.UTF-8
          # ASP.NET keeps its DataProtection keys in $HOME/.aspnet. The image's
          # HOME is /, and uid 3000 cannot reach /root, so keys stayed in memory
          # and every restart logged everyone out. Point HOME at the keys mount.
          HOME: /home/lubelog
          # --- Login: LubeLogger's own OIDC login through Authelia (client "LubeLogger"
          # in security/authelia/authelia-config.yaml). EnableAuth is pinned in the
          # pinned-config ConfigMap below, not here.
          # The owner's Authelia email logs in as the LubeLogger root user (full admin,
          # owns the existing vehicles). No local root password exists.
          EnableRootUserOIDC: "true"
          DefaultReminderEmail: zac@laboratory.casa
          # Nobody else gets in: an unknown Authelia email gets "registration disabled".
          # To add a household member, set both to "false", then issue them a token
          # from Settings > Admin Panel.
          DisableRegistration: "true"
          OpenIDConfig__DisableRegistration: "true"
          OpenIDConfig__Name: Authelia
          OpenIDConfig__ClientId: "LOYWT47d~JAauDOUMEyorQxtRQj9jnq7sql6mGo9v.L_aAu_QeKOI6DApix-yLWk4.~D~J2e"
          OpenIDConfig__AuthURL: https://login.laboratory.casa/api/oidc/authorization
          OpenIDConfig__TokenURL: https://login.laboratory.casa/api/oidc/token
          OpenIDConfig__UserInfoURL: https://login.laboratory.casa/api/oidc/userinfo
          OpenIDConfig__JwksURL: https://login.laboratory.casa/jwks.json
          OpenIDConfig__RedirectURL: https://lubelog.laboratory.casa/Login/RemoteAuth
          OpenIDConfig__Scope: openid email
          OpenIDConfig__ValidateState: "true"
          OpenIDConfig__UsePKCE: "true"
          # With a LogOutURL, /Login goes straight to Authelia (no local login form).
          OpenIDConfig__DisableRegularLogin: "true"
          OpenIDConfig__LogOutURL: https://login.laboratory.casa/logout
          # Key-per-file config dir. LubeLogger loads it AFTER data/config/userConfig.json,
          # so it wins over that file: the settings-page "disable login" button (which
          # writes EnableAuth=false there) cannot turn auth off.
          LUBELOGGER_SECRETS_PATH: /pinned-config
        envFrom:
          # POSTGRES_CONNECTION, and OpenIDConfig__ClientSecret (plaintext of the Authelia
          # client digest). The PG password must match database/postgres-17-cluster/roles/lubelog.sops.yaml
          - secretRef:
              name: lubelog-secret
        resources:
          # 7d metrics (2026-09-08): peak 37Mi, CPU peak 10m.
          requests:
            cpu: 15m
            memory: 64Mi
          limits:
            memory: 192Mi
configMaps:
  pinned-config:
    data:
      # One file per config key (see LUBELOGGER_SECRETS_PATH). Login is always on.
      EnableAuth: "true"
service:
  app:
    controller: lubelog
    ports:
      http:
        port: 8080
route:
  app:
    hostnames:
      - lubelog.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore lubelog-data, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: lubelog-data
    globalMounts:
      - path: /App/config
        subPath: config
      - path: /App/data
        subPath: data
      - path: /App/wwwroot/translations
        subPath: translations
      - path: /App/wwwroot/documents
        subPath: documents
      - path: /App/wwwroot/images
        subPath: images
      - path: /App/log
        subPath: log
      - path: /home/lubelog/.aspnet/DataProtection-Keys
        subPath: keys
  tmp:
    type: emptyDir
    globalMounts:
      - path: /App/wwwroot/temp
  pinned-config:
    type: configMap
    identifier: pinned-config
    globalMounts:
      - path: /pinned-config
        readOnly: true
