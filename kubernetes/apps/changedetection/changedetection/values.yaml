defaultPodOptions:
  securityContext:
    # The app container runs as 3000 (below). browserless runs as its own
    # non-root user (999), so runAsUser is set per container, not here.
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  changedetection:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/dgtlmoon/changedetection.io
          # changelog: GH releases dgtlmoon/changedetection.io - upstream SKIPS minor numbers
          # (0.55.8 -> 0.60.1 direct; no 0.56-0.59 ever existed), so a "5-minor" bump is usually one
          # release cycle: check the tag list, not the version delta. Datastore compat is
          # settings.application.schema_version (33 as of 0.60.3), NOT the app version - equal
          # numbers on both tags means run_updates() is a no-op and a downgrade stays possible. When
          # a migration does run the app writes its own before-update-N-<ts>.tar.gz into /datastore.
          # Driver contract to re-check on any bump: content_fetchers/__init__.py still reading
          # PLAYWRIGHT_DRIVER_URL (our browserless sidecar).
          tag: 0.60.9@sha256:04eaae7915bad711160cb15abe160f6d3fabe98bbbd658509d4b7a654000fb2d
        env:
          TZ: America/New_York
          PORT: &port 5000
          USE_X_SETTINGS: 1
          # Links in notifications ({{ base_url }}); the UI field is empty, so env wins.
          BASE_URL: https://changedetection.laboratory.casa
          PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/browserless-cache-123
          # The image's HOME is /root, which uid 3000 cannot write.
          HOME: /tmp
        securityContext:
          runAsUser: 3000
          runAsGroup: 3000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 ~72Mi.
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
      browser:
        image:
          repository: ghcr.io/browserless/chrome
          # changelog: GH releases browserless/browserless (NOT browserless/chrome - image name != repo name); Renovate embeds full notes
          tag: v2.57.2@sha256:57eebdb0314a35065023f6339a70aad329919dea5ef6e91ab11cf24955349d6a
          pullPolicy: IfNotPresent
        env:
          SCREEN_WIDTH: "1920"
          SCREEN_HEIGHT: "1024"
          SCREEN_DEPTH: "16"
          ENABLE_DEBUGGER: "false"
          CONNECTION_TIMEOUT: "300000"
          MAX_CONCURRENT_SESSIONS: "10"
        resources:
          # non-file memory, 14d to 2026-10-21: p99 277Mi, max 281Mi (idle Chrome).
          requests:
            cpu: 10m
            memory: 320Mi
          limits:
            memory: 1Gi
service:
  app:
    controller: changedetection
    ports:
      http:
        port: *port
route:
  app:
    # No OIDC upstream; the built-in single password has no 2FA. Authelia
    # forward auth (./authelia.yaml) gives SSO + 2FA.
    labels:
      auth: authelia
    hostnames:
      - changedetection.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
persistence:
  config:
    forceRename: changedetection
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 512Mi
    globalMounts:
      - path: /datastore
  tmp:
    type: emptyDir
    advancedMounts:
      changedetection:
        app:
          - path: /tmp
