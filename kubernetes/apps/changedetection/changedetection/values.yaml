controllers:
  changedetection:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/dgtlmoon/changedetection.io
          # changelog: GH releases dgtlmoon/changedetection.io - upstream SKIPS minor numbers
          # (0.55.8 -> 0.60.1 direct; no 0.56-0.59 ever existed), so a "5-minor" bump is usually one
          # release cycle: check the tag list, not the version delta. Datastore compat is
          # settings.application.schema_version (33 as of 0.60.3), NOT the app version - equal
          # numbers on both tags means run_updates() is a no-op and a downgrade stays possible. When
          # a migration does run the app writes its own before-update-N-<ts>.tar.gz into /datastore.
          # Driver contract to re-check on any bump: content_fetchers/__init__.py still reading
          # PLAYWRIGHT_DRIVER_URL (our browserless sidecar).
          tag: 0.60.3@sha256:ecacd9fd0c664a786b77daadbbbf51373519b29178a32df3ddbc5c594bc067ed
        env:
          TZ: America/New_York
          PORT: &port 5000
          USE_X_SETTINGS: 1
          PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/browserless-cache-123
      browser:
        image:
          repository: ghcr.io/browserless/chrome
          # changelog: GH releases browserless/browserless (NOT browserless/chrome - image name != repo name); Renovate embeds full notes
          tag: v2.56.3@sha256:2b765cb559d87f6801642a68211a8653c16d1546ca5b36e7278da9f7528734da
          pullPolicy: IfNotPresent
        env:
          SCREEN_WIDTH: "1920"
          SCREEN_HEIGHT: "1024"
          SCREEN_DEPTH: "16"
          ENABLE_DEBUGGER: "false"
          PREBOOT_CHROME: "true"
          CONNECTION_TIMEOUT: "300000"
          MAX_CONCURRENT_SESSIONS: "10"
          CHROME_REFRESH_TIME: "600000"
          DEFAULT_BLOCK_ADS: "true"
          DEFAULT_STEALTH: "true"
service:
  app:
    controller: changedetection
    ports:
      http:
        port: *port
ingress:
  app:
    enabled: true
    className: internal
    hosts:
      - host: changedetection.laboratory.casa
        paths:
          - path: /
            service:
              identifier: app
              port: http
persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 512Mi
    globalMounts:
      - path: /datastore
