---
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  romm:
    labels:
      reloader.stakater.com/auto: "true"

    initContainers:
      postgres-init:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom: &envFrom
          - secretRef:
              name: romm-secret

      fix-permissions:
        image:
          repository: busybox
          # was `stable`, a moving tag. Proof it drifts: on 2026-09-08 `stable`
          # resolved to 73aaf090 while this cluster was still running 4b8407fa.
          # 1.38.0 is the newest release (identical digest to `latest`).
          tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e

        command:
          [
            "sh",
            "-c",
            "mkdir -p /romm/config /romm/assets && chown -R 3000:3000 /romm/config && chown -R 3000:3000 /romm/assets",
          ]

        securityContext:
          runAsNonRoot: false
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            { add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"], drop: ["ALL"] }

    containers:
      app:
        image:
          repository: ghcr.io/rommapp/romm
          # changelog: GH releases rommapp/romm. Alembic migrations run on startup; MariaDB-only warnings in the notes do NOT apply (we use ROMM_DB_DRIVER=postgresql)
          tag: 5.3.1@sha256:0d66b4ea152a237c7f24b95e87459f46d3c596a7c0b35a82f26bc971487278b3

        env:
          ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: "true"
          ENABLE_SCHEDULED_CONVERT_IMAGES_TO_WEBP: "true"
          ENABLE_SCHEDULED_RESCAN: "true"
          HASHEOUS_API_ENABLED: "true"
          HLTB_API_ENABLED: "true"
          OIDC_ENABLED: "true"
          OIDC_PROVIDER: authelia
          OIDC_REDIRECT_URI: https://romm.laboratory.casa/api/oauth/openid
          OIDC_SERVER_APPLICATION_URL: https://login.laboratory.casa
          REDIS_DB: "6"
          REDIS_HOST: valkey.valkey.svc.cluster.local
          REDIS_PORT: "6379"
          RESCAN_ON_FILESYSTEM_CHANGE_DELAY: "5"
          ROMM_DB_DRIVER: postgresql
          SCHEDULED_RESCAN_CRON: "0 3 * * *"
          SCAN_TIMEOUT: "72000"
          SCAN_WORKERS: "3"
          TASK_TIMEOUT: "14400"
          TZ: America/Detroit
          # 5.3.0 raised the default from 1 to 4 API workers; memory limit below
          # was sized for 1 (peak 659Mi). Raise alongside the limit if needed.
          WEB_SERVER_CONCURRENCY: "2"
        envFrom: *envFrom
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          # 7d metrics (2026-09-08): peak 659Mi, p95 558Mi. Previously had NO
          # memory limit at all - an unbounded ceiling on a shared node.
          requests:
            cpu: 10m
            memory: 768Mi
          limits:
            memory: 1536Mi

service:
  app:
    controller: romm
    ports:
      http:
        port: 8080

ingress:
  app:
    enabled: true
    className: internal
    hosts:
      - host: romm.laboratory.casa
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 512Mi
    globalMounts:
      - path: /romm/config
        subPath: config
      - path: /romm/assets
        subPath: assets

  nas:
    enabled: true
    type: nfs
    server: nas.laboratory.casa
    path: /mnt/data/10tb/romm
    advancedMounts:
      romm:
        app:
          - path: /romm/library
            subPath: library
          - path: /romm/resources
            subPath: resources

  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
