---
controllers:
  main:
    replicas: 1
    containers:
      db18:
        image:
          repository: ghcr.io/immich-app/postgres
          # changelog: GH releases tensorchord/VectorChord + pgvector/pgvector; image build lives in
          # immich-app/base-images/postgres (Renovate ships NO notes for this image). A vchord major
          # (0.5->1.x) is auto-migrated by Immich on the next immich-server bootstrap: it drops
          # clip_index/face_index, runs ALTER EXTENSION, rebuilds and vacuums. NOT REVERSIBLE - once
          # it has run, the older image fatals with invalidDowngrade. Supported range is
          # VECTORCHORD_VERSION_RANGE in the immich server's constants.ts.
          tag: 18-vectorchord0.5.3-pgvector0.8.1@sha256:828081a755d3911a2d94f0a2be9f98570c07d52cf080fd310a9d6e4b83b73aa5
        env:
          POSTGRES_INITDB_ARGS: --data-checksums
          PGDATA: /var/lib/postgresql18/data
          PGPORT: 5433
        envFrom:
          - secretRef:
              name: immich-db-secret
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            memory: 2Gi

      metrics:
        image:
          repository: quay.io/prometheuscommunity/postgres-exporter
          # changelog: GH releases prometheus-community/postgres_exporter (not in PR body)
          tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
        env:
          DATA_SOURCE_URI: localhost:5433/postgres?sslmode=disable
        envFrom:
          - secretRef:
              name: immich-db-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
service:
  db18:
    ports:
      postgres:
        port: 5433
  metrics:
    ports:
      metrics:
        port: 9187

serviceMonitor:
  main:
    enabled: true
    serviceName: immich-db-metrics
    endpoints:
      - port: metrics

persistence:
  data-18:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data-18
    size: 10Gi
    advancedMounts:
      main:
        db18:
          - path: /var/lib/postgresql18/data
            subPath: postgresql-data
