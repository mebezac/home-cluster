---
controllers:
  main:
    replicas: 1
    containers:
      db18:
        image:
          repository: ghcr.io/immich-app/postgres
          # changelog: GH releases tensorchord/VectorChord + pgvector/pgvector; image build lives in
          # immich-app/base-images/postgres (Renovate ships NO notes for this image). A vchord major
          # (0.5->1.x) is auto-migrated by Immich on the next immich-server bootstrap: it drops
          # clip_index/face_index, runs ALTER EXTENSION, rebuilds and vacuums. NOT REVERSIBLE - once
          # it has run, the older image fatals with invalidDowngrade. Supported range is
          # VECTORCHORD_VERSION_RANGE in the immich server's constants.ts. Digest bumps: diff the
          # org.opencontainers.image.revision labels via gh api repos/immich-app/base-images/compare/<old>...<new>
          # (the entrypoint was rewritten in 4ed03f6; our explicit PGDATA keeps the data in place).
          tag: 18-vectorchord1.1.1-pgvector0.8.7@sha256:f7388adc1e3414800a71506528917f4f5615249f5fe7a872b1e1431e01b72ad7
        env:
          POSTGRES_INITDB_ARGS: --data-checksums
          PGDATA: /var/lib/postgresql18/data
          PGPORT: 5433
        envFrom:
          - secretRef:
              name: immich-db-secret
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 901Mi, max 992Mi. Mostly shared_buffers (shared memory), which
          # RSS does not show (RSS max 343Mi). CPU p95 4m.
          requests:
            cpu: 100m
            memory: 960Mi
          limits:
            memory: 2Gi

      metrics:
        image:
          repository: quay.io/prometheuscommunity/postgres-exporter
          # changelog: GH releases prometheus-community/postgres_exporter (not in PR body)
          tag: v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
        env:
          DATA_SOURCE_URI: localhost:5433/postgres?sslmode=disable
        envFrom:
          - secretRef:
              name: immich-db-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
service:
  db18:
    ports:
      postgres:
        port: 5433
  metrics:
    ports:
      metrics:
        port: 9187

serviceMonitor:
  main:
    enabled: true
    serviceName: immich-db-metrics
    endpoints:
      - port: metrics

persistence:
  data-18:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data-18
    size: 10Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore immich-db-data-18, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: immich-db-data-18
    advancedMounts:
      main:
        db18:
          - path: /var/lib/postgresql18/data
            subPath: postgresql-data
