---
# Renovate for the Forgejo repos renovate-bot can reach under laboratory-casa/* (and zac/*).
# laboratory-casa: the org team "renovate" (renovate-bot, Admin on all repos; Admin lets
# webhook sync add each repo's hook) covers every org repo, so onboarding = commit a
# renovate.json5 extending local>laboratory-casa/renovate-config (requireConfig=required
# skips repos without one; they get an onboarding PR instead). zac/* repos need
# renovate-bot added as an Admin collaborator.
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
  annotations:
    # The CRD comes from the chart in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Discovery + a run of every repo. Each repo's own `schedule` still decides
  # when PRs may open; Dashboard/PR checkboxes run immediately via the webhook.
  schedule: "0 * * * *"
  # changelog: GH releases renovatebot/renovate (list releases between tags; same source as npm:renovate in .mise.toml)
  image: ghcr.io/renovatebot/renovate:44.216.6@sha256:74f5dc522205c4bf147571e44aaa385b780d5f0fad92b4d0016f14594a543e43
  parallelism: 1
  provider:
    name: forgejo
    endpoint: https://git.laboratory.casa
  discoveryFilters:
    - "laboratory-casa/*"
    - "zac/*"
  skipForks: true
  # renovate-secret: RENOVATE_TOKEN (renovate-bot PAT) and, for github.com
  # changelog/tag lookups without the 60 req/h anonymous limit, RENOVATE_GITHUB_COM_TOKEN.
  secretRef: renovate-secret
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "gitAuthor": "Renovate Bot <renovate-bot@laboratory.casa>",
        "onboarding": true,
        "requireConfig": "required",
        "onboardingConfig": {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": ["config:recommended"]
        }
      }
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
    # Adds/removes a Pull request + Issues hook on every discovered repo.
    sync:
      enabled: true
