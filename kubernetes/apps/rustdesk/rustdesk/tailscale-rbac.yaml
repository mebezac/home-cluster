---
# Allows the in-pod Tailscale sidecar (containerboot) to persist its tailnet
# node identity in Secret rustdesk-tailscale-state so its Tailscale IP stays
# stable across restarts. Running Tailscale inside the rustdesk pod (kernel
# tun mode) avoids the SNAT of tailscale-operator's Service proxy, so hbbs sees
# each client's real Tailscale IP instead of one shared proxy IP.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustdesk-tailscale
  namespace: rustdesk
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Create cannot be restricted by resourceName.
    verbs: ["create"]
  - apiGroups: [""]
    resourceNames: ["rustdesk-tailscale-state"]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustdesk-tailscale
  namespace: rustdesk
subjects:
  - kind: ServiceAccount
    name: rustdesk
    namespace: rustdesk
roleRef:
  kind: Role
  name: rustdesk-tailscale
  apiGroup: rbac.authorization.k8s.io
