controllers:
  main:
    pod:
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        runAsNonRoot: true
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44]
    containers:
      main:
        # Pinchflat-NGX, the maintained fork of kieraneglin/pinchflat (idle since Dec 2025).
        # SQLite image (the -postgres tags are the Postgres build). It upgrades the upstream
        # SQLite DB in /config on first start. Upgrade notes per release:
        # https://github.com/TheBadFella/Pinchflat-NGX/wiki/Upgrading-and-Rollback
        image:
          repository: ghcr.io/thebadfella/pinchflat-ngx
          tag: 2026.11.3@sha256:1836ed78d46ea99755316e2cf9e5c401af04431e6fbbac779171ae397f5db717
        env:
          TZ: America/Detroit
          PORT: &port 80
          # The bgutil PO-token sidecar below. NGX bundles the matching yt-dlp plugin and
          # turns it on only when this is set (Settings > Diagnostics > Test Provider).
          POT_PROVIDER_URL: http://127.0.0.1:4416
          # Runs as 3000 through the pod securityContext (NGX "direct user" mode). No
          # PUID/PGID: those are for a root start that drops privileges.
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 238Mi, max 360Mi. working_set reaches ~1Gi from download page
          # cache. The 2026-10-02 OOM kill was at a 1Gi limit; keep the 2Gi limit.
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            gpu.intel.com/i915: 1
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
      # bgutil PO-token provider for YouTube. Listens on localhost only, so nothing
      # outside the pod reaches it. Keep its version in step with the plugin that the
      # NGX image bundles (BGUTIL_PLUGIN_VERSION in NGX's docker/selfhosted.Dockerfile).
      pot-provider:
        image:
          repository: docker.io/brainicism/bgutil-ytdlp-pot-provider
          tag: 2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
        args: ["--host", "127.0.0.1"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

service:
  main:
    controller: main
    ports:
      http:
        port: *port

route:
  main:
    # Pinchflat has no login of its own (no BASIC_AUTH_* or OIDC_* set). Authelia via
    # ./authelia.yaml. Nothing subscribes to its RSS feeds. NGX can do OIDC itself, but
    # that needs an Authelia client and a secret for no gain over this forward auth.
    labels:
      auth: authelia
    hostnames:
      - pinchflat.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    # 256Mi was 79% full before NGX (DB 29M, logs 49M, metadata 93M); NGX adds 12+ SQLite
    # migrations (table rebuilds need free space) and keeps more state here.
    size: 1Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore pinchflat-config, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: pinchflat-config
    advancedMounts:
      main:
        main:
          - path: /config
  media:
    enabled: true
    type: persistentVolumeClaim
    storageClass: freenas-api-nfs
    accessMode: ReadWriteMany
    suffix: media
    size: 1Ti
    advancedMounts:
      main:
        main:
          - path: /downloads
  tmpfs:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /etc/yt-dlp
            subPath: yt-dlp
          - path: /tmp
            subPath: tmp
