---
defaultPodOptions:
  securityContext:
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: "OnRootMismatch"

controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/jellyfin/jellyfin
          tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
        resources:
          # 7d metrics (2026-09-08): peak 1.1Gi during transcoding, p95 770Mi.
          # The peak came from an OLDER pod generation - the running pod was
          # only at 183Mi, so a snapshot would have sized this far too low and
          # OOM-killed a transcode. 2Gi limit keeps ~2x headroom over the peak.
          requests:
            cpu: 100m
            gpu.intel.com/i915: 1
            memory: 768Mi
          limits:
            gpu.intel.com/i915: 1
            memory: 2Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8096

ingress:
  main:
    annotations:
      external-dns.alpha.kubernetes.io/target: external.laboratory.casa
      bothy.dev/enabled: "true"
      bothy.dev/name: "Jellyfin"
      bothy.dev/description: "Movies, shows & music"
      bothy.dev/section: "Media"
      bothy.dev/icon: "sh:jellyfin"
    enabled: true
    className: external
    hosts:
      - host: jellyfin.laboratory.casa
        paths:
          - path: /
            pathType: ImplementationSpecific
            service:
              identifier: main
              port: http

persistence:
  media:
    enabled: true
    type: nfs
    server: nas.laboratory.casa
    path: /mnt/data/10tb/Media
    globalMounts:
      - path: /Media
  pinchflat:
    existingClaim: pinchflat-media
    globalMounts:
      - path: /pinchflat
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 5Gi
    globalMounts:
      - path: /config
        subPath: config
      - path: /cache
        subPath: cache

  transcodes:
    enabled: true
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    accessMode: ReadWriteOnce
    suffix: transcodes
    size: 60Gi
    globalMounts:
      - path: /transcodes
