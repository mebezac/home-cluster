apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generators:
  - secret-generator.yaml
configMapGenerator:
  - name: freshrss-config
    files:
      - config/config-user.custom.php
      - config/prompt.md
  # Vendored extension (see ext/SOURCE.txt); mounted with items so i18n/ keeps its layout.
  - name: freshrss-ext-llm
    files:
      - ext/extension.php
      - ext/metadata.json
      - ext/configure.phtml
      - ext/i18n-en-ext.php
      - ext/i18n-fr-ext.php
generatorOptions:
  disableNameSuffixHash: true
