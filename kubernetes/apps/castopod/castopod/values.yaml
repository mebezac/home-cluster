# Castopod (podcast hosting): https://pod.laboratory.casa, public on envoy-external.
# Moved from Docker on nuc02 (infra roles/castopod) on 2026-11-19.
#
# Media lives in the SILO A bucket `castopod` (S3 file manager), NOT on a PVC.
# Castopod links media as CP_MEDIA_BASEURL + <key> (it does not use the S3
# endpoint for URLs), so CP_MEDIA_BASEURL is https://pod.laboratory.casa/media/
# and the HTTPRoute `castopod-media` in network (external-services/silo.yaml)
# rewrites /media/<key> to /castopod/<key> on SILO A. That keeps the URLs the
# nuc02 file manager used. The bucket allows anonymous GetObject (silo-tofu
# public_read); Castopod also uploads with ACL public-read, which SILO accepts.
# Known S3-mode limit: Castopod writes ID3 tags only to local files, so audio
# uploaded here keeps the tags it had.
#
# Database: Castopod supports only MySQL/MariaDB (MySQLi driver, MySQL stored
# procedures in the analytics module), so it has its own MariaDB below instead
# of the central Postgres (restored from the nuc02 dump on 2026-11-19).
# Cache: central valkey, DB index 2.
#
# The image's bootstrap writes /app/.env from the CP_* variables and prints it
# to the pod log, secrets included (upstream behaviour).
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  castopod:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      # The image runs as www-data (33): /app is mode 550 owned by www-data and
      # the bootstrap writes /app/.env, so uid 3000 cannot start it.
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
    containers:
      app:
        image:
          repository: docker.io/castopod/castopod
          # changelog: https://code.castopod.org/adaures/castopod/-/releases. DB
          # migrations run at start (spark castopod:database-update).
          tag: 1.15.7@sha256:9479cd65c4c933bb151838c8da784d284742d56b2fa74ce2cf0be4168f1dc6f0
        env:
          TZ: America/New_York
          # s6-overlay fixes a root-owned /run with a setuid helper, which
          # allowPrivilegeEscalation: false blocks. Its Kubernetes path: the
          # tmpfs `run` volume below (root:33, group-writable) plus this flag.
          S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
          CP_BASEURL: https://pod.laboratory.casa
          CP_MEDIA_BASEURL: https://pod.laboratory.casa/media/
          CP_DATABASE_HOSTNAME: castopod-mariadb-lts
          CP_DATABASE_NAME: castopod
          CP_DATABASE_USERNAME: castopod
          CP_REDIS_HOST: valkey.valkey.svc.cluster.local
          CP_REDIS_PORT: "6379"
          CP_REDIS_DATABASE: "2"
          CP_MEDIA_FILE_MANAGER: s3
          CP_MEDIA_S3_ENDPOINT: http://silo.network.svc.cluster.local:9000
          CP_MEDIA_S3_REGION: us-east-1
          CP_MEDIA_S3_BUCKET: castopod
          CP_MEDIA_S3_PATH_STYLE_ENDPOINT: "true"
          CP_EMAIL_SMTP_HOST: smtp.fastmail.com
          CP_EMAIL_SMTP_PORT: "587"
          CP_EMAIL_SMTP_CRYPTO: tls
          CP_EMAIL_FROM: admin@laboratory.casa
          PHP_MEMORY_LIMIT: 1024M
          PHP_MAX_EXECUTION_TIME: "900"
          # Real client IPs for analytics: trust X-Forwarded-For from Envoy (pod CIDR).
          app_proxyIPs: '{"10.69.0.0/16":"X-Forwarded-For"}'
        envFrom:
          - secretRef:
              name: castopod-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: &health
                path: /health
                port: 8080
                # forceGlobalSecureRequests would redirect a plain-http probe.
                httpHeaders:
                  - name: X-Forwarded-Proto
                    value: https
              periodSeconds: 5
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 10
              timeoutSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          # The image's frankenphp binary has the file capability
          # cap_net_bind_service; without it in the bounding set exec fails
          # with "Operation not permitted" (it still listens on 8080 only).
          capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
        resources:
          requests: { cpu: 20m, memory: 256Mi }
          limits: { memory: 1536Mi }

  mariadb:
    # Keep this controller and its original claim for rollback.
    replicas: 0
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app: &mariadb-container
        image:
          repository: docker.io/library/mariadb
          # Keep MariaDB 13 paired with the original data directory.
          tag: 13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
        args:
          - --innodb-buffer-pool-size=128M
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci
        env: &mariadb-env
          TZ: America/New_York
          MARIADB_DATABASE: castopod
          MARIADB_USER: castopod
          # Runs mariadb-upgrade after a version bump.
          MARIADB_AUTO_UPGRADE: "1"
        envFrom:
          - secretRef:
              name: castopod-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec: &mariadb-startup
              exec: &dbcheck
                command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
              periodSeconds: 5
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec: &mariadb-liveness
              exec: *dbcheck
              periodSeconds: 30
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec: &mariadb-readiness
              exec: *dbcheck
              periodSeconds: 10
              timeoutSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 10m, memory: 192Mi }
          limits: { memory: 768Mi }

  mariadb-lts:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        <<: *mariadb-container
        image: &mariadb-lts-image
          repository: docker.io/library/mariadb
          # changelog: mariadb.com release notes. Stay on the LTS line: supportType in MariaDB/mariadb-docker versions.json (Renovate caps mariadb below 13)
          tag: 12.3.3@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
        args:
          - --datadir=/var/lib/mysql/data
          - --innodb-buffer-pool-size=128M
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci
        env:
          <<: *mariadb-env
          MARIADB_ROOT_HOST: localhost
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              <<: *mariadb-startup
              exec: &lts-dbcheck
                command:
                  - healthcheck.sh
                  - --defaults-extra-file=/var/lib/mysql/data/.my-healthcheck.cnf
                  - --connect
                  - --innodb_initialized
          liveness:
            enabled: true
            custom: true
            spec:
              <<: *mariadb-liveness
              exec: *lts-dbcheck
          readiness:
            enabled: true
            custom: true
            spec:
              <<: *mariadb-readiness
              exec: *lts-dbcheck

  mariadb-dump:
    type: cronjob
    cronjob:
      schedule: "15 0 * * *"
      timeZone: America/New_York
      concurrencyPolicy: Forbid
      activeDeadlineSeconds: 180
      backoffLimit: 1
      suspend: false
    pod:
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          # The database and dump share one ReadWriteOnce volume.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: castopod
                  app.kubernetes.io/controller: mariadb-lts
    containers:
      dump:
        image: *mariadb-lts-image
        env:
          MARIADB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: castopod-secret
                key: MARIADB_PASSWORD
        command: ["/bin/bash", "-ec"]
        args:
          - |
            set -o pipefail
            export MYSQL_PWD="$MARIADB_PASSWORD"
            umask 077
            dump=/var/lib/mysql/dumps/castopod.sql.gz
            mkdir -p "$(dirname "$dump")"
            mariadb-dump --protocol=tcp --host=castopod-mariadb-lts --user=castopod \
              --single-transaction --routines --triggers --events --hex-blob --databases castopod \
              | gzip -c > "$dump.tmp"
            gzip -t "$dump.tmp"
            gzip -cd "$dump.tmp" | tail -1 | grep -q '^-- Dump completed on '
            mv -f "$dump.tmp" "$dump"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }

# The image's s6 bootstrap (prepare-environment.sh) prints the whole generated
# /app/.env at every start: DB, valkey, SILO and SMTP secrets went into
# VictoriaLogs (2026-11-20). Replace the oneshot's `up` file with a wrapper that
# runs the UNCHANGED upstream script and redacts secret values in its output, so
# image upgrades keep their own bootstrap logic. pipefail keeps the script's exit
# status. Check the key list when the bootstrap script changes upstream.
configMaps:
  bootstrap:
    data:
      up: |
        #!/command/with-contenv sh
        /etc/s6-overlay/s6-rc.d/bootstrap/prepare-environment-quiet.sh
      prepare-environment-quiet.sh: |
        #!/command/with-contenv bash
        set -o pipefail
        /etc/s6-overlay/s6-rc.d/bootstrap/prepare-environment.sh 2>&1 \
          | sed -u -E 's/^((database\.default\.password|cache\.redis\.password|media\.s3\.(key|secret)|email\.SMTP(User|Pass)|analytics\.salt|restapi[._]basicAuth[A-Za-z]*)=).*/\1<redacted>/'

service:
  app:
    controller: castopod
    ports:
      http:
        port: 8080
  mariadb:
    controller: mariadb
    ports:
      mysql:
        port: 3306
  mariadb-lts:
    controller: mariadb-lts
    ports:
      mysql:
        port: 3306

route:
  # Public site, feeds, audio redirects (/audio/...), fediverse. /media/* is the
  # castopod-media route in network (SILO), which wins by longer prefix.
  app:
    hostnames:
      - pod.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
        filters:
          # Castopod analytics (client_ip()) read the WHOLE X-Forwarded-For as
          # one IP, so "visitor, cloudflared-pod" fails the GeoIP lookup and every
          # hit counts as country N/A. Send only the client IP Envoy detected
          # (it trusts X-Forwarded-For from the cloudflared pods).
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Forwarded-For
                  value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
  # Admin and login pages behind Authelia (SecurityPolicy authelia.yaml in this
  # namespace; `*.laboratory.casa` rule = group apps_admin), then Castopod's own login.
  admin:
    labels:
      auth: authelia
    hostnames:
      - pod.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - matches:
          - path: { type: PathPrefix, value: /cp-admin }
          - path: { type: PathPrefix, value: /cp-auth }
        backendRefs:
          - identifier: app
            port: http

persistence:
  mariadb:
    type: persistentVolumeClaim
    suffix: mariadb # pins the name to castopod-mariadb
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore castopod-mariadb,
    # kopiur-backup source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: castopod-mariadb
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    advancedMounts:
      mariadb:
        app:
          - path: /var/lib/mysql
  mariadb-lts:
    type: persistentVolumeClaim
    suffix: mariadb-lts
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: castopod-mariadb-lts
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    advancedMounts:
      mariadb-lts:
        app:
          - path: /var/lib/mysql
      mariadb-dump:
        dump:
          - path: /var/lib/mysql
  run:
    type: emptyDir
    medium: Memory
    sizeLimit: 64Mi
    advancedMounts:
      castopod:
        app:
          - path: /run
  bootstrap:
    type: configMap
    identifier: bootstrap
    defaultMode: 0555
    advancedMounts:
      castopod:
        app:
          - path: /etc/s6-overlay/s6-rc.d/bootstrap/up
            subPath: up
            readOnly: true
          - path: /etc/s6-overlay/s6-rc.d/bootstrap/prepare-environment-quiet.sh
            subPath: prepare-environment-quiet.sh
            readOnly: true
