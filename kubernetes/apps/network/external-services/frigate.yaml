---
# Frigate NVR: 10.25.30.10:5000, served as frigate.laboratory.casa on envoy-external.
apiVersion: v1
kind: Service
metadata:
  name: frigate
spec:
  ports:
    - name: http
      port: 5000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: frigate
  labels:
    kubernetes.io/service-name: frigate
    endpointslice.kubernetes.io/managed-by: home-cluster
addressType: IPv4
ports:
  - name: http
    port: 5000
endpoints:
  - addresses:
      - 10.25.30.10
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  labels:
    # Authelia, via kubernetes/apps/network/envoy-gateway/authelia.yaml.
    auth: authelia
spec:
  parentRefs:
    - name: envoy-external
      sectionName: https
  hostnames:
    - frigate.laboratory.casa
  rules:
    - backendRefs:
        - name: frigate
          port: 5000
