---
# Frigate NVR on nuc02, served as frigate.laboratory.casa on envoy-external.
# Authelia logs the user in, then Envoy sends Authelia's Remote-User and
# Remote-Groups to Frigate's authenticated port 8971 (plain HTTP, TLS off in
# Frigate). Frigate maps the groups to roles (infra repo, nuc02_frigate role:
# apps_admin -> admin, apps_user and frigate_only -> viewer). Port 8971 rejects
# any request without the X-Proxy-Secret header that the filter below adds, so
# no other LAN client can forge those headers. Port 5000 (no auth, always
# admin) is for Home Assistant only, and nuc02's firewall allows it only from
# the cluster nodes.
apiVersion: v1
kind: Service
metadata:
  name: frigate
spec:
  ports:
    - name: http
      port: 8971
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: frigate
  labels:
    kubernetes.io/service-name: frigate
    endpointslice.kubernetes.io/managed-by: home-cluster
addressType: IPv4
ports:
  - name: http
    port: 8971
endpoints:
  - addresses:
      - 10.25.30.10
    conditions:
      ready: true
---
# Secret frigate-proxy-secret (frigate-proxy-secret.sops.yaml), key
# `credential` = the raw secret value.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: frigate-proxy-secret
spec:
  credentialInjection:
    header: X-Proxy-Secret
    overwrite: true
    credential:
      valueRef:
        name: frigate-proxy-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  labels:
    # Authelia, via kubernetes/apps/network/envoy-gateway/authelia.yaml.
    auth: authelia
spec:
  parentRefs:
    - name: envoy-external
      sectionName: https
  hostnames:
    - frigate.laboratory.casa
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: frigate-proxy-secret
      backendRefs:
        - name: frigate
          port: 8971
