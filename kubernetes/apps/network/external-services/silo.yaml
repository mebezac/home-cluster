---
# SILO A (S3, replaces Garage): the TrueNAS custom app "silo" (truenas-terraform
# apps.tf), S3 on 10.25.30.36:30200. Apps in the cluster use
# http://silo.network.svc.cluster.local:9000 (path style, region us-east-1).
# LAN and tailnet clients use https://silo.laboratory.casa (envoy-internal).
# Buckets, users and policies come from laboratory-casa/silo-tofu.
apiVersion: v1
kind: Service
metadata:
  name: silo
spec:
  ports:
    - name: http
      port: 9000
      targetPort: 30200
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: silo
  labels:
    kubernetes.io/service-name: silo
    endpointslice.kubernetes.io/managed-by: home-cluster
addressType: IPv4
ports:
  - name: http
    port: 30200
endpoints:
  - addresses:
      - 10.25.30.36
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo
spec:
  parentRefs:
    - name: envoy-internal
      sectionName: https
  hostnames:
    - silo.laboratory.casa
  rules:
    - backendRefs:
        - name: silo
          port: 9000
---
# Public S3 on SILO A, ONLY for buckets whose browsers talk to S3 directly
# (presigned POST/GET). One PathPrefix per bucket, no rewrite (the path is part
# of the SigV4 signature). Everything else, including /minio/admin and the
# other buckets, gets a 404 from Envoy. SILO answers CORS itself (any origin).
#   heremag-formbricks: Formbricks file uploads (forms.heremag.free)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo-public
spec:
  parentRefs:
    - name: envoy-external
      sectionName: https
  hostnames:
    - s3.laboratory.casa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /heremag-formbricks
      backendRefs:
        - name: silo
          port: 9000
---
# https://files.heremag.free: public PDFs in the SILO bucket files.heremag.free
# (anonymous GetObject, no listing; laboratory-casa/silo-tofu). SILO has no S3
# website endpoint like Garage, so rewrite /<key> to /files.heremag.free/<key>.
# GET and HEAD only. "/" has no index page (SILO answers 403). DNS: the CNAME
# to external.heremag.free is in cloudflared-heremag-free/config/dnsendpoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: files-heremag-free
spec:
  parentRefs:
    - name: envoy-external
      sectionName: https
  hostnames:
    - files.heremag.free
  # replacePrefixMatch allows exactly one PathPrefix match per rule, so one rule
  # per method.
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
          method: GET
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /files.heremag.free/
      backendRefs:
        - name: silo
          port: 9000
    - matches:
        - path: { type: PathPrefix, value: / }
          method: HEAD
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /files.heremag.free/
      backendRefs:
        - name: silo
          port: 9000
