---
# TrueNAS web UI: 10.25.30.36:80, served as truenas.laboratory.casa on envoy-internal.
apiVersion: v1
kind: Service
metadata:
  name: truenas
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  labels:
    kubernetes.io/service-name: truenas
    endpointslice.kubernetes.io/managed-by: home-cluster
addressType: IPv4
ports:
  - name: http
    port: 80
endpoints:
  - addresses:
      - 10.25.30.36
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
spec:
  parentRefs:
    - name: envoy-internal
      sectionName: https
  hostnames:
    - truenas.laboratory.casa
  rules:
    - backendRefs:
        - name: truenas
          port: 80
