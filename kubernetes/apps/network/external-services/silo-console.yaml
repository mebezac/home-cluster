# SILO A console (TrueNAS app "silo", truenas-terraform apps.tf): 10.25.30.36:30201,
# served as silo-console.laboratory.casa on envoy-internal (LAN/tailnet only).
# The console has its own login. Buckets, users and policies belong to
# laboratory-casa/silo-tofu: a change made in the console drifts from tofu.
apiVersion: v1
kind: Service
metadata:
  name: silo-console
spec:
  ports:
    - name: http
      port: 30201
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: silo-console
  labels:
    kubernetes.io/service-name: silo-console
    endpointslice.kubernetes.io/managed-by: home-cluster
addressType: IPv4
ports:
  - name: http
    port: 30201
endpoints:
  - addresses:
      - 10.25.30.36
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo-console
spec:
  parentRefs:
    - name: envoy-internal
      sectionName: https
  hostnames:
    - silo-console.laboratory.casa
  rules:
    - backendRefs:
        - name: silo-console
          port: 30201
