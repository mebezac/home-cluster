---
# BirdNET-Pi: 10.25.30.14:80, served as birdnet.laboratory.casa on envoy-external.
apiVersion: v1
kind: Service
metadata:
  name: birdnet
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: birdnet
  labels:
    kubernetes.io/service-name: birdnet
    endpointslice.kubernetes.io/managed-by: home-cluster
addressType: IPv4
ports:
  - name: http
    port: 80
endpoints:
  - addresses:
      - 10.25.30.14
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: birdnet
spec:
  parentRefs:
    - name: envoy-external
      sectionName: https
  hostnames:
    - birdnet.laboratory.casa
  rules:
    - backendRefs:
        - name: birdnet
          port: 80
