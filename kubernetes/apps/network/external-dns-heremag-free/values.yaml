fullnameOverride: external-dns-heremag-free
image:
  repository: registry.k8s.io/external-dns/external-dns
  # changelog: see the breadcrumb in kubernetes/argo/apps/network/external-dns.yaml. Keep equal to the chart
  # appVersion (v-prefixed) in all three external-dns apps - chart bumps no longer move this image.
  tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-heremag-free-secret
        key: api-token
extraArgs:
  - --cloudflare-dns-records-per-page=1000
  - --cloudflare-proxied
  - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
  - --crd-source-kind=DNSEndpoint
triggerLoopOnEvent: true
policy: sync
sources:
  - crd
txtPrefix: k8s.
txtOwnerId: default
domainFilters:
  - heremag.free
serviceMonitor:
  enabled: true
podAnnotations:
  secret.reloader.stakater.com/reload: external-dns-heremag-free-secret
