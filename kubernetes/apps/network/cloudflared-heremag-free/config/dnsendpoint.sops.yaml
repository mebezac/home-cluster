    - dnsName: external.heremag.free
      recordType: CNAME
      targets:
        - 37bdf31a-c269-426d-9a70-823699fb91d9.cfargotunnel.com
    # Hosts with HTTPRoutes on envoy-external. external-dns can't CNAME these
    # from the routes: it takes the target from the Gateway, which says
    # external.laboratory.casa (a different tunnel).
