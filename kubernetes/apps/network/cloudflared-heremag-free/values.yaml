---
global:
  fullnameOverride: cloudflared-heremag-free
controllers:
  cloudflared:
    strategy: RollingUpdate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: docker.io/cloudflare/cloudflared
          # changelog: GH releases cloudflare/cloudflared + repo CHANGES.md for breaking flags
          # (PR body is checksums only). NB 2026.8.0/.1 were 'do not use' releases; .2 is the fix.
          tag: 2026.9.0@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9
        env:
          NO_AUTOUPDATE: true
          TUNNEL_CRED_FILE: /etc/cloudflared/creds/credentials.json
          TUNNEL_METRICS: 0.0.0.0:8080
          TUNNEL_ORIGIN_ENABLE_HTTP2: true
          TUNNEL_TRANSPORT_PROTOCOL: quic
          TUNNEL_POST_QUANTUM: true
          TUNNEL_ID:
            valueFrom:
              secretKeyRef:
                name: cloudflared-heremag-free-secret
                key: TUNNEL_ID
        args:
          - tunnel
          - --config
          - /etc/cloudflared/config/config.yaml
          - run
          - "$(TUNNEL_ID)"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: &port 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          # 7d metrics (2026-09-08): peak 42Mi. Had no memory request at all.
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 160Mi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
service:
  app:
    controller: cloudflared
    ports:
      http:
        port: *port
serviceMonitor:
  app:
    serviceName: cloudflared-heremag-free
    endpoints:
      - port: http
        scheme: http
        path: /metrics
        interval: 1m
        scrapeTimeout: 10s
persistence:
  config:
    type: configMap
    name: cloudflared-heremag-free-configmap
    globalMounts:
      - path: /etc/cloudflared/config/config.yaml
        subPath: config.yaml
        readOnly: true
  creds:
    type: secret
    name: cloudflared-heremag-free-secret
    globalMounts:
      - path: /etc/cloudflared/creds/credentials.json
        subPath: credentials.json
        readOnly: true
