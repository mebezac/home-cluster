apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-configmap
data:
  config.yaml: |
    ---
    originRequest:
      originServerName: "external.laboratory.casa"

    ingress:
      - hostname: "laboratory.casa"
        service: &nginx-svc https://ingress-nginx-external-controller.network.svc.cluster.local:443
      # Test host for the Cilium external Gateway (see the `external` route in
      # kubernetes/apps/network/echo-server/values.yaml). Everything else still
      # goes to ingress-nginx until this migration is proven out.
      - hostname: "echo-gateway-external.laboratory.casa"
        service: https://cilium-gateway-external.kube-system.svc.cluster.local
      - hostname: "*.laboratory.casa"
        service: *nginx-svc
      - service: http_status:404
