apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-configmap
data:
  config.yaml: |
    ---
    originRequest:
      originServerName: "external.laboratory.casa"

    ingress:
      # Everything goes to the Envoy Gateway `envoy-external`. Hosts that
      # haven't moved to an HTTPRoute yet are passed on to ingress-nginx by the
      # temporary nginx-fallback route (kubernetes/apps/network/envoy-gateway).
      - hostname: "laboratory.casa"
        service: &gateway-svc https://envoy-external.network.svc.cluster.local
      - hostname: "*.laboratory.casa"
        service: *gateway-svc
      - service: http_status:404
