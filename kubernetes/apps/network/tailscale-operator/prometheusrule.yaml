---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tailscale
spec:
  groups:
    - name: tailscale
      rules:
        - alert: TailscaleProxyUnhealthy
          expr: tailscaled_health_messages{type="warning"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'Tailscale proxy {{ $labels.ts_proxy_parent_namespace }}/{{ $labels.ts_proxy_parent_name }} reports health warnings'
            description: 'tailscaled has had {{ $value }} health warning(s) for 30m; tailnet access to this service may be broken.'
