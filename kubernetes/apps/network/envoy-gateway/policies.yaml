---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
# Envoy -> app settings for every route on all three Gateways.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-guest
  # No compressor. On a route with compression, Envoy Gateway strips the
  # client's Accept-Encoding before the backend sees it. That broke clients that
  # sign the header (Garage S3 via aws-sdk-go-v2: "signed header
  # `accept-encoding` is not present") and stopped apps from compressing their
  # own responses. LAN is fast enough without it, and Cloudflare compresses for
  # visitors on envoy-external.
  tcpKeepalive:
    idleTime: 60s
    interval: 10s
    probes: 3
  timeout:
    http:
      # Envoy's default is a 15s cap on the whole request, which kills large
      # uploads (copyparty, oCIS, garage, immich) and long downloads. 0s means
      # no cap; a stalled stream is still cut by streamIdleTimeout.
      requestTimeout: 0s
      # Long enough for websockets/noVNC (jdownloader2) and slow uploads.
      streamIdleTimeout: 1h
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
# Client -> Envoy settings for envoy-internal and envoy-external. (A Gateway
# takes only one ClientTrafficPolicy; envoy-guest has its own below.)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  clientIPDetection:
    xForwardedFor:
      # Trust X-Forwarded-For only from pods. That is the cloudflared tunnels,
      # which set it to the real visitor IP. LAN clients reach the internal
      # Gateway with their real IP (Cilium DSR, no SNAT), so it uses the peer
      # address for them.
      trustedCIDRs:
        - 10.69.0.0/16
  path:
    # Envoy Gateway's default (UnescapeAndRedirect) 307s a %2F in the path to a
    # real '/', so Forgejo API calls on branch names like renovate/foo-1.x hit a
    # route that does not exist (404). ingress-nginx passed %2F through; keep that.
    escapedSlashesAction: KeepUnchanged
  headers:
    # Envoy rejects (400) any request header with '_' in its name by default;
    # ingress-nginx silently dropped them. Keep the nginx behaviour.
    withUnderscoresAction: DropHeader
    # Envoy passes a client's own X-Real-IP straight to the app, so anyone
    # could fake it. Drop it before routing. Apps get the real client IP from
    # X-Forwarded-For (see clientIPDetection above).
    earlyRequestHeaders:
      remove:
        - X-Real-IP
    lateResponseHeaders:
      # ingress-nginx defaults: hsts-max-age 31449600 + includeSubDomains,
      # hide-headers X-Powered-By.
      addIfAbsent:
        - name: Strict-Transport-Security
          value: max-age=31449600; includeSubDomains
      remove:
        - X-Powered-By
  http2:
    onInvalidMessage: TerminateStream
  tcpKeepalive:
    idleTime: 60s
    interval: 10s
    probes: 3
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
# Same as `envoy` above, except clientIPDetection. Guests arrive through the
# Tailscale operator's proxy pod, which SNATs to its pod IP and adds no
# X-Forwarded-For, so trusting that header from pods (as `envoy` does for
# cloudflared) would only let a guest pick their own client IP. Envoy uses the
# peer address instead: the proxy pod for tailnet clients, the real IP on the LAN.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-guest
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-guest
  path:
    escapedSlashesAction: KeepUnchanged
  headers:
    withUnderscoresAction: DropHeader
    earlyRequestHeaders:
      remove:
        - X-Real-IP
    lateResponseHeaders:
      addIfAbsent:
        - name: Strict-Transport-Security
          value: max-age=31449600; includeSubDomains
      remove:
        - X-Powered-By
  http2:
    onInvalidMessage: TerminateStream
  tcpKeepalive:
    idleTime: 60s
    interval: 10s
    probes: 3
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
