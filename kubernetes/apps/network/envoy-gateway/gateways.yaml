---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
# LAN only: k8s-gateway answers *.laboratory.casa with this Gateway's address
# for every HTTPRoute attached to it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.117
      # Shared with the forgejo `ssh` LoadBalancer (port 22), so git SSH and
      # HTTPS both live on git.laboratory.casa.
      lbipam.cilium.io/sharing-key: internal-ingress
      lbipam.cilium.io/sharing-cross-namespace: forgejo
      tailscale.com/expose: "true"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: laboratory-casa-production-tls
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
# Internet traffic arrives through the cloudflared tunnels, which all point at
# the `envoy-external` Service.
#
# Never attach one HTTPRoute to both Gateways: k8s-gateway would then answer
# the hostname with both IPs, and browsers coalescing HTTP/2 connections across
# them get 404/421s.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    # external-dns' gateway-httproute source only reads the target from the
    # Gateway, never from a route. So laboratory.casa routes are CNAMEd at the
    # tunnel automatically. The handful of heremag.free / zac.pizza hosts can't
    # share this target, so their CNAMEs are DNSEndpoints in the matching
    # cloudflared-* app instead.
    external-dns.kubernetes.io/target: external.laboratory.casa
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.122
      tailscale.com/expose: "true"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        # One listener, several certs: Envoy picks by SNI. Separate per-domain
        # listeners on :443 would work too, but Envoy Gateway pins listeners
        # whose certs overlap to HTTP/1.1, so keep it to one.
        certificateRefs:
          - kind: Secret
            name: laboratory-casa-production-tls
          - kind: Secret
            name: heremag-free-production-tls
          - kind: Secret
            name: zac-pizza-production-tls
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
# For friends who don't live here: they reach it over the tailnet (its own
# tag, tag:k8s-guest, is all the tailnet policy grants them). envoy-internal
# can't be shared that way: it also serves apps with no Authelia in front, and
# a tailnet grant can't filter by hostname. Every route on this Gateway goes
# through Authelia (authelia.yaml), whose <app>-<group> rule decides which
# friend may open what. Routes attach from other repos; the hostnames live
# there and in the tailnet DNS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-guest
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.119
      tailscale.com/expose: "true"
      tailscale.com/tags: tag:k8s-guest
  listeners:
    # HTTPS only: guests are given https:// links, and no port 80 means no
    # redirect route to keep outside Authelia.
    - name: https
      protocol: HTTPS
      port: 443
      # Authelia's session cookie is for laboratory.casa only.
      hostname: "*.laboratory.casa"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: laboratory-casa-production-tls
