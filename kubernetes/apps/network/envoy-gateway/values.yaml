---
# Gateway API CRDs come from the `gateway-api-crds` app and the Envoy Gateway
# CRDs from the gateway-crds-helm source in the Argo app, so this chart must not
# install its own copy.
crds:
  enabled: false
global:
  images:
    envoyGateway:
      image: docker.io/envoyproxy/gateway:v1.10.0@sha256:c2243d43518bed91d3ed8c2db849a4b7a14ac9b96eb019f2ab104bb1ca8572b1
    envoyProxy:
      image: docker.io/envoyproxy/envoy:distroless-v1.40.2@sha256:09ca6f2140a61ad8df11779a4a30d52b48433d444466328494f9188c9c35eded
deployment:
  replicas: 2
podDisruptionBudget:
  minAvailable: 1
config:
  envoyGateway:
    provider:
      type: Kubernetes
      kubernetes:
        # Envoy proxies run next to their Gateway (network) and are named after
        # it, so cloudflared can target a stable `envoy-external` Service name.
        deploy:
          type: GatewayNamespace
