---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# TEMPORARY, delete with ingress-nginx. The cloudflared tunnels send every host
# to envoy-external; any host without its own HTTPRoute yet matches this
# hostname-less route and is handed to ingress-nginx-external over plain HTTP.
# nginx trusts the X-Forwarded-Proto: https that Envoy adds
# (use-forwarded-headers), so it doesn't redirect-loop.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-fallback
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy-external
      sectionName: https
  rules:
    - backendRefs:
        - name: ingress-nginx-external-controller
          port: 80
