controllers:
  ocis:
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      identifier: ocis
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    initContainers:
      init-config:
        image:
          repository: docker.io/owncloud/ocis
          tag: 8.2.2@sha256:9d23fef10e2ee883b73e7c67698da70a62124128e49245396718e94a4cfd7a02
        command:
          - /bin/sh
          - -c
        args:
          - |
            if [ ! -f /etc/ocis/ocis.yaml ]; then ocis init; else exit 0; fi
        env:
          OCIS_INSECURE: true

    containers:
      ocis:
        image:
          repository: docker.io/owncloud/ocis
          # changelog: GH releases owncloud/ocis. We use the BUILT-IN IdP + s3ng/Garage, so the
          # PROXY_AUTOPROVISION_* / external-OIDC upgrade notes do not apply. Keep this digest in
          # sync with the init-config container above - they must be the same build.
          # digest-only bumps: the REVISION build-arg is NOT an owncloud/ocis commit; compare `go version -m usr/bin/ocis` (vcs.revision + Go version) from the binary layer via crane blob
          tag: 8.2.2@sha256:9d23fef10e2ee883b73e7c67698da70a62124128e49245396718e94a4cfd7a02
        env:
          DEMO_USERS: false
          OCIS_LOG_COLOR: false
          OCIS_LOG_LEVEL: warn
          OCIS_LOG_PRETTY: false
          OCIS_URL: https://files.laboratory.casa
          PROXY_TLS: false
          STORAGE_USERS_DRIVER: s3ng
          STORAGE_SYSTEM_DRIVER: ocis
          STORAGE_USERS_S3NG_ENDPOINT: https://garage-tc.laboratory.casa
          STORAGE_USERS_S3NG_REGION: us-east-1
          STORAGE_USERS_S3NG_BUCKET: ocis
          OCIS_INSECURE: true
          OCIS_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: false
          PROXY_ENABLE_BASIC_AUTH: false
          # WebDAV client auth via revocable app tokens (keeps OIDC for web/desktop).
          # auth-app does not autostart; PROXY_ENABLE_APP_AUTH wires it into the proxy.
          # JWT/machine-auth secrets fall back to the OCIS_* secrets generated by `ocis init`.
          OCIS_ADD_RUN_SERVICES: auth-app
          PROXY_ENABLE_APP_AUTH: true
          # Prometheus /metrics on the proxy debug server (single binary: includes
          # the other services' ocis_* metrics). Not routed.
          PROXY_DEBUG_ADDR: 0.0.0.0:9205

        envFrom:
          - secretRef:
              name: ocis-secret
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          # 7d metrics (2026-09-08): peak 493Mi, p95 428Mi - the 128Mi request
          # was well under real usage.
          requests:
            cpu: 50m
            memory: 576Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

  # Weekly: delete abandoned partial uploads. On 2026-10-21 these held 13.7 GiB
  # of the 14.1 GiB on ocis-data (user files live on S3). The CLI needs oCIS's
  # internal services on 127.0.0.1, so it must run inside the ocis pod; a
  # standalone pod with the same volume hangs. Complete uploads stuck in
  # processing are NOT cleaned (--processing=false) - decide on those by hand:
  # `ocis storage-users uploads sessions --processing`.
  upload-cleanup:
    type: cronjob
    serviceAccount:
      identifier: cleanup
    cronjob:
      schedule: "30 4 * * 0"
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 1
      backoffLimit: 0
    pod:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      clean:
        image:
          repository: registry.k8s.io/kubectl
          tag: v1.36.5@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b
        args:
          - exec
          - -n
          - owncloud
          - deploy/ocis
          - -c
          - ocis
          - --
          - ocis
          - storage-users
          - uploads
          - sessions
          - --expired
          - --processing=false
          - --clean
        env:
          HOME: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

serviceAccount:
  ocis:
    forceRename: ocis
  cleanup:
    forceRename: ocis-upload-cleanup

rbac:
  roles:
    cleanup:
      type: Role
      forceRename: ocis-upload-cleanup
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments"]
          resourceNames: ["ocis"]
          verbs: ["get"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]
  bindings:
    cleanup:
      type: RoleBinding
      forceRename: ocis-upload-cleanup
      roleRef:
        identifier: cleanup
      subjects:
        - identifier: cleanup

service:
  app:
    controller: ocis
    ports:
      http:
        port: 9200
      metrics:
        port: 9205

serviceMonitor:
  app:
    serviceName: ocis
    endpoints:
      - port: metrics
        path: /metrics

route:
  app:
    hostnames:
      - files.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    type: configMap
    name: ocis
    # advancedMounts (not globalMounts) for config and data, so the
    # upload-cleanup CronJob pod does not try to attach the RWO volume.
    advancedMounts:
      ocis:
        ocis: &webyaml
          - path: /etc/ocis/web.yaml
            subPath: web.yaml
            readOnly: true
        init-config: *webyaml
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    # 2026-10-02: 96% full (15.1 of 15.7 GB). Longhorn expands online.
    size: 30Gi
    advancedMounts:
      ocis:
        ocis: &datamounts
          - path: /var/lib/ocis
            subPath: data
          - path: /etc/ocis
            subPath: config
        init-config: *datamounts
  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /tmp
        subPath: tmp
