controllers:
  ocis:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    initContainers:
      init-config:
        image:
          repository: docker.io/owncloud/ocis
          tag: 8.2.1@sha256:cc6ffce88afeb73010df133563820fb7a5e3e235468dc0b66ab4b20c88f1c6a2
        command:
          - /bin/sh
          - -c
        args:
          - |
            if [ ! -f /etc/ocis/ocis.yaml ]; then ocis init; else exit 0; fi
        env:
          OCIS_INSECURE: true

    containers:
      ocis:
        image:
          repository: docker.io/owncloud/ocis
          # changelog: GH releases owncloud/ocis. We use the BUILT-IN IdP + s3ng/Garage, so the
          # PROXY_AUTOPROVISION_* / external-OIDC upgrade notes do not apply. Keep this digest in
          # sync with the init-config container above - they must be the same build.
          tag: 8.2.1@sha256:cc6ffce88afeb73010df133563820fb7a5e3e235468dc0b66ab4b20c88f1c6a2
        env:
          DEMO_USERS: false
          OCIS_LOG_COLOR: false
          OCIS_LOG_LEVEL: warn
          OCIS_LOG_PRETTY: false
          OCIS_URL: https://files.laboratory.casa
          PROXY_TLS: false
          STORAGE_USERS_DRIVER: s3ng
          STORAGE_SYSTEM_DRIVER: ocis
          STORAGE_USERS_S3NG_ENDPOINT: https://garage-tc.laboratory.casa
          STORAGE_USERS_S3NG_REGION: us-east-1
          STORAGE_USERS_S3NG_BUCKET: ocis
          OCIS_INSECURE: true
          OCIS_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: false
          PROXY_ENABLE_BASIC_AUTH: false
          # WebDAV client auth via revocable app tokens (keeps OIDC for web/desktop).
          # auth-app does not autostart; PROXY_ENABLE_APP_AUTH wires it into the proxy.
          # JWT/machine-auth secrets fall back to the OCIS_* secrets generated by `ocis init`.
          OCIS_ADD_RUN_SERVICES: auth-app
          PROXY_ENABLE_APP_AUTH: true
          # Prometheus /metrics on the proxy debug server (single binary: includes
          # the other services' ocis_* metrics). Not routed.
          PROXY_DEBUG_ADDR: 0.0.0.0:9205

        envFrom:
          - secretRef:
              name: ocis-secret
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          # 7d metrics (2026-09-08): peak 493Mi, p95 428Mi - the 128Mi request
          # was well under real usage.
          requests:
            cpu: 50m
            memory: 576Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

service:
  app:
    controller: ocis
    ports:
      http:
        port: 9200
      metrics:
        port: 9205

serviceMonitor:
  app:
    serviceName: ocis
    endpoints:
      - port: metrics
        path: /metrics

route:
  app:
    hostnames:
      - files.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    type: configMap
    name: ocis
    globalMounts:
      - path: /etc/ocis/web.yaml
        subPath: web.yaml
        readOnly: true
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    # 2026-10-02: 96% full (15.1 of 15.7 GB). Longhorn expands online.
    size: 30Gi
    globalMounts:
      - path: /var/lib/ocis
        subPath: data
      - path: /etc/ocis
        subPath: config
  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /tmp
        subPath: tmp
