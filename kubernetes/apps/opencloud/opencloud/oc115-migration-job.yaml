# TEMPORARY (audit 2026-11-26 #115): copy every personal space from oCIS to
# OpenCloud over WebDAV (upstream path: docs.opencloud.eu admin/maintenance/migrate),
# then print sizes and a sha1 check per user. Re-running is safe: rclone copy
# skips files that match. Remove with oc115-migration-rclone.sops.yaml after the
# cutover.
apiVersion: batch/v1
kind: Job
metadata:
  name: oc115-migration-final
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["talmac-01", "talmac-02", "talmac-03"]
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rclone
          image: docker.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /conf/rclone.conf /tmp/rclone.conf
              # final pass after the cutover: let the route move settle first
              sleep 120
              F="--exclude /Shares/**"
              # --bwlimit: OpenCloud stages each upload on its PVC until postprocessing
              # pushes it to SILO (~28 MiB/s, same NAS that oCIS reads from); faster
              # ingest filled the volume.
              for u in zac marlee; do
                echo "== copy $u"
                rclone copy "src-$u:" "dst-$u:" $F --transfers 4 --checkers 8 --bwlimit 26M \
                  --retries 10 --low-level-retries 30 --timeout 30m \
                  --stats 5m --stats-one-line --stats-log-level NOTICE --log-level NOTICE
              done
              for u in zac marlee; do
                echo "== verify $u"
                echo "src:"; rclone size "src-$u:" $F
                echo "dst:"; rclone size "dst-$u:" $F
                rclone check "src-$u:" "dst-$u:" $F --one-way --log-level NOTICE
              done
              echo "== MIGRATION DONE"
          env:
            - name: RCLONE_CONFIG
              value: /tmp/rclone.conf
            - name: HOME
              value: /tmp
            # rclone's WebDAV upload holds each whole file in memory (attempt 1,
            # 3 transfers, was OOMKilled at 4Gi) until GOMEMLIMIT made the GC keep up.
            - name: GOMEMLIMIT
              value: 3GiB
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: conf
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          secret:
            secretName: oc115-migration-rclone
        - name: tmp
          emptyDir: {}
