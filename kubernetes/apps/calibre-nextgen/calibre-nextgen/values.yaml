defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  calibre-nextgen:
    annotations:
      configmap.reloader.stakater.com/reload: calibre-nextgen-bootstrap
      secret.reloader.stakater.com/reload: calibre-nextgen-secret,calibre-nextgen-acsm-activation,calibre-nextgen-hardcover-secret
    strategy: Recreate
    defaultContainerOptions:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
    initContainers:
      bootstrap:
        image: &image
          repository: ghcr.io/new-usemame/calibre-web-nextgen
          # changelog: PR body (CHANGELOG.md). bootstrap.py/metadata-backfill.py import cps internals (ub, constants, cwa_db_loader, auto_library, config_sql, db, calibre_init, metadata_helper): check those in github.com/new-usemame/Calibre-Web-NextGen/compare
          tag: v4.1.75@sha256:f38e5fc9ee6d29f803dc062c06d00c52f6e600327d50aba3dada0aba49fe6d4d
        command:
          - /bin/sh
          - -ec
          - |
            python3 /bootstrap/bootstrap.py
            python3 /metadata-backfill/metadata-backfill.py --apply
        env:
          TZ: America/New_York
          CACHE_DIR: /tmp/calibre-cache
          CALIBRE_NEXTGEN_ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: calibre-nextgen-secret
                key: ADMIN_PASSWORD
          HARDCOVER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: calibre-nextgen-hardcover-secret
                key: HARDCOVER_TOKEN
        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { memory: 512Mi }
    containers:
      app:
        image: *image
        env:
          TZ: America/New_York
          CACHE_DIR: /tmp/calibre-cache
          CWA_CALIBRE_USER_PLUGINS: "true"
          # A missing account skips chown because Kubernetes manages volume access.
          # s6 drops empty environment values when starting services.
          CWA_SERVICE_USER: kubernetes-managed
          GENERIC_OAUTH_ENABLED: "true"
          GENERIC_OAUTH_CLIENT_ID: calibre-nextgen
          GENERIC_OAUTH_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: calibre-nextgen-secret
                key: GENERIC_OAUTH_CLIENT_SECRET
          GENERIC_OAUTH_METADATA_URL: https://login.laboratory.casa/.well-known/openid-configuration
          GENERIC_OAUTH_SCOPE: openid profile email groups
          GENERIC_OAUTH_LOGIN_BUTTON: Sign in with Authelia
          GENERIC_OAUTH_REQUIRE_GROUP: "true"
          GENERIC_OAUTH_ALLOWED_GROUPS: apps_user,apps_admin
          GENERIC_OAUTH_ADMIN_GROUP: apps_admin
          GENERIC_OAUTH_DEFAULT_ROLE: download,viewer,upload,edit,delete_books
          HARDCOVER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: calibre-nextgen-hardcover-secret
                key: HARDCOVER_TOKEN
          SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: calibre-nextgen-secret
                key: SECRET_KEY
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: &health
                path: /health
                port: &port 8083
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 36
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: *port
              periodSeconds: 15
              timeoutSeconds: 5
        resources:
          requests: { cpu: 10m, memory: 256Mi }
          limits: { memory: 1536Mi }

service:
  app:
    controller: calibre-nextgen
    ports:
      http:
        port: *port

route:
  app:
    annotations:
      # Hobby app: on the gatus page, but no alert (GatusEndpointDown skips group hobby).
      gatus.home-operations.com/endpoint: |-
        group: hobby
    hostnames:
      - books.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    type: persistentVolumeClaim
    suffix: config
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 512Mi
    globalMounts:
      - path: /config
  library:
    type: persistentVolumeClaim
    suffix: library
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      calibre-nextgen:
        bootstrap:
          - path: /calibre-library
        app:
          - path: /calibre-library
  metadata-backfill:
    type: configMap
    name: calibre-nextgen-metadata-backfill
    advancedMounts:
      calibre-nextgen:
        bootstrap:
          - path: /metadata-backfill
            readOnly: true
  bootstrap:
    type: configMap
    name: calibre-nextgen-bootstrap
    advancedMounts:
      calibre-nextgen:
        bootstrap:
          - path: /bootstrap
            readOnly: true
  acsm-activation:
    type: secret
    name: calibre-nextgen-acsm-activation
    defaultMode: 0440
    advancedMounts:
      calibre-nextgen:
        bootstrap:
          - path: /acsm-activation
            readOnly: true
  ingest:
    type: emptyDir
    advancedMounts:
      calibre-nextgen:
        app:
          - path: /cwa-book-ingest
  run:
    type: emptyDir
    advancedMounts:
      calibre-nextgen:
        bootstrap:
          - path: /runtime
        app:
          - path: /run
            subPath: s6
          - path: /app/calibre-web-automated/cps/file_helper.py
            subPath: file_helper.py
            readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
