apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: calibre-nextgen-bootstrap
    files:
      - bootstrap.py
      - acsm.py
    options:
      disableNameSuffixHash: true
  - name: calibre-nextgen-metadata-backfill
    files:
      - metadata-backfill.py
    options:
      disableNameSuffixHash: true
generators:
  - secret-generator.yaml
