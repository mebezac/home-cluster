defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  miniflux:
    annotations:
      reloader.stakater.com/auto: "true"
    # The role and database are CNPG-managed (database/postgres-17-cluster: managed.roles +
    # databases.yaml). Miniflux needs no extensions and no superuser.
    containers:
      app:
        image:
          repository: ghcr.io/miniflux/miniflux
          # changelog: GH releases miniflux/v2
          tag: 2.3.4-distroless@sha256:4a457e73b6c298bd44f42b38d744afb8a08d3b94318f0c636162d0b35ce0f217
        env:
          TZ: America/New_York
          BASE_URL: https://miniflux.laboratory.casa/
          HTTPS: "1"
          RUN_MIGRATIONS: "1"
          LOG_FORMAT: json
          # Pod network, so Envoy's X-Forwarded-For shows real client IPs.
          TRUSTED_REVERSE_PROXY_NETWORKS: 10.69.0.0/16
          # --- SSO: Authelia only (client in security/authelia/authelia-config.yaml).
          # OIDC-created users are not admins; that only matters for user management.
          OAUTH2_PROVIDER: oidc
          OAUTH2_OIDC_DISCOVERY_ENDPOINT: https://login.laboratory.casa
          OAUTH2_REDIRECT_URL: https://miniflux.laboratory.casa/oauth2/oidc/callback
          OAUTH2_OIDC_PROVIDER_NAME: Authelia
          OAUTH2_USER_CREATION: "1"
          DISABLE_LOCAL_AUTH: "1"
          # --- Polling: adapt each feed's interval to how often it posts.
          POLLING_SCHEDULER: entry_frequency
          SCHEDULER_ENTRY_FREQUENCY_MIN_INTERVAL: "15"
          POLLING_PARSING_ERROR_LIMIT: "0"
          # Keep starred entries forever (cleanup never removes them); drop old read ones.
          CLEANUP_ARCHIVE_READ_DAYS: "90"
          CLEANUP_ARCHIVE_UNREAD_DAYS: "-1"
          FETCH_YOUTUBE_WATCH_TIME: "1"
          # The Karakeep integration posts to the in-cluster service (a private IP).
          INTEGRATION_ALLOW_PRIVATE_NETWORKS: "1"
          # --- Metrics at /metrics. The network check alone is not enough: public
          # requests arrive from Envoy, which is inside the pod network. So it also
          # needs METRICS_USERNAME/PASSWORD (in the secret, also used by the scrape).
          METRICS_COLLECTOR: "1"
          METRICS_ALLOWED_NETWORKS: 10.69.0.0/16
        envFrom:
          # DATABASE_URL (password must match database/postgres-17-cluster/roles/miniflux.sops.yaml),
          # METRICS_USERNAME/PASSWORD,
          # OAUTH2_CLIENT_ID/SECRET, MEDIA_PROXY_PRIVATE_KEY.
          - secretRef:
              name: miniflux-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /liveness
                port: &port 8080
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readiness
                port: *port
              periodSeconds: 15
          # Migrations run before the server listens.
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readiness
                port: *port
              periodSeconds: 5
              failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  app:
    controller: miniflux
    ports:
      http:
        port: *port

serviceMonitor:
  app:
    service:
      identifier: app
    endpoints:
      - port: http
        path: /metrics
        interval: 1m
        basicAuth:
          username:
            name: miniflux-secret
            key: METRICS_USERNAME
          password:
            name: miniflux-secret
            key: METRICS_PASSWORD

route:
  app:
    # External so mobile apps (Google Reader / Fever API) sync away from home.
    hostnames:
      - miniflux.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
