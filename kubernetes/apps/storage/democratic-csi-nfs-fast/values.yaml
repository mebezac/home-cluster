---
controller:
  externalAttacher:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalProvisioner:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalResizer:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalSnapshotter:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 2Gi
csiProxy:
  resources:
    requests:
      cpu: 40m
      memory: 50Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 200Mi
      ephemeral-storage: 5Gi
csiDriver:
  name: "org.democratic-csi.nfs.fast"
storageClasses:
  - name: freenas-api-nfs-fast
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
      detachedVolumesFromSnapshots: "true"
    mountOptions:
      - noatime
      - nfsvers=4.2
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
driver:
  existingConfigSecret: democratic-csi-driver-fast-config
  config:
    driver: freenas-api-nfs
node:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 40m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
  driverRegistrar:
    resources:
      requests:
        cpu: 30m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  cleanup:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
volumeSnapshotClasses:
  - name: freenas-api-nfs-fast-snapshot-class
    driver: org.democratic-csi.nfs.fast
    deletionPolicy: Delete
    parameters:
      detachedSnapshots: true
