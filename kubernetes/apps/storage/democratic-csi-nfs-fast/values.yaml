---
controller:
  externalAttacher:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-attacher
      tag: "v4.4.0@sha256:dbded4ebe299973e31d0ef55815eb07a990fc67872b14900a8e69232acae4f2d"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalProvisioner:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-provisioner
      tag: "v3.6.0@sha256:6de50bacfd72627ffe4209e3db8ad7391d04ea6fb741bf51feab6c5dcfd80002"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalResizer:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-resizer
      tag: "v1.9.0@sha256:f1f352df97874442624fcef23eab04aa038f66cb0e361212f6ec09e92998184d"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalSnapshotter:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-snapshotter
      tag: "v8.2.1@sha256:5f4bb469fec51147ce157329dab598c758da1b018bad6dad26f0ff469326d769"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 2Gi
csiProxy:
  # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
  image:
    registry: docker.io/democraticcsi/csi-grpc-proxy
    tag: "v0.5.6@sha256:fc5fc1fe9c682463fe8b219db070930e77067d76449749ef5ba99cedd30fa437"
  resources:
    requests:
      cpu: 40m
      memory: 50Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 200Mi
      ephemeral-storage: 5Gi
csiDriver:
  name: "org.democratic-csi.nfs.fast"
storageClasses:
  - name: freenas-api-nfs-fast
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
      detachedVolumesFromSnapshots: "true"
    mountOptions:
      - noatime
      - nfsvers=4.2
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
driver:
  existingConfigSecret: democratic-csi-driver-fast-config
  config:
    driver: freenas-api-nfs
node:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 40m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
  driverRegistrar:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: "v2.9.0@sha256:cd21e19cd8bbd5bc56f1b4f1398a436e7897da2995d6d036c9729be3f4e456e6"
    resources:
      requests:
        cpu: 30m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  cleanup:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: docker.io/busybox
      tag: "1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec"
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
volumeSnapshotClasses:
  - name: freenas-api-nfs-fast-snapshot-class
    driver: org.democratic-csi.nfs.fast
    deletionPolicy: Delete
    parameters:
      detachedSnapshots: true
