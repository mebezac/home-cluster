---
controller:
  externalAttacher:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-attacher
      tag: "v4.13.1@sha256:b398d0f5a30202b5261412023b24057bc5a493d8b2b5dad25ebf5c89966e1559"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalProvisioner:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-provisioner
      tag: "v3.6.0@sha256:6de50bacfd72627ffe4209e3db8ad7391d04ea6fb741bf51feab6c5dcfd80002"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalResizer:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-resizer
      tag: "v1.14.0@sha256:5e7cbb63fd497fa913caa21fee1a69f727c220c6fa83c5f8bb0995e2ad73a474"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalSnapshotter:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-snapshotter
      tag: "v8.7.1@sha256:b534b99edb61a5f95e297da8e2a133d36e27ad098e2f643393986e86f093d425"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 2Gi
csiProxy:
  # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
  image:
    registry: docker.io/democraticcsi/csi-grpc-proxy
    tag: "v0.5.6@sha256:fc5fc1fe9c682463fe8b219db070930e77067d76449749ef5ba99cedd30fa437"
  resources:
    requests:
      cpu: 40m
      memory: 50Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 200Mi
      ephemeral-storage: 5Gi
csiDriver:
  name: "org.democratic-csi.nfs"
storageClasses:
  - name: freenas-api-nfs
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
      detachedVolumesFromSnapshots: "true"
    mountOptions:
      - noatime
      - nfsvers=4.2
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
driver:
  existingConfigSecret: democratic-csi-driver-config
  config:
    driver: freenas-api-nfs
node:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 40m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
  driverRegistrar:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: "v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5"
    resources:
      requests:
        cpu: 30m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  cleanup:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: docker.io/busybox
      tag: "1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
volumeSnapshotClasses:
  - name: freenas-api-nfs-snapshot-class
    driver: org.democratic-csi.nfs
    deletionPolicy: Delete
    parameters:
      detachedSnapshots: true
