---
controller:
  externalAttacher:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-attacher
      tag: "v4.4.4@sha256:3d4846c08ca8ab66ff23d185ccf5ceae97c09f51523a3c666c0da95febebf00c"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalProvisioner:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-provisioner
      tag: "v3.6.4@sha256:e7ad666f1d9b0caa077c7f0c157c9f87d1e73858390732496f66dcc716ff10c5"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalResizer:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-resizer
      tag: "v1.9.4@sha256:522911ef68bd2c5c17d90fb2a6d2b2fb72ae790f2c1463a466b4262a07fdbf5a"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 150Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  externalSnapshotter:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-snapshotter
      tag: "v8.2.1@sha256:5f4bb469fec51147ce157329dab598c758da1b018bad6dad26f0ff469326d769"
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 2Gi
csiProxy:
  # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
  image:
    registry: docker.io/democraticcsi/csi-grpc-proxy
    tag: "v0.5.7@sha256:0240d0fba3cedd598036766b1865e88aa2eac9c16822df03d5d912a81128ebb6"
  resources:
    requests:
      cpu: 40m
      memory: 50Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 200Mi
      ephemeral-storage: 5Gi
csiDriver:
  name: "org.democratic-csi.nfs"
storageClasses:
  - name: freenas-api-nfs
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
      detachedVolumesFromSnapshots: "true"
    mountOptions:
      - noatime
      - nfsvers=4.2
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
driver:
  existingConfigSecret: democratic-csi-driver-config
  config:
    driver: freenas-api-nfs
node:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    logLevel: warn
    resources:
      requests:
        cpu: 40m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
  driverRegistrar:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: "v2.9.4@sha256:ab6c4603d8da43d9f33361a5716552080e3f72badfad099d76fcf4b59e547d80"
    resources:
      requests:
        cpu: 30m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
    verbosityLevel: 0
  cleanup:
    # Chart-default image, pinned with a digest; moves with the chart version (Renovate group).
    image:
      registry: docker.io/busybox
      tag: "1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec"
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
        ephemeral-storage: 1Gi
      limits:
        memory: 200Mi
        ephemeral-storage: 5Gi
volumeSnapshotClasses:
  - name: freenas-api-nfs-snapshot-class
    driver: org.democratic-csi.nfs
    deletionPolicy: Delete
    parameters:
      detachedSnapshots: true
