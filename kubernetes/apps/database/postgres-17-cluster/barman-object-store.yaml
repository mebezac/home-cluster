apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-cluster-garage-object-store
spec:
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    # The plugin-barman-cloud sidecar in every instance pod had no requests
    # or limits. 7d (2026-10-03): mem p95 84Mi / peak 188Mi, cpu p95 135m.
    resources:
      requests:
        cpu: 150m
        memory: 128Mi
      limits:
        memory: 384Mi
  # SILO A since 2026-11-01 (the name still says garage: renaming it means a
  # Cluster spec change and a rolling restart). The bucket has Object Lock
  # COMPLIANCE 30 days, and SILO A replicates it to SILO B; deletes stay on A.
  # The old backups up to 2026-11-01 are still in Garage (garage-tc).
  configuration:
    endpointURL: http://silo.network.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-silo-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-silo-s3
        key: ACCESS_SECRET_KEY
    destinationPath: s3://cloudnative-pg/v17
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 4
