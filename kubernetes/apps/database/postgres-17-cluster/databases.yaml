  name: tofu-state
spec:
  cluster:
    name: postgres-17-cluster
  name: tofu_state
  owner: tofu
  ensure: present
  databaseReclaimPolicy: retain
---
# Terraform state for truenas-terraform and cloudflare-terraform: schemas
