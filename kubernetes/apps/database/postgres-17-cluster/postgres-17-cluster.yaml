---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-17-cluster
spec:
  primaryUpdateMethod: switchover
  instances: 3
  # NOTE: Yes I know everything is called *-17-*, even though the version is now higher
  # That was an oversight when first making the cluster, but I don't care enough to fix it now
  # changelog: postgresql.org/docs/release/<version>/ (PR body has none; check every minor in the range - 18.5 was never released)
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  # info (the CNPG default): the instance manager emits PostgreSQL's own log
  # records at info, so 'warning' dropped every server log line - auth
  # failures, missing databases, too many connections were all invisible.
  logLevel: info
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-cluster-garage-object-store
        # NOTE: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: postgres-17-cluster-v2

  postgresql:
    # Tuned 2026-09-08. Before this there was no parameters block at all, so
    # the planner ran on stock image defaults that did not match the 1Gi
    # container limit below.
    #
    # Every parameter here has pg_settings context 'user', i.e. it applies by
    # RELOAD - no restart, no switchover, no blip for the 13 databases that
    # share this cluster. shared_buffers is deliberately absent because it is
    # context 'postmaster' and would force a rolling restart (see below).
    parameters:
      # Was 4GB - the stock default, 4x larger than the whole container.
      # The planner believed it had 4GB of cache to play with. 768MB is 75% of
      # the 1Gi limit and still comfortably exceeds the 311MB total size of all
      # databases, so full-cache assumptions stay correct without lying.
      effective_cache_size: "768MB"
      # Was 4, which models a spinning disk. This cluster is on
      # longhorn-single-replica backed by SSD, so index scans are far cheaper
      # than the default cost model assumes.
      random_page_cost: "1.1"
      # Pinned at the current default ON PURPOSE, not left to drift. work_mem
      # is per sort/hash node, so with max_connections=100 a bump to 8MB is
      # 800MB worst case against a 1Gi limit - the classic way to OOM a shared
      # cluster. Raise the memory limit first if this ever needs to grow.
      work_mem: "4MB"
    #
    # NOT changed: shared_buffers stays at CNPG's 128MB. Measured before
    # touching it - cache hit ratio is 99.98% overall (worst database:
    # authelia at 99.01%) against 311MB of total data. There is nothing to
    # gain, and changing it would cost a rolling restart of the shared cluster.

  storage:
    size: 16Gi
    storageClass: longhorn-single-replica
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg
  # App roles, owned by CNPG (deep-dive 2026-10-23 WEB-1/DATA-8). They replace the
  # postgres-init init container, which needed the superuser password in every app
  # namespace. Each role's password lives in ./roles/<app>.sops.yaml (Secret pg-role-<app>,
  # keys username + password, label cnpg.io/reload) and the same value in the app's own
  # secret. The databases are ./databases.yaml.
  #
  # Every attribute CNPG manages is enforced: an unset one falls back to the CNPG default
  # (login defaults to FALSE), so each role states login: true. The values match what
  # postgres-init's createuser made: login, inherit, nothing else.
  managed:
    roles:
      - name: lubelog
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-lubelog
      - name: pcab
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-pcab
      - name: paperclip
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-paperclip
      - name: umami
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-umami
      - name: reckage
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-reckage
      - name: grafana
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-grafana
      - name: lychee
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-lychee
      - name: n8n
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-n8n
      - name: romm
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-romm
      - name: formbricks
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-formbricks
      - name: forgejo
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: pg-role-forgejo
  resources:
    # Raised 2026-09-22 from 512Mi/1Gi: romm 5.3.0's startup migration (a
    # full-table UPDATE on roms with new row triggers) OOM-killed the primary
    # twice at 1Gi and caused failovers for every database here. The talmacs
    # have ~30Gi each, so a generous ceiling is cheap insurance for app
    # migrations. The effective_cache_size/work_mem notes above were written
    # for 1Gi and are still conservative at this size.
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  # monitoring.enablePodMonitor is deprecated ("will be removed"); the
  # PodMonitor is now a plain manifest: ./podmonitor.yaml
