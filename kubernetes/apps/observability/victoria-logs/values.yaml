server:
  enabled: true
  image:
    repository: victoriametrics/victoria-logs
    # changelog: GH releases VictoriaMetrics/VictoriaLogs. Keep in lockstep with the chart's
    # appVersion (kubernetes/argo/apps/observability/victoria-logs.yaml) and the vlagent tag in
    # ../victoria-logs-collector/values.yaml - chart bumps no longer move this image. The VM chart
    # strips "@sha256..." from the version label, so the digest is safe here.
    tag: v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe

  # Data retention period (14 days same as Loki)
  retentionPeriod: 14d
  
  persistentVolume:
    enabled: true
    storageClassName: longhorn-single-replica
    size: 30Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  route:
    enabled: true
    # Admin-only via Authelia (SecurityPolicy in ../victoria-metrics-stack/authelia.yaml)
    extraLabels:
      auth: authelia
    hostnames:
      - victorialogs.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https

  serviceMonitor:
    enabled: true
