server:
  enabled: true
  
  # Data retention period (14 days same as Loki)
  retentionPeriod: 14d
  
  persistentVolume:
    enabled: true
    storageClassName: longhorn-single-replica
    size: 30Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  route:
    enabled: true
    # Admin-only via Authelia (SecurityPolicy in ../victoria-metrics-stack/authelia.yaml)
    extraLabels:
      auth: authelia
    hostnames:
      - victorialogs.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https

  serviceMonitor:
    enabled: true
