image:
  repository: oliver006/redis_exporter
  # NOTE: no @sha256 digest here, deliberately. This chart templates image.tag into the
  # app.kubernetes.io/version LABEL, and a digest-bearing tag is an invalid label value
  # (contains '@', >63 bytes) -- it hard-fails the sync. The chart exposes no image.digest key.
  # changelog: GH releases oliver006/redis_exporter. Keep in lockstep with the chart's
  # targetRevision in kubernetes/argo/apps/observability/prometheus-redis-exporter.yaml - chart
  # bumps there are appVersion-only, and this tag must equal that chart version's appVersion.
  tag: v1.95.0
env:
  - name: TZ
    value: America/New_York
redisAddress: redis://valkey.valkey.svc.cluster.local:6379
serviceMonitor:
  enabled: true
  labels:
    release: victoria-metrics-stack
prometheusRule:
  enabled: true
  labels:
    release: victoria-metrics-stack
  rules:
    - alert: RedisExporterAbsent
      annotations:
        description: Redis Exporter has disappeared from Prometheus target discovery.
        summary: Redis Exporter is down.
      expr: absent(up{service="{{ template "prometheus-redis-exporter.fullname" . }}"} == 1)
      for: 2m
      labels:
        severity: critical
    # Central valkey runs maxmemory-policy noeviction: at the cap, writes fail
    # (Authelia sessions, immich/BullMQ queues). Peak so far: 297MB of 448MB.
    # (max_bytes > 0: argo's own redis reports no maxmemory, ratio = +Inf.)
    - alert: ValkeyMemoryHigh
      annotations:
        summary: 'Valkey uses {{ "{{" }} $value | humanizePercentage {{ "}}" }} of maxmemory'
        description: Central valkey refuses writes at 100% (noeviction). Find the database that grows (INFO keyspace), or raise maxmemory and the 640Mi limit together.
      expr: redis_memory_used_bytes{job="prometheus-redis-exporter"} / (redis_memory_max_bytes{job="prometheus-redis-exporter"} > 0) > 0.8
      for: 10m
      labels:
        severity: warning
auth:
  enabled: true
  secret:
    name: "prometheus-redis-exporter-secret"
    key: "password"
