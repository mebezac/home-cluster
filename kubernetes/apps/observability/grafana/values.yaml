annotations:
  secret.reloader.stakater.com/reload: grafana-secret
# Chart: grafana-community/helm-charts (the grafana org's chart is deprecated since 2026-01-30).
# Chart 13.0 made the distroless image the default, with readOnlyRootFilesystem and an emptyDir
# on /tmp; distroless has no /run.sh, so no GF_*__FILE env and no GF_INSTALL_PLUGINS.
image:
  registry: docker.io
  repository: grafana/grafana
  # changelog: GH releases grafana/grafana
  tag: 13.3.2-distroless@sha256:d9425e704fa9dff189966b827fbc9b63befc5b443999c7b82193f1b1a73c74f7
# Init container that downloads the gnetId/url dashboards below.
downloadDashboardsImage:
  registry: docker.io
  repository: curlimages/curl
  tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
# The grafana database and role are CNPG-managed (database/postgres-17-cluster), so there
# is no postgres-init container and no superuser password in grafana-secret.
rbac:
  pspEnabled: false
persistence:
  enabled: false
testFramework:
  enabled: false
# Server-side rendering for "Export as image" / panel PNGs: the chart runs
# grafana-image-renderer (headless Chromium) as its own Deployment + Service and points
# Grafana at it (GF_RENDERING_SERVER_URL / CALLBACK_URL). The chart's NetworkPolicy only
# lets the Grafana pods reach it.
imageRenderer:
  enabled: true
  image:
    registry: docker.io
    repository: grafana/grafana-image-renderer
    # changelog: GH releases grafana/grafana-image-renderer
    tag: v5.12.11
    sha: cfa6c8f63e6d626f90208f2880f15bd5facc279daec1b9bb642af07aa850d95e
    pullPolicy: IfNotPresent
  # Grafana 13 needs a shared renderer token (JWT render auth). The chart would generate one
  # with helm lookup, which Argo cannot do, so the token would change on every render; it
  # lives in grafana-image-renderer-token (sops) instead. The chart passes it to Grafana
  # (GF_RENDERING_RENDERER_TOKEN) and to the renderer (AUTH_TOKEN).
  existingSecret: grafana-image-renderer-token
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    seccompProfile: { type: RuntimeDefault }
  serviceMonitor:
    enabled: true
    # The old chart's defaults; the community chart leaves them to vmagent.
    interval: 1m
    scrapeTimeout: 30s
  networkPolicy:
    limitIngress: true
    # The chart's policy admits only the Grafana pods; vmagent must reach /metrics
    # too, or the ServiceMonitor target is down (TargetDown).
    extraIngressSelectors:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: vmagent
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
  resources:
    # Chromium: idle is small, a render spikes. First guess; right-size from metrics.
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 1Gi
serviceMonitor:
  enabled: true
  # The old chart's defaults; the community chart leaves them to vmagent.
  interval: 30s
  scrapeTimeout: 30s
serviceAccount:
  autoMount: true
route:
  main:
    enabled: true
    hostnames:
      - graf.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true
envFromSecrets:
  - name: grafana-secret
grafana.ini:
  analytics:
    check_for_updates: false
    check_for_plugin_updates: false
    reporting_enabled: false
  auth:
    # Authelia's logout (the old value was an Authentik end-session path).
    signout_redirect_url: https://login.laboratory.casa/logout
    oauth_allow_insecure_email_lookup: true
  auth.basic:
    enabled: false
  auth.anonymous:
    enabled: false
  auth.generic_oauth:
    enabled: true
    name: Authelia
    icon: signin
    # Replaces the deprecated [auth] oauth_auto_login.
    auto_login: true
    scopes: openid profile email groups
    empty_scopes: false
    auth_url: https://login.laboratory.casa/api/oidc/authorization
    token_url: https://login.laboratory.casa/api/oidc/token
    api_url: https://login.laboratory.casa/api/oidc/userinfo
    login_attribute_path: preferred_username
    groups_attribute_path: groups
    name_attribute_path: name
    use_pkce: true
    role_attribute_path:
  auth.generic_oauth.group_mapping:
    role_attribute_path: |
      contains(groups[*], 'apps_admin') && 'Admin'
    org_id: 1
  log:
    mode: console
    level: warn
  news:
    news_feed_enabled: false
  paths:
    data: /var/lib/grafana/data
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  server:
    root_url: https://graf.laboratory.casa
plugins:
  - pr0ps-trackmap-panel
  - grafana-clock-panel
  - vonage-status-panel
  - redis-datasource
  - victoriametrics-metrics-datasource
  - victoriametrics-logs-datasource
# non-file memory (working_set - active_file), 14d to 2026-10-21: grafana p99 151Mi, max 153Mi; each k8s-sidecar max ~77Mi.
# First limit on this container: >= 4x the recorded max, because 5-minute samples miss startup spikes (copyparty, 2026-10-21).
resources:
  requests:
    cpu: 30m
    memory: 160Mi
  limits:
    memory: 1Gi

sidecar:
  image:
    registry: quay.io
    repository: kiwigrid/k8s-sidecar
    # changelog: GH releases kiwigrid/k8s-sidecar
    tag: 2.14.3@sha256:52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
  resources:
    requests:
      cpu: 5m
      memory: 96Mi
    limits:
      memory: 384Mi
  # k8s-sidecar >= 2.x starts a health server, default port 8080 in both sidecars. As plain
  # containers (not init) the chart sets no HEALTH_PORT, so the second one fails to bind
  # (OSError: Address in use). Use the chart's own per-sidecar ports.
  datasources:
    enabled: true
    searchNamespace: ALL
    env:
      HEALTH_PORT: "8082"
  dashboards:
    enabled: true
    env:
      HEALTH_PORT: "8084"
    labelValue: ""
    label: grafana_dashboard
    folderAnnotation: grafana_folder
    searchNamespace: ALL
    provider:
      disableDelete: true
      foldersFromFilesStructure: true
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Alertmanager
        orgId: 1
      - name: Loki
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-stack.observability.svc:8428
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://vmalertmanager-victoria-metrics-stack.observability.svc:9093
        jsonData:
          implementation: prometheus
      - name: VictoriaMetrics
        type: victoriametrics-metrics-datasource
        access: proxy
        url: http://vmsingle-victoria-metrics-stack.observability.svc:8428
        isDefault: false
        jsonData:
          timeInterval: 30s
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        uid: victorialogs
        access: proxy
        url: http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428
        jsonData:
          maxLines: 250
      # Paperless (central CNPG, read replica) as the read-only role grafana_reader:
      # SELECT on the document-metadata tables only (database/postgres-17-cluster:
      # managed.roles + grafana-reader-grants.yaml). Grafana login is apps_admin only
      # (Authelia policy grafana_admins), because any Grafana user can query a datasource.
      - name: Paperless
        type: grafana-postgresql-datasource
        uid: paperless-postgres
        access: proxy
        url: postgres-17-cluster-ro.database.svc.cluster.local:5432
        user: grafana_reader
        editable: false
        jsonData:
          database: paperless
          sslmode: require
          postgresVersion: 1500
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
        secureJsonData:
          password: ${PG_READER_PASSWORD}
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "default"
        disableDeletion: false
        editable: true
        folder: ""
        options:
          path: /var/lib/grafana/dashboards/default
        orgId: 1
        type: file
      - name: "kubernetes"
        orgId: 1
        folder: "Kubernetes"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: "networking"
        org_id: 1
        folder: "Networking"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/networking
      - name: "system"
        orgId: 1
        folder: "System"
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/system
      - name: "database"
        orgId: 1
        folder: "Database"
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/database
      - name: "paperless"
        orgId: 1
        folder: "Paperless"
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/paperless
dashboards:
  paperless:
    # Utility bills from Paperless custom fields (datasource Paperless, read-only).
    paperless-utilities:
      json: |
        {
          "title": "Utilities (Paperless)",
          "uid": "paperless-utilities",
          "schemaVersion": 41,
          "version": 2,
          "editable": true,
          "tags": [
            "paperless",
            "utilities"
          ],
          "description": "Utility bill usage and charges (City of Bowling Green; Columbia Gas of Ohio) from the Paperless custom fields (paperless-ai). Datasource: Paperless (read-only).",
          "time": {
            "from": "now-3y",
            "to": "now"
          },
          "timezone": "browser",
          "refresh": "",
          "panels": [
            {
              "type": "stat",
              "title": "Last 12 months (all utilities)",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 4,
                "h": 4
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT sum(i.value_monetary_amount) AS value\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id AND cf.name = 'Total'\nWHERE d.deleted_at IS NULL AND d.created > now() - interval '12 months'"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD",
                  "decimals": 2
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "colorMode": "none",
                "graphMode": "none"
              }
            },
            {
              "type": "stat",
              "title": "Last city bill",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 4,
                "y": 0,
                "w": 4,
                "h": 4
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT d.created::timestamptz AS time, max(CASE WHEN cf.name = 'Total' THEN i.value_monetary_amount END) AS value\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_correspondent c ON c.id = d.correspondent_id AND c.name = 'City of Bowling Green'\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id\nWHERE d.deleted_at IS NULL\nGROUP BY 1 ORDER BY 1"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD",
                  "decimals": 2
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "colorMode": "none",
                "graphMode": "none"
              }
            },
            {
              "type": "stat",
              "title": "Last gas bill",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 8,
                "y": 0,
                "w": 4,
                "h": 4
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT d.created::timestamptz AS time, max(CASE WHEN cf.name = 'Total' THEN i.value_monetary_amount END) AS value\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_correspondent c ON c.id = d.correspondent_id AND c.name = 'Columbia Gas of Ohio'\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id\nWHERE d.deleted_at IS NULL\nGROUP BY 1 ORDER BY 1"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD",
                  "decimals": 2
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "colorMode": "none",
                "graphMode": "none"
              }
            },
            {
              "type": "stat",
              "title": "kWh per day (last bill)",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 12,
                "y": 0,
                "w": 4,
                "h": 4
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT d.created::timestamptz AS time, round(max(CASE WHEN cf.name = 'Electric Usage (kWh)' THEN i.value_int END)::numeric / nullif((max(CASE WHEN cf.name = 'Service Period End' THEN i.value_date END) - max(CASE WHEN cf.name = 'Service Period Start' THEN i.value_date END)),0), 1) AS value\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_correspondent c ON c.id = d.correspondent_id AND c.name = 'City of Bowling Green'\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id\nWHERE d.deleted_at IS NULL\nGROUP BY 1 ORDER BY 1"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": null
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "colorMode": "none",
                "graphMode": "none"
              }
            },
            {
              "type": "stat",
              "title": "Water cu ft per day (last bill)",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 16,
                "y": 0,
                "w": 4,
                "h": 4
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT d.created::timestamptz AS time, round(max(CASE WHEN cf.name = 'Water Usage (cu ft)' THEN i.value_int END)::numeric / nullif((max(CASE WHEN cf.name = 'Service Period End' THEN i.value_date END) - max(CASE WHEN cf.name = 'Service Period Start' THEN i.value_date END)),0), 1) AS value\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_correspondent c ON c.id = d.correspondent_id AND c.name = 'City of Bowling Green'\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id\nWHERE d.deleted_at IS NULL\nGROUP BY 1 ORDER BY 1"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": null
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "colorMode": "none",
                "graphMode": "none"
              }
            },
            {
              "type": "stat",
              "title": "Gas Ccf per day (last bill)",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 20,
                "y": 0,
                "w": 4,
                "h": 4
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT d.created::timestamptz AS time, round(max(CASE WHEN cf.name = 'Gas Usage (Ccf)' THEN i.value_int END)::numeric / nullif((max(CASE WHEN cf.name = 'Service Period End' THEN i.value_date END) - max(CASE WHEN cf.name = 'Service Period Start' THEN i.value_date END)),0), 2) AS value\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_correspondent c ON c.id = d.correspondent_id AND c.name = 'Columbia Gas of Ohio'\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id\nWHERE d.deleted_at IS NULL\nGROUP BY 1\nORDER BY 1"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": null
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": ""
                },
                "colorMode": "none",
                "graphMode": "none"
              }
            },
            {
              "type": "timeseries",
              "title": "Utilities per month",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 0,
                "y": 4,
                "w": 24,
                "h": 9
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "time_series",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT date_trunc('month', d.created)::timestamptz AS time, c.name AS metric, sum(i.value_monetary_amount) AS value\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_correspondent c ON c.id = d.correspondent_id\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id AND cf.name = 'Total'\nWHERE d.deleted_at IS NULL AND $__timeFilter(d.created)\nGROUP BY 1, 2\nORDER BY 1"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD",
                  "custom": {
                    "drawStyle": "bars",
                    "fillOpacity": 80,
                    "barAlignment": 0,
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "always",
                    "stacking": {
                      "mode": "normal"
                    },
                    "spanNulls": true
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "type": "timeseries",
              "title": "City bill by charge",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "paperless-postgres"
              },
              "gridPos": {
                "x": 0,
                "y": 13,
                "w": 24,
                "h": 9
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "paperless-postgres"
                  },
                  "format": "time_series",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT d.created::timestamptz AS time,\nmax(CASE WHEN cf.name = 'Electric Usage Charge' THEN i.value_monetary_amount END) AS \"Electric usage\",\nmax(CASE WHEN cf.name = 'Electric Customer Charge' THEN i.value_monetary_amount END) AS \"Electric customer\",\nmax(CASE WHEN cf.name = 'Electric kWh Tax' THEN i.value_monetary_amount END) AS \"kWh tax\",\nmax(CASE WHEN cf.name = 'Water Usage Charge' THEN i.value_monetary_amount END) AS \"Water usage\",\nmax(CASE WHEN cf.name = 'Water Customer Charge' THEN i.value_monetary_amount END) AS \"Water customer\",\nmax(CASE WHEN cf.name = 'Sewer Usage Charge' THEN i.value_monetary_amount END) AS \"Sewer usage\",\nmax(CASE WHEN cf.name = 'Sewer Customer Charge' THEN i.value_monetary_amount END) AS \"Sewer customer\",\nmax(CASE WHEN cf.name = 'Refuse Charge' THEN i.value_monetary_amount END) AS \"Refuse\"\nFROM documents_document d\nJOIN documents_documenttype t ON t.id = d.document_type_id AND t.name = 'Utility Bill'\nJOIN documents_correspondent c ON c.id = d.correspondent_id AND c.name = 'City of Bowling Green'\nJOIN documents_customfieldinstance i ON i.document_id = d.id AND i.deleted_at IS NULL\nJOIN documents_customfield cf ON cf.id = i.field_id\nWHERE d.deleted_at IS NULL AND $__timeFilter(d.created)\nGROUP BY 1\nORDER BY 1"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyUSD",
                  "custom": {
                    "drawStyle": "bars",
                    "fillOpacity": 80,
                    "barAlignment": 0,
                    "lineWidth": 1,
                    "pointSize": 5,
                    "showPoints": "always",
                    "stacking": {
                      "mode": "normal"
                    },
                    "spanNulls": true
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
