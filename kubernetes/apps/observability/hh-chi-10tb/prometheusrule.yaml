---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
# hh-chi-10tb (HostHatch VPS, SILO B). Since late Oct 2026 its 9 TB virtual
# disk stalls for minutes at a time: single I/Os take 0.5-3.5 s at only a few
# ops/s, and journald gets killed by its watchdog. These alerts track that so
# the provider ticket has numbers and we see when it comes back.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hh-chi-10tb
spec:
  groups:
    - name: hh-chi-10tb
      rules:
        - alert: HhChiDown
          expr: up{job="hh-chi-10tb"} == 0 or absent(up{job="hh-chi-10tb"})
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: hh-chi-10tb node_exporter is not answering
            description: >-
              No scrape for 3m. Either the host is frozen or down, or the
              path is broken: the egress proxy (network ns, Service
              observability/hh-chi-10tb-node-exporter), the tag:k8s-monitoring
              ACL grant, or ufw on tailscale0:9100.
        - alert: HhChiDiskSlow
          expr: |
            (
              rate(node_disk_read_time_seconds_total{job="hh-chi-10tb", device!~"loop.*|ram.*|sr.*|fd.*"}[5m])
              + rate(node_disk_write_time_seconds_total{job="hh-chi-10tb", device!~"loop.*|ram.*|sr.*|fd.*"}[5m])
            )
            /
            (
              rate(node_disk_reads_completed_total{job="hh-chi-10tb", device!~"loop.*|ram.*|sr.*|fd.*"}[5m])
              + rate(node_disk_writes_completed_total{job="hh-chi-10tb", device!~"loop.*|ram.*|sr.*|fd.*"}[5m])
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'hh-chi-10tb {{ $labels.device }}: average I/O takes {{ $value | humanizeDuration }}'
            description: >-
              Average time per completed disk operation has been over 500 ms
              for 10m. A healthy disk is under 20 ms. This is the provider's
              storage stalling; add the window to the HostHatch ticket.
        - alert: HhChiIOPressure
          expr: rate(node_pressure_io_stalled_seconds_total{job="hh-chi-10tb"}[5m]) > 0.3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'hh-chi-10tb: all work stalled on I/O {{ $value | humanizePercentage }} of the time'
            description: >-
              IO PSI "full" over 30% for 10m: every runnable task was waiting
              on the disk that share of the time. Services (journald, silo)
              hang during this.
        - alert: HhChiFilesystemFilling
          expr: |
            (1 - node_filesystem_avail_bytes{job="hh-chi-10tb", fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{job="hh-chi-10tb", fstype!~"tmpfs|overlay|squashfs"}) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'hh-chi-10tb {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full'
            description: SILO B replicates every SILO A bucket here. Prune old versions or grow the disk.
        - alert: HhChiFilesystemAlmostFull
          expr: |
            (1 - node_filesystem_avail_bytes{job="hh-chi-10tb", fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{job="hh-chi-10tb", fstype!~"tmpfs|overlay|squashfs"}) > 0.95
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'hh-chi-10tb {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full'
            description: When / fills, SILO B stops taking replication writes and the host may stop logging.
        - alert: HhChiFilesystemFullIn7Days
          expr: |
            predict_linear(node_filesystem_avail_bytes{job="hh-chi-10tb", fstype!~"tmpfs|overlay|squashfs"}[1d], 7 * 86400) < 0
            and
            node_filesystem_avail_bytes{job="hh-chi-10tb", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{job="hh-chi-10tb", fstype!~"tmpfs|overlay|squashfs"} < 0.3
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'hh-chi-10tb {{ $labels.mountpoint }} fills within 7 days at the last day''s rate'
            description: A large replication batch from SILO A is the likely cause. Check bucket growth on SILO A.
