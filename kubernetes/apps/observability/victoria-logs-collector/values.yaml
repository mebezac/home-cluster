fullnameOverride: victoria-logs-collector

image:
  repository: victoriametrics/vlagent
  # changelog: GH releases VictoriaMetrics/VictoriaLogs (vlagent ships with VictoriaLogs). Keep equal
  # to the server tag in ../victoria-logs/values.yaml and the chart appVersion - chart bumps no
  # longer move this image.
  tag: v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849

remoteWrite:
  - url: http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428
    headers:
      VL-Extra-Fields:
        cluster: home-cluster
      VL-Ignore-Fields:
        - file
        - kubernetes.node_annotations*
        - kubernetes.node_labels*
        - kubernetes.namespace_labels*
        - kubernetes.pod_annotations*
        - kubernetes.pod_labels*

collector:
  msgField:
    - message
    - msg
    - log
    - _msg
  includePodLabels: false
  includePodAnnotations: false
  includeNodeLabels: false
  includeNodeAnnotations: false

resources:
  # 7d metrics (2026-09-08): peak 45Mi, p95 42Mi, CPU peak 7m. This is a
  # DaemonSet, so the old 256Mi request was reserved on every node.
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 160Mi

podMonitor:
  enabled: true
  vm: true
