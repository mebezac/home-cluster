---
# AdGuard Home on pi-02 and pi-03 (outside the cluster). Logs in as the
# `metrics` user from the infra repo's adguard_pi role.
controllers:
  adguard-exporter:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
    containers:
      app:
        image:
          repository: ghcr.io/henrywhitaker3/adguard-exporter
          # changelog: GH releases henrywhitaker3/adguard-exporter
          tag: v1.2.3@sha256:27244b698034a190d657417fe1231db02cf2d22931d238495fd1a32bd0957185
        env:
          INTERVAL: 30s
        envFrom:
          - secretRef:
              name: adguard-exporter
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

service:
  app:
    controller: adguard-exporter
    ports:
      metrics:
        port: 9618

serviceMonitor:
  app:
    serviceName: adguard-exporter
    endpoints:
      - port: metrics
        path: /metrics
        # The exporter rebuilds these histograms from the last 1000 query-log
        # entries on every poll (since v1.2.3 it deletes and recreates them), so
        # each value is a snapshot that resets every interval and rate() on it
        # means nothing. AdGuard's own counters
        # (adguard_queries*, adguard_avg_processing_time_seconds) are kept.
        metricRelabelings:
          - action: drop
            sourceLabels: [__name__]
            regex: adguard_(queries_details_histogram|processing_time_(milliseconds|seconds))_.+
