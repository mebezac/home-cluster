fullnameOverride: smartctl-exporter
# Pinned here (tag@sha256) instead of inheriting the chart appVersion, so Renovate
# tracks the exporter image on its own. The chart renders "repository:tag".
image:
  repository: quay.io/prometheuscommunity/smartctl-exporter
  # changelog: GH releases prometheus-community/smartctl_exporter
  tag: v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
# Instance 0 (this block) runs on the five non-Mac nodes and scans for disks.
# Only sda, the internal SATA disk, is kept: the pod's /dev is a copy made at
# pod start and also holds every Longhorn iSCSI volume attached at that moment
# (IET VIRTUAL-DISK), which smartctl reads as healthy SCSI disks.
config:
  device_include: "^sda$"
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: ["talmac-01", "talmac-02", "talmac-03"]
# Instances 1-3: one per T2 Mac, for its Longhorn USB disk (Longhorn disk
# "sabrent-usb-ssd"): an Intel 670p NVMe in a Sabrent enclosure with a Realtek
# RTL9210 USB-to-NVMe bridge. smartctl reads NVMe SMART through the bridge with
# -d sntrealtek (tested on all three, 2026-11-20). The path is the enclosure's
# by-id name under /hostdev (the host's live /dev), so it survives USB
# re-enumeration; update it if an enclosure is replaced. The internal Apple NVMe
# has its own DaemonSet in apple-nvme.yaml (it needs a smartctl wrapper).
extraInstances:
  - &talmac
    config:
      devices:
        - /hostdev/disk/by-id/usb-Sabrent_SSD_830720240913000A-0:0;sntrealtek
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["talmac-01"]
    hostNetwork: false
    resources: {}
    extraArgs: {}
  - <<: *talmac
    config:
      devices:
        - /hostdev/disk/by-id/usb-Sabrent_SSD_830700000022-0:0;sntrealtek
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["talmac-02"]
  - <<: *talmac
    config:
      devices:
        - /hostdev/disk/by-id/usb-Sabrent_Sabrent_012345678930-0:0;sntrealtek
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["talmac-03"]
serviceMonitor:
  enabled: true
  # instance = node name instead of pod IP:port (alerts and dashboard 22604's
  # node picker use instance).
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: instance
  metricRelabelings:
    # The talmac USB disks: "_hostdev_disk_by-id_usb-Sabrent_..." -> the
    # Longhorn disk name.
    - sourceLabels: [device]
      regex: _hostdev_disk_by-id_usb-Sabrent_.*
      targetLabel: device
      replacement: sabrent-usb-ssd
    # The bridge passes NVMe through; dashboard 22604 shows NVMe wear only for
    # interface="nvme". protocol stays "NVMe".
    - sourceLabels: [interface]
      regex: sntrealtek
      targetLabel: interface
      replacement: nvme
prometheusRules:
  enabled: true
  rules:
    # These rules have no job filter, so they also cover the off-cluster
    # exporters: truenas-smartctl (3 NVMe + HDDs) and nuc02-smartctl (1 NVMe +
    # 1 SATA SSD). In the cluster: a SATA disk on each non-Mac node and an NVMe
    # (USB) and an Apple NVMe disk on each talmac. The chart's three NVMe rules (media errors,
    # critical warning, available spare) use their chart defaults.
    smartCTLDeviceSectorErrors:
      enabled: true
      alert: SmartCTLDeviceSectorErrors
      # Uncorrectable_Error_Cnt: the Silicon Motion SSD on nuc02 (ADATA SU800)
      # reports uncorrectable reads under this name, not Reported_Uncorrect.
      expr: increase(smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect|Uncorrectable_Error_Cnt",attribute_value_type="raw"}[1d]) > 0
      for: 0m
      annotations:
        summary: '{{ $labels.attribute_name }} grew on {{ $labels.device }}'
        description: 'Disk {{ $labels.device }} on {{ $labels.instance }} gained bad or pending sectors in the last day. Check it with smartctl and its Longhorn replicas.'
      labels:
        severity: warning
    smartCTLDDeviceTemperature:
      enabled: true
      alert: SmartCTLDDeviceTemperature
      expr: smartctl_device_temperature{temperature_type="current"} > 70
      for: 1m
      annotations:
        summary: Device has temperature higher than 70°C
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} has temperature higher than 70°C
      labels:
        severity: warning
    # Flash near the end of its rated life: NVMe percentage_used (truenas,
    # nuc02 /opt with the Frigate recordings, the talmac USB disks) or the Silicon Motion SATA SSD's
    # Remaining_Lifetime_Perc (nuc02 /). Media_Wearout_Indicator and
    # Wear_Leveling_Count are left out: their scale differs per vendor.
    smartCTLDeviceWearHigh:
      enabled: true
      alert: SmartCTLDeviceWearHigh
      expr: smartctl_device_percentage_used >= 90 or (100 - smartctl_device_attribute{attribute_name="Remaining_Lifetime_Perc",attribute_value_type="raw"}) >= 90
      for: 1h
      annotations:
        summary: '{{ $labels.device }} on {{ $labels.instance }} has used {{ $value }}% of its rated life'
        description: 'Plan a replacement for {{ $labels.device }} on {{ $labels.instance }}; the drive is at or past 90% of its rated write endurance.'
      labels:
        severity: warning
    # The exporter keeps a disk's last good reading when later reads fail (for
    # example after the disk vanished), so its values freeze instead of
    # disappearing. Fires when power-on hours and temperature both stay flat
    # for 3 h and no data was written: a live disk changes at least one of
    # them (the Apple NVMe's power-on counter barely moves, so it needs the
    # other two). Cluster exporters only: truenas HDDs may spin down. The
    # count_over_time guard skips series younger than about 2.5 h.
    smartCTLDeviceStale:
      enabled: true
      alert: SmartCTLDeviceStale
      expr: (changes(smartctl_device_power_on_seconds{job="smartctl-exporter"}[3h]) == 0 and count_over_time(smartctl_device_power_on_seconds{job="smartctl-exporter"}[3h]) > 150) unless on(instance, device) (changes(smartctl_device_temperature{job="smartctl-exporter",temperature_type="current"}[3h]) > 0 or changes(smartctl_device_bytes_written{job="smartctl-exporter"}[3h]) > 0)
      for: 0m
      annotations:
        summary: 'SMART data for {{ $labels.device }} on {{ $labels.instance }} stopped updating'
        description: 'Power-on hours, temperature and bytes written of {{ $labels.device }} on {{ $labels.instance }} did not change in 3 h, so smartctl can no longer read the disk. Check the disk (on a talmac: the USB enclosure) and the exporter pod logs.'
      labels:
        severity: warning
    # A configured or scanned disk that never gave a reading (for example a
    # talmac USB enclosure that was unplugged when the exporter started).
    smartCTLDeviceUnreadable:
      enabled: true
      alert: SmartCTLDeviceUnreadable
      expr: smartctl_devices{job="smartctl-exporter"} > on(pod) (count by (pod) (smartctl_device{job="smartctl-exporter"}) or on(pod) (0 * smartctl_devices{job="smartctl-exporter"}))
      for: 15m
      annotations:
        summary: 'The SMART exporter on {{ $labels.instance }} cannot read all its disks'
        description: 'The exporter on {{ $labels.instance }} has {{ $value }} disks configured or found but reports fewer. Check its pod logs for "S.M.A.R.T. output reading".'
      labels:
        severity: warning
