fullnameOverride: smartctl-exporter
# Skip the T2 Mac nodes (talmac-*). Their disks cannot be SMART-monitored at all:
# the USB-bridged SSDs (/dev/sd*) don't pass SMART, and the T2-mediated internal
# NVMe rejects standard SMART log pages (Invalid Log Page 0x109) — yielding zero
# usable metrics and constant errors. So we don't run the exporter there.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: ["talmac-01", "talmac-02", "talmac-03"]
serviceMonitor:
  enabled: true
prometheusRules:
  enabled: true
  rules:
    # All 5 monitored disks are SATA (interface="sat"). These three read
    # NVMe-only fields and can never fire; the SATA rule below replaces them.
    smartCTLDeviceMediaErrors:
      enabled: false
    smartCTLDeviceCriticalWarning:
      enabled: false
    smartCTLDeviceAvailableSpareUnderThreshold:
      enabled: false
    smartCTLDeviceSectorErrors:
      enabled: true
      alert: SmartCTLDeviceSectorErrors
      expr: increase(smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect",attribute_value_type="raw"}[1d]) > 0
      for: 0m
      annotations:
        summary: '{{ $labels.attribute_name }} grew on {{ $labels.device }}'
        description: 'Disk {{ $labels.device }} on {{ $labels.instance }} gained bad or pending sectors in the last day. Check it with smartctl and its Longhorn replicas.'
      labels:
        severity: warning
    smartCTLDDeviceTemperature:
      enabled: true
      alert: SmartCTLDDeviceTemperature
      expr: smartctl_device_temperature{temperature_type="current"} > 70
      for: 1m
      annotations:
        summary: Device has temperature higher than 70°C
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} has temperature higher than 70°C
      labels:
        severity: warning
