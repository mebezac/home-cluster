crds:
  enabled: true

fullnameOverride: victoria-metrics-stack

defaultDashboards:
  dashboards:
    node-exporter-full:
      enabled: false
    # No Windows/AIX/macOS nodes, one cluster, no Prometheus server.
    k8s-resources-multicluster:
      enabled: false
    k8s-resources-windows-cluster:
      enabled: false
    k8s-resources-windows-namespace:
      enabled: false
    k8s-resources-windows-pod:
      enabled: false
    k8s-windows-cluster-rsrc-use:
      enabled: false
    k8s-windows-node-rsrc-use:
      enabled: false
    nodes-aix:
      enabled: false
    nodes-darwin:
      enabled: false
    prometheus:
      enabled: false
    prometheus-remote-write:
      enabled: false
    # Built on the apiserver SLO recording rules (disabled below);
    # kubernetes-system-api-server reads raw metrics and stays.
    apiserver:
      enabled: false

# Enable Prometheus CRD conversion for smooth migration
victoria-metrics-operator:
  operator:
    disable_prometheus_converter: false
    enable_converter_ownership: true
  admissionWebhooks:
    policy: Ignore

# VMSingle - replaces Prometheus + Thanos
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    extraArgs:
      maxLabelsPerTimeseries: "120"
      search.maxConcurrentRequests: "4"
      search.maxMemoryPerQuery: "134217728"
      search.cacheTimestampOffset: 15m
    storage:
      storageClassName: longhorn-single-replica
      resources:
        requests:
          storage: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 4Gi
  route:
    enabled: true
    # Admin-only via Authelia (SecurityPolicy ./authelia.yaml)
    labels:
      auth: authelia
    hostnames:
      - vmsingle.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https

# VMAgent - replaces Prometheus scraping + Alloy
vmagent:
  enabled: true
  spec:
    selectAllByDefault: true
    serviceScrapeSelector:
      matchExpressions:
        - key: release
          operator: NotIn
          values:
            - kube-prometheus-stack
    podScrapeSelector:
      matchExpressions:
        - key: release
          operator: NotIn
          values:
            - kube-prometheus-stack
    # With a scrape selector set, a nil namespace selector means "only the
    # VMAgent's own namespace". {} = every namespace (envoy, cilium, CNPG, argo...).
    serviceScrapeNamespaceSelector: {}
    podScrapeNamespaceSelector: {}
    scrapeInterval: 30s
    externalLabels:
      cluster: home-cluster
    resources:
      # 7d metrics (2026-10-02): peak 437Mi while scraping observability only;
      # cluster-wide scraping adds ~28 scrape objects (8 cilium-agents).
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi

# VMAlert - replaces Prometheus alerting rules engine
vmalert:
  enabled: true
  spec:
    selectAllByDefault: false
    ruleSelector:
      matchExpressions:
        - key: app.kubernetes.io/instance
          operator: NotIn
          values:
            - kube-prometheus-stack
    # nil = only rules in observability; {} = rules from every namespace.
    ruleNamespaceSelector: {}
    evaluationInterval: 30s
    datasource:
      url: http://vmsingle-victoria-metrics-stack.observability.svc:8428
    remoteWrite:
      url: http://vmsingle-victoria-metrics-stack.observability.svc:8428/api/v1/write
    remoteRead:
      url: http://vmsingle-victoria-metrics-stack.observability.svc:8428/api/v1/read
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# VMAlertmanager - replaces AlertManager
alertmanager:
  enabled: true
  spec:
    replicaCount: 1
    configSecret: vmalertmanager-config
    secrets:
      - victoria-metrics-alertmanager-secret
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn-single-replica
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  route:
    enabled: true
    # Admin-only via Authelia (SecurityPolicy ./authelia.yaml)
    labels:
      auth: authelia
    hostnames:
      - alertmanager.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https

# Exporters - enabled after kube-prometheus-stack removal
prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

# Disable built-in Grafana, use existing
grafana:
  enabled: false

# Default scrape configs for K8s components
defaultRules:
  enabled: true
  # NOTE: 0.85 restructured defaultRules — `rules:` is now per-individual-rule
  # overrides (maps), and group enable/disable moved to `groups.<name>.enabled`
  # with renamed keys. etcd rules are on by default (groups.etcd). We disable the
  # scheduler + controller-manager rule groups since Talos doesn't expose those
  # components (kubeProxy has no rule group in 0.85).
  rules:
    # count:up0 counts DOWN scrape targets, so it legitimately produces zero
    # samples whenever every target is healthy — which trips RecordingRulesNoData
    # (a severity=info false-positive that also drags in InfoInhibitor). Disable it.
    RecordingRulesNoData:
      enabled: false
  groups:
    vmcluster:
      enabled: false
    kube-scheduler.rules:
      enabled: false
    kubernetes-system-scheduler:
      enabled: false
    kubernetes-system-controller-manager:
      enabled: false
    # apiserver SLO/burn-rate rules need apiserver_request_sli_duration_seconds_bucket
    # (~49k series, the single biggest metric). Not worth it for one user.
    kube-apiserver-availability.rules:
      enabled: false
    kube-apiserver-burnrate.rules:
      enabled: false
    kube-apiserver-histogram.rules:
      enabled: false
    kube-apiserver-slos:
      enabled: false

# apiserver /metrics grows with every new verb/resource pair it serves (a
# namespace deletion adds one per API type) and outgrew the 16MiB default.
# Raise the cap, and drop the big histograms no rule or dashboard reads
# (the SLO rule groups that read the sli buckets are disabled above).
kubeApiServer:
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          max_scrape_size: 64MiB
          metricRelabelConfigs:
            - action: drop
              sourceLabels: [__name__]
              regex: (apiserver_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_request_sli_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|etcd_request_duration_seconds|rest_client_request_duration_seconds)_bucket
            - action: drop
              sourceLabels: [__name__]
              regex: kubernetes_feature_enabled

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: true
  endpoints:
    - 10.25.30.35
    - 10.25.30.45
    - 10.25.30.46
  service:
    port: 2381
    targetPort: 2381
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: http

kubelet:
  enabled: true
  vmScrape:
    spec:
      interval: 30s
      # Setting this list replaces the chart defaults, so the first two entries
      # restore them (uid/id/name labels, rest_client histograms).
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid|id|name)
        - action: drop
          sourceLabels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count|kubernetes_feature_enabled)
        - action: labeldrop
          regex: (feature_node_kubernetes_io_.+|extensions_talos_dev_.+|gpu_.+|intel_feature_node_kubernetes_io_.+|beta_kubernetes_io_.+)
        # Pod sandbox (pause) series duplicate the pod cgroup, except network:
        # cAdvisor only reports pod network counters on the sandbox.
        - action: drop
          if: '{image=~".*/pause:.*", __name__!~"container_network_.+"}'
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_node_name]
          targetLabel: node
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet
