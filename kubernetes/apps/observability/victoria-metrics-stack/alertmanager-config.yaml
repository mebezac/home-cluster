apiVersion: v1
kind: Secret
metadata:
  name: vmalertmanager-config
  namespace: observability
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'job']
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h
      # Unrouted alerts (warning or no severity) go out at normal priority.
      receiver: pushover-warning
      routes:
        # Dead-man's switch: Watchdog always fires, so HetrixTools gets a
        # heartbeat every ~2m and alerts if the vmalert -> alertmanager
        # pipeline stops. Hetrix expects one ping per 5m.
        - receiver: heartbeat
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 2m
          continue: false
        - receiver: 'null'
          matchers:
            - alertname = "InfoInhibitor"
          continue: false
        # critical: priority 1 (bypasses quiet hours), repeats every 4h.
        - receiver: pushover-critical
          matchers:
            - severity = "critical"
          repeat_interval: 4h
        # info: never sent; visible in Alertmanager / Grafana only.
        - receiver: 'null'
          matchers:
            - severity =~ "info|none"
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'namespace']
    receivers:
      - name: 'null'
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/vm/secrets/victoria-metrics-alertmanager-secret/HETRIX_HEARTBEAT_URL
            send_resolved: false
      - name: pushover-critical
        pushover_configs:
          - html: true
            send_resolved: true
            sound: gamelan
            priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
            title: >-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
              {{ .CommonLabels.alertname }}{{ with .CommonLabels.severity }} ({{ . }}){{ end }}
            # Alert name, severity and count are in the title. The message is one
            # summary line per alert, at most 5, so a big group stays under
            # Pushover's 1024-character limit (it truncates longer messages).
            # The full labels are in Alertmanager (the "View in Alertmanager" link).
            message: |-
              {{- range $i, $a := .Alerts }}
                {{- if lt $i 5 }}
              • {{ with $a.Annotations.summary }}{{ . }}{{ else }}{{ with $a.Annotations.description }}{{ . }}{{ else }}{{ $a.Labels.alertname }}{{ end }}{{ end }}
                {{- end }}
              {{- end }}
              {{- if gt (len .Alerts) 5 }}
              <i>(showing 5 of {{ len .Alerts }})</i>
              {{- end }}
            url_title: View in Alertmanager
            expire: 86400s
            user_key_file: /etc/vm/secrets/victoria-metrics-alertmanager-secret/PUSHOVER_USER_KEY
            token_file: /etc/vm/secrets/victoria-metrics-alertmanager-secret/PUSHOVER_ALERTMANAGER_KEY
      - name: pushover-warning
        pushover_configs:
          - html: true
            send_resolved: true
            sound: pushover
            priority: '0'
            title: >-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
              {{ .CommonLabels.alertname }}{{ with .CommonLabels.severity }} ({{ . }}){{ end }}
            # Alert name, severity and count are in the title. The message is one
            # summary line per alert, at most 5, so a big group stays under
            # Pushover's 1024-character limit (it truncates longer messages).
            # The full labels are in Alertmanager (the "View in Alertmanager" link).
            message: |-
              {{- range $i, $a := .Alerts }}
                {{- if lt $i 5 }}
              • {{ with $a.Annotations.summary }}{{ . }}{{ else }}{{ with $a.Annotations.description }}{{ . }}{{ else }}{{ $a.Labels.alertname }}{{ end }}{{ end }}
                {{- end }}
              {{- end }}
              {{- if gt (len .Alerts) 5 }}
              <i>(showing 5 of {{ len .Alerts }})</i>
              {{- end }}
            url_title: View in Alertmanager
            expire: 86400s
            user_key_file: /etc/vm/secrets/victoria-metrics-alertmanager-secret/PUSHOVER_USER_KEY
            token_file: /etc/vm/secrets/victoria-metrics-alertmanager-secret/PUSHOVER_ALERTMANAGER_KEY
