# gatus: one check per HTTPRoute (found by gatus-sidecar), plus the static
# endpoints in gatus-config.yaml. History in the central CNPG database, so no
# PVC and no Kopiur source. Alerts: prometheusrule.yaml (vmalert), not gatus.
defaultPodOptions:
  # The sidecar reads HTTPRoutes and Gateways through the API (rbac below).
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  gatus:
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      identifier: gatus
    initContainers:
      # Native sidecar (restartPolicy: Always): starts before gatus and keeps
      # running. It writes /config/gatus-sidecar.yaml (endpoints only).
      gatus-sidecar:
        image:
          repository: ghcr.io/home-operations/gatus-sidecar
          # changelog: GH releases home-operations/gatus-sidecar
          tag: 0.6.1@sha256:c2b24374a8a4c5551c0122f3a7ae383ff65a0ea0bcd3b541530db84490fea2af
        args:
          # Every HTTPRoute gets a check. A route opts out with the annotation
          # gatus.home-operations.com/enabled: "false". The Gateway's
          # gatus.home-operations.com/endpoint annotation is the default for
          # its routes (network/envoy-gateway/gateways.yaml).
          - --auto-httproute
        restartPolicy: Always
        securityContext: &securityContext
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
    containers:
      app:
        image:
          repository: ghcr.io/twin/gatus
          # changelog: GH releases TwiN/gatus
          tag: v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
        env:
          TZ: America/New_York
          # A directory: gatus merges config.yaml with the sidecar's file.
          GATUS_CONFIG_PATH: /config
          # Gives the sidecar time to write its file before the first load.
          GATUS_DELAY_START_SECONDS: "5"
        envFrom:
          - secretRef:
              name: gatus-secret   # GATUS_POSTGRES_URL
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          readiness: *probes
        securityContext: *securityContext
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 512Mi }

serviceAccount:
  gatus: {}

rbac:
  roles:
    gatus:
      type: ClusterRole
      rules:
        # HTTPRoutes to check, and their Gateways for the default annotation.
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["httproutes", "gateways"]
          verbs: ["get", "list", "watch"]
  bindings:
    gatus:
      type: ClusterRoleBinding
      roleRef:
        identifier: gatus
      subjects:
        - identifier: gatus

service:
  app:
    controller: gatus
    ports:
      http:
        port: 8080

serviceMonitor:
  app:
    serviceName: gatus
    endpoints:
      - port: http
        path: /metrics
        interval: 1m

route:
  app:
    labels:
      auth: authelia   # observability's SecurityPolicy (victoria-metrics-stack/authelia.yaml)
    hostnames:
      - status.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  # Writable dir for the sidecar's output; gatus reads the whole dir.
  config:
    type: emptyDir
    globalMounts:
      - path: /config
  config-file:
    type: configMap
    name: gatus-config
    globalMounts:
      - path: /config/config.yaml
        subPath: config.yaml
        readOnly: true
