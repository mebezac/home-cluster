---
defaultPodOptions:
  securityContext:
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: "OnRootMismatch"

controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/advplyr/audiobookshelf
          tag: 2.37.0@sha256:6432d1dc58951b0280b29144ffc69834a8ae02786a2126f6b7c9bd453801c78b
        resources:
          # 7d metrics (2026-09-08): peak 60Mi, CPU essentially flat.
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 256Mi
        env:
          AUDIOBOOKSHELF_UID: 3000
          AUDIOBOOKSHELF_GID: 3000
          TZ: America/Detroit

service:
  main:
    controller: main
    ports:
      http:
        port: 80

ingress:
  main:
    enabled: true
    className: external
    annotations:
      external-dns.kubernetes.io/target: external.laboratory.casa
      bothy.dev/enabled: "true"
      bothy.dev/name: "Audiobookshelf"
      bothy.dev/description: "Audiobooks & podcasts"
      bothy.dev/section: "Media"
      bothy.dev/icon: "sh:audiobookshelf"
    hosts:
      - host: audiobookshelf.laboratory.casa
        paths:
          - path: /
            pathType: ImplementationSpecific
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 500Mi
    suffix: config
    globalMounts:
      - path: /config
        subPath: config
      - path: /metadata
        subPath: metadata

  audiobooks:
    enabled: true
    type: nfs
    server: nas.laboratory.casa
    path: /mnt/data/10tb/Media/Audiobooks
    globalMounts:
      - path: /audiobooks
