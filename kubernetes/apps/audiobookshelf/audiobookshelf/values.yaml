---
defaultPodOptions:
  securityContext:
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: "OnRootMismatch"

controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/advplyr/audiobookshelf
          tag: 2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
        resources:
          # 7d metrics (2026-09-08): peak 60Mi, CPU essentially flat.
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 256Mi
        env:
          AUDIOBOOKSHELF_UID: 3000
          AUDIOBOOKSHELF_GID: 3000
          TZ: America/Detroit

service:
  main:
    controller: main
    ports:
      http:
        port: &port 80

# First real app on the external Gateway. The external-dns target comes off the
# Gateway itself, so this route needs no annotations of its own.
route:
  main:
    hostnames:
      - audiobookshelf.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: *port

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 500Mi
    suffix: config
    globalMounts:
      - path: /config
        subPath: config
      - path: /metadata
        subPath: metadata

  audiobooks:
    enabled: true
    type: nfs
    server: nas.laboratory.casa
    path: /mnt/data/10tb/Media/Audiobooks
    globalMounts:
      - path: /audiobooks
