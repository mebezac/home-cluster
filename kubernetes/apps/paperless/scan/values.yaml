# Brother MFC-J475DW scan button for Paperless (Argo app paperless-scan). The PDFs land
# in the Paperless consume folder on the NAS, which paperless/paperless polls.
controllers:
  # Brother MFC-J475DW scan button -> consume folder (brscan-skey). The printer has
  # no scan-to-FTP/SMB, only Brother's "Scan to PC" push: brscan-skey registers this
  # host with the printer over SNMP (write community "internal"), the printer sends the
  # button event to UDP 54925 on that host, and the pod pulls the pages over TCP 54921.
  # Panel: SCAN -> to File (any target works) -> pick the name -> OK.
  # - Own namespace (paperless-scan, PodSecurity privileged for hostNetwork), so the
  #   paperless namespace with the documents stays at the baseline level.
  # - hostNetwork: the printer (IoT-Local VLAN) must reach the pod, and the
  #   registration carries the host IP. Firewall: unifi-tofu L3/L4 (nodes -> printer
  #   tcp 54921, udp 161) and L5 (printer -> nodes udp 54925).
  # - Two targets, two pods: both bind UDP 54925, so required anti-affinity keeps them
  #   on different nodes, and Recreate stops a rollout from landing beside the old pod.
  # - Root (the image writes its config under /opt and /etc and chowns each PDF to
  #   PUID); only CHOWN/DAC_OVERRIDE/FOWNER. The NFS share maps root to root.
  # Image: github.com/devzwf/brscan-skey-docker (scripts reviewed 2026-11-14; Brother
  # debs pinned by sha256 in its Dockerfile). Rebuilt weekly under the same tag, so
  # Renovate bumps the digest.
  one-side: &scan
    strategy: Recreate
    pod: &scanpod
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      labels:
        brscan-skey: "true"
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  brscan-skey: "true"
    containers:
      app: &scanapp
        image: &scanimage
          repository: docker.io/devzwf/brscan-skey
          tag: 1.0.2@sha256:05a9dc15ffcafae9b9f6737a56d060a6de3bf2aadf58fb415e28c17e1fea20db
        # TrueNAS /mnt/data/10tb uses NFSv4 ACLs (aclmode=restricted), which rejects
        # chmod() with EPERM even as root. Upstream scantofile.sh uses `install -m 0664`,
        # leaving the PDF stranded in .brscan-tmp/. Patch that line to stream + chown so
        # the file inherits the dataset ACL and still drops atomically via mv.
        command:
          - /bin/sh
          - -c
          - >-
            grep -qF 'install -o "$PUID" -g "$PGID" -m 0664 "$WORK/out.pdf" "$STAGE"' /opt/scan/scantofile.sh &&
            sed -i 's|install -o "\$PUID" -g "\$PGID" -m 0664 "\$WORK/out.pdf" "\$STAGE"|cat "$WORK/out.pdf" > "$STAGE" \&\& chown "$PUID:$PGID" "$STAGE"|' /opt/scan/scantofile.sh &&
            exec /usr/bin/tini -- /opt/scan/entrypoint.sh
        env: &scanenv
          SCANNER_IP: 10.25.41.183
          SCANNER_MODEL: MFC-J475DW
          SKEY_USER: Paperless
          TZ: America/New_York
          PUID: "3000"
          PGID: "3000"
          SCAN_RESOLUTION: "300"
          SCAN_MODE: True Gray
          SCAN_PAGE_SIZE: Letter
        securityContext: &scansc
          allowPrivilegeEscalation: false
          capabilities: { add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"], drop: ["ALL"] }
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["pgrep", "-x", "brscan-skey-exe"]
              initialDelaySeconds: 20
              periodSeconds: 60
          readiness:
            enabled: false
          startup:
            enabled: false
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            # scanimage + img2pdf hold a 20-page 300 dpi batch in memory.
            memory: 1Gi

  # Second panel name: writes to consume/double-sided/ for collation (see
  # PAPERLESS_CONSUMER_ENABLE_COLLATE_DOUBLE_SIDED). Its own init makes that folder
  # 3000-owned before the subPath mount (a kubelet-made one would be root's).
  two-side:
    <<: *scan
    initContainers:
      init-consume:
        image: *scanimage
        command:
          - sh
          - -c
          - mkdir -p /nas/paperless/consume/double-sided && chown 3000:3000 /nas/paperless/consume/double-sided
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"], drop: ["ALL"] }
    containers:
      app:
        <<: *scanapp
        env:
          <<: *scanenv
          # Brother shows at most 15 characters; no spaces in the brscan-skey config.
          SKEY_USER: Paperless-2Side

persistence:
  # The Paperless consume folder: /mnt/data/10tb/paperless/consume (3000:3000). Only the
  # subPath is mounted into the app containers.
  nas:
    type: nfs
    server: nas.laboratory.casa
    path: /mnt/data/10tb
    advancedMounts:
      one-side:
        app:
          - path: /output
            subPath: paperless/consume
      two-side:
        init-consume:
          - path: /nas
        app:
          - path: /output
            subPath: paperless/consume/double-sided
