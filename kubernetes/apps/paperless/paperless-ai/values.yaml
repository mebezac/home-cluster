defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  paperless-ai:
    annotations:
      reloader.stakater.com/auto: "true"
    # AI metadata for Paperless (paperless/paperless): a Paperless workflow webhook sends
    # every new document here (x-api-key = API_KEY); the 30-min poll catches misses.
    # It writes title, tags, correspondent, type, date and custom fields as the Paperless
    # user "paperless-ai" (not a superuser), which only sees documents it may change: the
    # same workflow grants it change permission on each new document.
    # Login: local only (no SSO in v4). The one account was made through the setup API
    # right after the first deploy; credentials in Secret paperless-ai-login (sops).
    # Env vars below override config.json on the PVC and show as locked in the UI.
    containers:
      app:
        image:
          repository: docker.io/clusterzx/paperless-ai
          # changelog: GH releases clusterzx/paperless-ai. 4.0.0 (2026-11-10) is a full
          # rewrite; 3.x had an unauthenticated setup wizard (exploited). Read the notes
          # for config.json / DB migrations before bumping. SYSTEM_PROMPT below is a frozen
          # copy of the default prompt: diff src/server/config/defaults.ts between the old
          # and new tag on every bump and carry over upstream changes.
          tag: 4.1.0@sha256:ccc6cb3ef433ccf3bcf8ed5d27cb0d0e0802d3f567a80c2fae90ae7e7b6d32cd
        env:
          TZ: America/New_York
          # Envoy terminates TLS: trust one hop so the login rate limit sees the client IP
          # and the session cookie gets Secure.
          TRUST_PROXY: "1"
          # --- Paperless. PAPERLESS_API_TOKEN is in paperless-ai-secret.
          PAPERLESS_API_URL: http://paperless.paperless.svc.cluster.local:8000
          PAPERLESS_PUBLIC_URL: https://paperless.laboratory.casa
          # --- Metadata AI: Claude (native client; key in the secret). Sonnet, not Haiku:
          # ~$5 per 1,000 documents vs ~$0.24, well inside the monthly free credit, for
          # better results on messy OCR and ambiguous documents.
          AI_PROVIDER: anthropic
          ANTHROPIC_MODEL: claude-sonnet-5-5
          # --- "Ask your archive" embeddings: Qwen3-Embedding-8B via OpenRouter
          # (MTEB multilingual retrieval 70.9, $0.01/M tokens). The "custom" provider is
          # only used for embeddings here; CUSTOM_API_KEY is in the secret.
          CUSTOM_BASE_URL: https://openrouter.ai/api/v1
          RAG_ENABLED: "yes"
          RAG_EMBEDDING_PROVIDER: custom
          RAG_EMBEDDING_MODEL: qwen/qwen3-embedding-8b
          # --- Processing: every new document (webhook + poll), new tags/correspondents/
          # types allowed, mark processed documents.
          PROCESS_PREDEFINED_DOCUMENTS: "no"
          ADD_AI_PROCESSED_TAG: "yes"
          AI_PROCESSED_TAG_NAME: ai-processed
          RESTRICT_TO_EXISTING_TAGS: "no"
          RESTRICT_TO_EXISTING_CORRESPONDENTS: "no"
          RESTRICT_TO_EXISTING_DOCUMENT_TYPES: "no"
          SHARE_CREATED_OBJECTS: "yes"
          # Base prompt = the v4.0.0 DEFAULT_SYSTEM_PROMPT (src/server/config/defaults.ts),
          # copied verbatim except the tag limit (4 -> 8, both lines), plus our sections
          # (recurring-bill titles, utility tags and type, CHOICE gas correspondent, language,
          # custom fields) at the end. The upstream
          # examples are German ("de", "German branch") and Sonnet once answered an English
          # order in German, so the English rule is explicit. SYSTEM_PROMPT replaces the
          # built-in base (paperless-ai appends its fixed output rules and the field list
          # after it). Per-field hints ("description") would be cleaner, but the env parser
          # drops them, so field hints from Git go here.
          SYSTEM_PROMPT: |-
            You are a personalized document analyzer. Your task is to analyze documents and extract relevant information.

            Analyze the document content and extract the following information into a structured JSON object:

            1. title: Create a concise, meaningful title for the document
            2. correspondent: Identify the sender/institution but do not include addresses
            3. tags: Select up to 8 relevant thematic tags
            4. document_date: Extract the document date (format: YYYY-MM-DD)
            5. document_type: Determine a precise type that classifies the document (e.g. Invoice, Contract, Employer, Information and so on)
            6. language: Determine the document language (e.g. "de" or "en")

            Important rules for the analysis:

            For tags:
            - FIRST check the existing tags before suggesting new ones
            - Use only relevant categories
            - Maximum 8 tags per document, less if sufficient (at least 1)
            - Avoid generic or too specific tags
            - Use only the most important information for tag creation
            - The output language is the one used in the document! IMPORTANT!

            For the title:
            - Short and concise, NO ADDRESSES
            - Contains the most important identification features
            - For invoices/orders, mention invoice/order number if available
            - The output language is the one used in the document! IMPORTANT!

            For the correspondent:
            - Identify the sender or institution
              When generating the correspondent, always create the shortest possible form of the company name (e.g. "Amazon" instead of "Amazon EU SARL, German branch")

            For the document date:
            - Extract the date of the document
            - Use the format YYYY-MM-DD
            - If multiple dates are present, use the most relevant one

            For the language:
            - Determine the document language
            - Use language codes like "de" for German or "en" for English
            - If the language is not clear, use "und" as a placeholder

            Titles of recurring bills and statements (utilities, phone, internet, bank,
            insurance): the title must be exactly "<Correspondent> <Document type> YYYY-MM",
            where YYYY-MM is the month of the bill date (e.g. "City of Bowling Green Utility
            Bill 2026-09"). Never put an address or account number in any title; those belong
            in the custom fields.

            Tags on utility bills: tag each utility the bill charges for, using exactly these
            names: Electric, Water, Sewer, Refuse, Gas. Also add the tags Utilities and Bill.
            The document type of every utility bill (electric, water, sewer, refuse or gas) is
            exactly "Utility Bill".

            Gas bills under the Customer CHOICE program: the correspondent is the utility that
            sends the bill and delivers the gas (e.g. "Columbia Gas of Ohio"), never the gas
            supplier named on the bill (e.g. IGS Energy).

            Language: this is an American household archive. Write the title, tags,
            correspondent and document type in English, even when the document is in another
            language. Never translate them into German.

            For custom fields:
            - Reference Number: only the identifier itself, without words or symbols like "Order", "Invoice", "No." or "#" (e.g. "27382", not "Order #27382")
            - Account Number: the customer or account number at the correspondent; never a payment card number or its last digits
            - Service Period Start / Service Period End: the meter read or service period of a utility bill (e.g. "METER READ BEGIN & END DATES 08/15/2026 - 09/15/2026"). On a gas bill, the two "Reading on" dates under Meter Readings (the earlier one is the start); they have no year, so take it from the statement date (a December start on a January bill is in the previous year)
            - Electric Usage (kWh): the USAGE column of the electric meter row, in kWh (a count, not dollars)
            - Water Usage (cu ft): the USAGE column of the water meter row; the unit "CFW" means cubic feet of water
            - Gas Usage (Ccf): the "Gas Used (Ccf)" line under Meter Readings; never a number from the usage history chart or table
            - Charge fields: copy each amount exactly as printed, never add lines together.
              On a City of Bowling Green bill (CURRENT CHARGES): "Electric Usage" (dollars) -> Electric Usage Charge, "Electric Customer Charge" -> Electric Customer Charge, "Inside Corporation kWh Tax" -> Electric kWh Tax, "Water Usage" -> Water Usage Charge, "Water Customer Charge" -> Water Customer Charge, "Sewer Usage" -> Sewer Usage Charge, "Sewer Customer Charge" -> Sewer Customer Charge, "Refuse / Recycling Charge" -> Refuse Charge.
              On a gas bill (Detail Charges): "Fixed Monthly Delivery Charge" -> Gas Fixed Delivery Charge, "Usage Based Charges" -> Gas Usage Based Charge, the delivery subtotal "Delivery - <utility>" -> Gas Delivery Charge, the "Taxes & Fees" subtotal -> Gas Taxes, the supply subtotal "Supply - <supplier>" -> Gas Supply Charge, the supplier's name -> Gas Supplier, and the supplier's price per Ccf ("at the rate of $0.57500 per Ccf") -> Gas Supply Rate (per Ccf), as a number with all its decimals
            - Total: the amount of this bill's own charges. On a utility bill that is TOTAL CURRENT CHARGES or "Total Current Utility Charges" (the sum of the charge lines); never a total that adds a past-due balance or penalties. On an invoice or order, the grand total
          # Custom fields the AI may fill. It never invents fields: the prompt allows only
          # these names, and paperless-ai creates each one in Paperless (with this type) the
          # first time a document has a value for it. A field is set only when the value is
          # in the document. Types: string longtext integer float monetary date boolean url
          # (select fields are not auto-created).
          CUSTOM_FIELDS: >-
            {"custom_fields":[
            {"value":"Total","data_type":"monetary","currency":"USD"},
            {"value":"Due Date","data_type":"date"},
            {"value":"Reference Number","data_type":"string"},
            {"value":"Account Number","data_type":"string"},
            {"value":"Expiration Date","data_type":"date"},
            {"value":"Service Period Start","data_type":"date"},
            {"value":"Service Period End","data_type":"date"},
            {"value":"Electric Usage (kWh)","data_type":"integer"},
            {"value":"Water Usage (cu ft)","data_type":"integer"},
            {"value":"Electric Usage Charge","data_type":"monetary","currency":"USD"},
            {"value":"Electric Customer Charge","data_type":"monetary","currency":"USD"},
            {"value":"Electric kWh Tax","data_type":"monetary","currency":"USD"},
            {"value":"Water Usage Charge","data_type":"monetary","currency":"USD"},
            {"value":"Water Customer Charge","data_type":"monetary","currency":"USD"},
            {"value":"Sewer Usage Charge","data_type":"monetary","currency":"USD"},
            {"value":"Sewer Customer Charge","data_type":"monetary","currency":"USD"},
            {"value":"Refuse Charge","data_type":"monetary","currency":"USD"},
            {"value":"Gas Usage (Ccf)","data_type":"integer"},
            {"value":"Gas Fixed Delivery Charge","data_type":"monetary","currency":"USD"},
            {"value":"Gas Usage Based Charge","data_type":"monetary","currency":"USD"},
            {"value":"Gas Delivery Charge","data_type":"monetary","currency":"USD"},
            {"value":"Gas Taxes","data_type":"monetary","currency":"USD"},
            {"value":"Gas Supply Charge","data_type":"monetary","currency":"USD"},
            {"value":"Gas Supplier","data_type":"string"},
            {"value":"Gas Supply Rate (per Ccf)","data_type":"float"}]}
        envFrom:
          # PAPERLESS_API_TOKEN, ANTHROPIC_API_KEY, CUSTOM_API_KEY (OpenRouter), API_KEY,
          # JWT_SECRET.
          - secretRef:
              name: paperless-ai-secret
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        probes:
          # /health is unauthenticated and 200 even before setup (503 only if SQLite fails).
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet: { path: /health, port: 3000 }
              periodSeconds: 30
              timeoutSeconds: 5
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: { path: /health, port: 3000 }
              periodSeconds: 5
              failureThreshold: 30
        resources:
          # README: ~80-150 MB idle. No local embedder (OpenRouter), so no 0.5 GB spike.
          requests:
            cpu: 20m
            memory: 192Mi
          limits:
            memory: 768Mi

service:
  app:
    controller: paperless-ai
    ports:
      http:
        port: 3000

route:
  app:
    hostnames:
      - paperless-ai.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  # config.json (setupCompleted, the account), paperless-ai.db (SQLite: processing state,
  # history with undo, the RAG passages and vectors).
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore paperless-ai-data,
    # kopiur-backup source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: paperless-ai-data
    globalMounts:
      - path: /app/data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
