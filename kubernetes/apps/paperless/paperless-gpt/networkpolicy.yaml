---
# paperless-gpt has no login of its own (Authelia guards only the route), so only the
# envoy-internal proxy pods may reach it. Kubelet probes are host traffic, which Cilium
# allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-gpt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: paperless-gpt
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 8080
