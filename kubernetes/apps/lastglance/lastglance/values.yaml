controllers:
  lastglance:
    containers:
      app:
        image:
          repository: ghcr.io/krelltunez/lastglance
          # changelog: GH releases krelltunez/lastGLANCE (Renovate skips intermediate versions in the PR body - check the full tag list). Static browser-side app, no server state; GLANCEvault sync notes do not apply
          tag: 2.11.0@sha256:3cbd5ee1d59d8da7aa9c48b64b08847cbf6e5fbb55e7cc47ee1a51a6f1a0d909
        env:
          TZ: America/New_York
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

service:
  app:
    controller: lastglance
    ports:
      http:
        port: 80

route:
  app:
    hostnames:
      - last.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
