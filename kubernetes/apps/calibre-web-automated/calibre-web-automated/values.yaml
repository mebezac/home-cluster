controllers:
  calibre-web-automated:
    containers:
      app:
        image:
          repository: ghcr.io/crocodilestick/calibre-web-automated
          # changelog: GH releases crocodilestick/Calibre-Web-Automated (Renovate links the linuxserver baseimage by mistake, so the PR body is empty) - read "Upgrade Notes"
          tag: v4.0.8@sha256:5e00373854247750cc3e4479b492ae09293ff5e06ed10177f226634d97888679
        env:
          CACHE_DIR: /cache
          PUID: 1000
          PGID: 1000
          TZ: America/New_York
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 8083
              initialDelaySeconds: 120
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 10
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 5m
            memory: 128Mi
          limits:
            memory: 512Mi

service:
  app:
    ports:
      http:
        port: *port

ingress:
  app:
    enabled: true
    className: internal
    hosts:
      - host: calibre.laboratory.casa
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 128Mi
    globalMounts:
      - path: /config
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: cache
    size: 512Mi
    globalMounts:
      - path: /cache
  media:
    enabled: true
    type: persistentVolumeClaim
    storageClass: freenas-api-nfs
    accessMode: ReadWriteMany
    size: 2Gi
    globalMounts:
      - path: /calibre-library
        subPath: library
      - path: /cwa-book-ingest
        subPath: ingest
