---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Public entry for GitHub push webhooks ONLY (both repos post here). The Argo
# CD UI/API stays on envoy-internal (argo.laboratory.casa). A separate hostname
# because one hostname on both Gateways would make k8s-gateway hand LAN
# clients the external IP too. Payloads are HMAC-verified by Argo
# (webhook.github.secret in argocd-secret).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-cd-webhook
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - argo-webhook.laboratory.casa
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/webhook
          method: POST
      backendRefs:
        - name: argo-cd-argocd-server
          port: 80
