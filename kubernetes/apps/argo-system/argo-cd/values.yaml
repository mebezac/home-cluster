crds:
  install: true
  annotations:
    argocd.argoproj.io/sync-options: Replace=false,ServerSideApply=true
global:
  domain: argo.laboratory.casa
  logging:
    level: warn
configs:
  params:
    server.insecure: true
    # Server-side diff for every app: dry-run applies so CRD defaults (HTTPRoutes etc.) don't show as drift.
    controller.diff.server.side: "true"
    # Argo CD 3.6+: turn off the /swagger-ui page. The CLI, UI and argocd-mcp use the API, not this page.
    server.disable.swagger.ui: "true"
  cm:
    oidc.config: |
      name: 'Authelia'
      issuer: 'https://login.laboratory.casa'
      clientID: 'By4sXGwiayM7NNeMvTuYMPFOJatVapIBtK8rdnFF1FTexB6oh0Xv_jUCkeEw9L8s~EP3bT7s'
      clientSecret: $oidcClientSecret
      enableUserInfoGroups: true
      userInfoPath: /api/oidc/userinfo
      userInfoCacheExpiration: "5m"
      requestedScopes:
          - 'email'
          - 'groups'
          - 'openid'
          - 'profile'
    statusbadge.enabled: true
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
    resource.compareoptions: |
      ignoreAggregatedRoles: true
      ignoreResourceStatusField: crd
    # Kopiur kinds (kubernetes/charts/kopiur-backup) report kstatus conditions:
    # Stalled=True is Degraded, Ready=True is Healthy. A passive populator Restore
    # waits for a PVC to claim it (AwaitingClaim=True, Ready=False): Healthy too.
    # Wildcards work only in this block form, not in resource.customizations.health.* keys.
    resource.customizations: |
      kopiur.home-operations.com/*:
        health.lua: |
          local hs = { status = "Progressing", message = "Waiting for Ready" }
          if obj.status == nil or obj.status.conditions == nil then
            return hs
          end
          local c = {}
          for _, cond in ipairs(obj.status.conditions) do
            c[cond.type] = cond
          end
          if c.Stalled ~= nil and c.Stalled.status == "True" then
            hs.status = "Degraded"
            hs.message = c.Stalled.message or c.Stalled.reason or "Stalled"
            return hs
          end
          if c.Ready ~= nil and c.Ready.status == "True" then
            hs.status = "Healthy"
            hs.message = c.Ready.message or c.Ready.reason or ""
            return hs
          end
          if c.AwaitingClaim ~= nil and c.AwaitingClaim.status == "True" then
            hs.status = "Healthy"
            hs.message = "Passive populator: waiting for a PVC to claim it"
            return hs
          end
          if c.Ready ~= nil then
            hs.message = c.Ready.message or c.Ready.reason or hs.message
          end
          return hs
    # Local service account for the argocd-mcp server (token auth only, no UI login)
    accounts.mcp: apiKey
  rbac:
    create: true
    policy.default: role:none
    scopes: "[groups, email]"
    policy.csv: |
      p, role:none, *, *, */*, deny
      g, apps_readonly, role:readonly
      g, apps_admin, role:admin
      g, zac, role:readonly
      g, mcp, role:admin
  # ksops renders argocd-secret from ./argocd-secret.sops.yaml (admin password,
  # GitHub webhook secret, oidcClientSecret). Argo CD itself adds server.secretkey
  # and accounts.mcp.tokens at runtime; server-side apply leaves those keys alone.
  secret:
    createSecret: false
controller:
  replicas: 1
  # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 790Mi, max 1079Mi (2026-10-02 audit saw 1599Mi). CPU p95 90m.
  resources:
    requests:
      cpu: 100m
      memory: 896Mi
    # First limit on this container: >= 4x the recorded max, because 5-minute samples miss startup spikes (copyparty, 2026-10-21).
    limits:
      memory: 6Gi
  metrics:
    enabled: true
    applicationLabels:
      enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
# Login is OIDC straight to Authelia (configs.cm oidc.config), so Dex has
# nothing to do.
dex:
  enabled: false
redis:
  exporter:
    enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
server:
  replicas: 1
  allowAnyNamespace: true
  httproute:
    enabled: true
    # LAN/tailnet only. GitHub webhooks come in on the separate public
    # argo-webhook.laboratory.casa route (./webhook-httproute.yaml).
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    hostnames:
      - argo.laboratory.casa
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
# Off (audit #108, 2026-11-27): it delivered 0 notifications in 7 days, and the
# ArgoAppUnhealthy / ArgoAppOutOfSync rules (prometheusrule.yaml) already page.
notifications:
  enabled: false
repoServer:
  replicas: 1
  affinity:
    # Prefer the talmacs (12 cores, 32 GB each); still schedules elsewhere when they are full or down.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [talmac-01, talmac-02, talmac-03]
  # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 71Mi, max 314Mi (helm/ksops renders spike). CPU p95 168m.
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      memory: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
  serviceAccount:
    create: true
    name: argocd-repo-server
  # ksops (kustomize exec plugin, kustomize.buildOptions above) decrypts the
  # *.sops.yaml Secrets with this age key. Kustomize and Helm are the ones bundled
  # in the Argo CD image. The Secret name is historical (helm-secrets is gone); it
  # holds the age private key and is created by `task bootstrap:apps`, not by git.
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/key.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: helm-secrets-private-keys
  volumeMounts:
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true
  initContainers:
    - name: install-ksops
      # changelog: github.com/viaduct-ai/kustomize-sops/releases. Distroless image (no shell):
      # `ksops install` copies only the ksops binary. Do not add --with-kustomize: the image
      # builds an old kustomize (v5.3.0 in v4.5.1); Argo CD bundles a current one.
      image: docker.io/viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
      command:
        - /usr/local/bin/ksops
        - install
        - /custom-tools
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        # numeric, because the image sets USER by name (nonroot) and runAsNonRoot needs a UID
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
