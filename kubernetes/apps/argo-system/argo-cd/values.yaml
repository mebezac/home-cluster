crds:
  install: true
  annotations:
    argocd.argoproj.io/sync-options: Replace=false,ServerSideApply=true
global:
  domain: argo.laboratory.casa
  logging:
    level: warn
configs:
  params:
    server.insecure: true
    # Server-side diff for every app: dry-run applies so CRD defaults (HTTPRoutes etc.) don't show as drift.
    controller.diff.server.side: "true"
  cm:
    oidc.config: |
      name: 'Authelia'
      issuer: 'https://login.laboratory.casa'
      clientID: 'By4sXGwiayM7NNeMvTuYMPFOJatVapIBtK8rdnFF1FTexB6oh0Xv_jUCkeEw9L8s~EP3bT7s'
      clientSecret: $oidcClientSecret
      enableUserInfoGroups: true
      userInfoPath: /api/oidc/userinfo
      userInfoCacheExpiration: "5m"
      requestedScopes:
          - 'email'
          - 'groups'
          - 'openid'
          - 'profile'
    statusbadge.enabled: true
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
    helm.valuesFileSchemes: secrets+gpg-import, secrets+gpg-import-kubernetes, secrets+age-import, secrets+age-import-kubernetes, secrets, secrets+literal, https
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
    resource.compareoptions: |
      ignoreAggregatedRoles: true
      ignoreResourceStatusField: crd
    # Local service account for the argocd-mcp server (token auth only, no UI login)
    accounts.mcp: apiKey
  rbac:
    create: true
    policy.default: role:none
    scopes: "[groups, email]"
    policy.csv: |
      p, role:none, *, *, */*, deny
      g, apps_readonly, role:readonly
      g, apps_admin, role:admin
      g, zac, role:readonly
      g, mcp, role:admin
controller:
  replicas: 1
  metrics:
    enabled: true
    applicationLabels:
      enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
# Login is OIDC straight to Authelia (configs.cm oidc.config), so Dex has
# nothing to do.
dex:
  enabled: false
redis:
  exporter:
    enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
server:
  replicas: 1
  allowAnyNamespace: true
  httproute:
    enabled: true
    # LAN/tailnet only. GitHub webhooks come in on the separate public
    # argo-webhook.laboratory.casa route (./webhook-httproute.yaml).
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    hostnames:
      - argo.laboratory.casa
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
notifications:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: victoria-metrics-stack
repoServer:
  replicas: 1
  serviceAccount:
    create: true
    name: argocd-repo-server
  rbac:
    - apiGroups:
        - ""
      resources:
        - secrets
      verbs:
        - get
  env:
    - name: HELM_PLUGINS
      value: /custom-tools/helm-plugins/
    - name: HELM_SECRETS_CURL_PATH
      value: /custom-tools/curl
    - name: HELM_SECRETS_SOPS_PATH
      value: /custom-tools/sops
    - name: HELM_SECRETS_VALS_PATH
      value: /custom-tools/vals
    - name: HELM_SECRETS_KUBECTL_PATH
      value: /custom-tools/kubectl
    - name: HELM_SECRETS_BACKEND
      value: sops
    # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
    - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
      value: "false"
    - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
      value: "true"
    - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
      value: "false"
    - name: HELM_SECRETS_WRAPPER_ENABLED
      value: "true"
    - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
      value: "true"
    - name: HELM_SECRETS_HELM_PATH
      value: /usr/local/bin/helm
    # For age
    - name: SOPS_AGE_KEY_FILE
      value: /helm-secrets-private-keys/key.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    # kubectl create secret generic helm-secrets-private-keys --from-file=key.asc=assets/gpg/private2.gpg
    - name: helm-secrets-private-keys
      secret:
        secretName: helm-secrets-private-keys
  volumeMounts:
    - mountPath: /custom-tools
      name: custom-tools
    - mountPath: /usr/local/sbin/helm
      subPath: helm
      name: custom-tools
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /helm-secrets-private-keys/
      name: helm-secrets-private-keys
  initContainers:
    - name: gitops-tools
      # changelog: GH release bodies are empty stubs - diff the Dockerfile between tags (gh api "repos/ajaykumar4/gitops-tools/contents/Dockerfile?ref=<tag>"); an identical Dockerfile means a pure monthly rebuild, since every tool AND the alpine base are pinned there. Since 2026.9.2 the image ships helm-secrets as three Helm-4-native plugins (secrets, secrets-getter, secrets-post-renderer) under helm-plugins/ - the old helm-secrets/ dir and our sed hack are gone. Always check HELM_SECRETS_VERSION + the plugin dir layout; the /gitops-tools/helm wrapper must come from secrets/scripts/wrapper/helm.sh (2026.9.1 shipped the wrong one)
      image: ajaykumar4/gitops-tools:2026.10.0@sha256:9a31812b0922f45aff1dcdda6695162b95b1271dbcfbf23d88d3b8039a0ea730
      imagePullPolicy: Always
      command:
        - sh
        - -ec
      args:
        - |
          mkdir -p /custom-tools/
          cp -rf /gitops-tools/* /custom-tools
          chmod +x /custom-tools/*
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
