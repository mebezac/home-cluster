---
defaultPodOptions:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    seccompProfile: { type: RuntimeDefault }

controllers:
  network-optimizer:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/ozark-connect/network-optimizer
          # changelog: GH releases Ozark-Connect/NetworkOptimizer (Renovate truncates the body - read each minor directly). Both images ship in lockstep from one compose file; bump network-optimizer and speedtest together
          tag: 2.11.2@sha256:6e1e166e270317e07db53bc1873b10c160c522cd762f03df08db9ee640de5273
        env:
          TZ: America/New_York
          BIND_LOCALHOST_ONLY: "false"
          APP_PASSWORD: ""
          DEMO_MODE_MAPPINGS: ""
          HOST_NAME: network-optimizer.laboratory.casa
          REVERSE_PROXIED_HOST_NAME: network-optimizer.laboratory.casa
          # The speed test is served directly over plain HTTP/1.1 on its own LB IP
          # (service speedtest below), not through Envoy. Over Envoy the browser
          # used HTTP/2, and coalesced onto the wildcard-cert connection of the
          # other laboratory.casa names, which inflates the result. With HTTPS off
          # the app links clients to http://<OPENSPEEDTEST_HOST>:<OPENSPEEDTEST_PORT>
          # and allows that origin (CORS) for the result post. A new hostname:
          # browsers keep the old speedtest.laboratory.casa HSTS for a year.
          OPENSPEEDTEST_PORT: "3005"
          OPENSPEEDTEST_HOST: speedtest-http.laboratory.casa
          OPENSPEEDTEST_HTTPS: "false"
          # The app ignores X-Forwarded-For unless the proxy is listed, and then
          # records Envoy as the client. Envoy pods connect from the pod CIDR; the
          # node IPs cover the case where Cilium SNATs pod -> hostNetwork traffic.
          TRUSTED_PROXIES: 10.69.0.0/16,10.25.30.33,10.25.30.34,10.25.30.35,10.25.30.42,10.25.30.43,10.25.30.44,10.25.30.45,10.25.30.46
          Iperf3Server__Enabled: "false"
          Logging__LogLevel__Default: Information
          Logging__LogLevel__NetworkOptimizer: Information
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 411Mi, max 427Mi.
          requests:
            cpu: 10m
            memory: 448Mi
          limits:
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              # tcpSocket, not httpGet: the app 302-redirects all HTTP to HTTPS
              # (Kestrel UseHttpsRedirection), which floods events with harmless
              # "Probe terminated redirects" warnings. A TCP check gives the same
              # real signal (Kestrel accepting connections) without the noise.
              tcpSocket:
                port: 8042
              initialDelaySeconds: 40
              periodSeconds: 30
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              # tcpSocket, not httpGet: the app 302-redirects all HTTP to HTTPS
              # (Kestrel UseHttpsRedirection), which floods events with harmless
              # "Probe terminated redirects" warnings. A TCP check gives the same
              # real signal (Kestrel accepting connections) without the noise.
              tcpSocket:
                port: 8042
              initialDelaySeconds: 40
              periodSeconds: 30
              timeoutSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              # tcpSocket, not httpGet: the app 302-redirects all HTTP to HTTPS
              # (Kestrel UseHttpsRedirection), which floods events with harmless
              # "Probe terminated redirects" warnings. A TCP check gives the same
              # real signal (Kestrel accepting connections) without the noise.
              tcpSocket:
                port: 8042
              initialDelaySeconds: 40
              periodSeconds: 10
              failureThreshold: 30

  speedtest:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/ozark-connect/speedtest
          # changelog: see the network-optimizer image above - both images ship in lockstep from one
          # upstream compose file and MUST be bumped together; never merge a speedtest PR alone.
          tag: 2.11.2@sha256:1a260d637b5368e27f9f5e816407972b8a62d3ded913c5ae451399aaeb219074
        env:
          TZ: America/New_York
          HOST_NAME: network-optimizer.laboratory.casa
          # Keep these three in step with the network-optimizer container above.
          OPENSPEEDTEST_PORT: "3005"
          OPENSPEEDTEST_HOST: speedtest-http.laboratory.casa
          OPENSPEEDTEST_HTTPS: "false"
          TRUSTED_PROXIES: 10.69.0.0/16,10.25.30.33,10.25.30.34,10.25.30.35,10.25.30.42,10.25.30.43,10.25.30.44,10.25.30.45,10.25.30.46
          # The browser posts results to https://<this>/api/... (through Envoy).
          REVERSE_PROXIED_HOST_NAME: network-optimizer.laboratory.casa
        resources:
          # Idle ~10Mi (7d metrics 2026-09-08: peak 12Mi, CPU peak 1m). A test run
          # is much more: /upload buffers each request body in memory
          # (client_body_buffer_size 35m) and the browser sends several at once.
          # 96Mi was OOM-killed mid-test on 2026-11-06 (workers at 10-45 MB each).
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 512Mi

service:
  network-optimizer:
    controller: network-optimizer
    ports:
      http:
        port: 8042
  speedtest:
    annotations:
      # k8s-gateway answers speedtest-http.laboratory.casa with this LB IP.
      coredns.io/hostname: speedtest-http.laboratory.casa
      lbipam.cilium.io/ips: 10.25.30.59
    controller: speedtest
    type: LoadBalancer
    ports:
      http:
        # nginx in the speedtest image listens on 3000 (hostNetwork).
        port: 3005
        targetPort: 3000

route:
  network-optimizer:
    hostnames:
      - network-optimizer.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: network-optimizer
            port: http

persistence:
  data:
    suffix: data
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 5Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore network-optimizer-data, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: network-optimizer-data
    advancedMounts:
      network-optimizer:
        app:
          - path: /app/data
            subPath: data
  ssh-keys:
    suffix: ssh-keys
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 100Mi
    # A new PVC fills from the latest Kopiur snapshot (Restore network-optimizer-ssh-keys, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: network-optimizer-ssh-keys
    advancedMounts:
      network-optimizer:
        app:
          - path: /app/ssh-keys
            subPath: ssh-keys
  logs:
    suffix: logs
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      network-optimizer:
        app:
          - path: /app/logs
            subPath: logs
