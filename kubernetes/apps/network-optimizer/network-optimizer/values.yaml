---
defaultPodOptions:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    seccompProfile: { type: RuntimeDefault }

controllers:
  network-optimizer:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/ozark-connect/network-optimizer
          # changelog: GH releases Ozark-Connect/NetworkOptimizer (Renovate truncates the body - read each minor directly). Both images ship in lockstep from one compose file; bump network-optimizer and speedtest together
          tag: 2.8.2@sha256:1d2b56f64750cad87b619726b1d0a6d3e14cd467417388ca80e4669eb2c78831
        env:
          TZ: America/New_York
          BIND_LOCALHOST_ONLY: "false"
          APP_PASSWORD: ""
          DEMO_MODE_MAPPINGS: ""
          HOST_NAME: network-optimizer.laboratory.casa
          REVERSE_PROXIED_HOST_NAME: network-optimizer.laboratory.casa
          OPENSPEEDTEST_PORT: "3005"
          OPENSPEEDTEST_HOST: network-optimizer.laboratory.casa
          OPENSPEEDTEST_HTTPS: "false"
          OPENSPEEDTEST_HTTPS_PORT: "443"
          Iperf3Server__Enabled: "false"
          Logging__LogLevel__Default: Information
          Logging__LogLevel__NetworkOptimizer: Information
        resources:
          # 7d metrics (2026-09-08): peak 494Mi, p95 478Mi - request was
          # roughly half of real usage.
          requests:
            cpu: 10m
            memory: 640Mi
          limits:
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              # tcpSocket, not httpGet: the app 302-redirects all HTTP to HTTPS
              # (Kestrel UseHttpsRedirection), which floods events with harmless
              # "Probe terminated redirects" warnings. A TCP check gives the same
              # real signal (Kestrel accepting connections) without the noise.
              tcpSocket:
                port: 8042
              initialDelaySeconds: 40
              periodSeconds: 30
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              # tcpSocket, not httpGet: the app 302-redirects all HTTP to HTTPS
              # (Kestrel UseHttpsRedirection), which floods events with harmless
              # "Probe terminated redirects" warnings. A TCP check gives the same
              # real signal (Kestrel accepting connections) without the noise.
              tcpSocket:
                port: 8042
              initialDelaySeconds: 40
              periodSeconds: 30
              timeoutSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              # tcpSocket, not httpGet: the app 302-redirects all HTTP to HTTPS
              # (Kestrel UseHttpsRedirection), which floods events with harmless
              # "Probe terminated redirects" warnings. A TCP check gives the same
              # real signal (Kestrel accepting connections) without the noise.
              tcpSocket:
                port: 8042
              initialDelaySeconds: 40
              periodSeconds: 10
              failureThreshold: 30

  speedtest:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/ozark-connect/speedtest
          # changelog: see the network-optimizer image above - both images ship in lockstep from one
          # upstream compose file and MUST be bumped together; never merge a speedtest PR alone.
          tag: 2.8.2@sha256:2350be63d93b3747b3373ee6be3ed46eec064d447697d0920be8cad558db0747
        env:
          TZ: America/New_York
          HOST_NAME: network-optimizer.laboratory.casa
          OPENSPEEDTEST_PORT: "3005"
          OPENSPEEDTEST_HOST: network-optimizer.laboratory.casa
          OPENSPEEDTEST_HTTPS: "false"
          OPENSPEEDTEST_HTTPS_PORT: "443"
          REVERSE_PROXIED_HOST_NAME: network-optimizer.laboratory.casa
        resources:
          # 7d metrics (2026-09-08): speedtest peak 12Mi, CPU peak 1m.
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 96Mi

service:
  network-optimizer:
    controller: network-optimizer
    ports:
      http:
        port: 8042
  speedtest:
    controller: speedtest
    ports:
      http:
        port: 3000

ingress:
  network-optimizer:
    enabled: true
    className: internal
    hosts:
      - host: network-optimizer.laboratory.casa
        paths:
          - path: /
            service:
              identifier: network-optimizer
              port: http
  speedtest:
    enabled: true
    className: internal
    hosts:
      - host: speedtest.laboratory.casa
        paths:
          - path: /
            service:
              identifier: speedtest
              port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      network-optimizer:
        app:
          - path: /app/data
            subPath: data
  ssh-keys:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 100Mi
    advancedMounts:
      network-optimizer:
        app:
          - path: /app/ssh-keys
            subPath: ssh-keys
  logs:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      network-optimizer:
        app:
          - path: /app/logs
            subPath: logs
