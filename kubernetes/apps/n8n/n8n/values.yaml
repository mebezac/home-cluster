# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.5.0/charts/other/app-template/values.schema.json

controllers:
  n8n:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom: &envFrom
          - secretRef:
              name: n8n-secret
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: ghcr.io/n8n-io/n8n
          # changelog: GH releases n8n-io/n8n tag "n8n@<version>" (PR body is a stub; upstream skips some patch numbers entirely - check git refs, not just the release list)
          tag: 2.38.3@sha256:4b76b9c5a69dc1c0f26bedd21b4e281ac2c84bd88d33857487b9e63dd0a42e87
        env:
          DB_TYPE: postgresdb
          DB_POSTGRESDB_SCHEMA: public
          EXECUTIONS_DATA_PRUNE: true
          EXECUTIONS_DATA_MAX_AGE: 7
          EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
          GENERIC_TIMEZONE: America/New_York
          N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
          N8N_PROTOCOL: https
          N8N_PORT: &port 8080
          N8N_HOST: n8n.laboratory.casa
          N8N_LOG_LEVEL: info
          N8N_LOG_OUTPUT: console
          N8N_BLOCK_ENV_ACCESS_IN_NODE: false
          N8N_GIT_NODE_DISABLE_BARE_REPOS: true
          N8N_WEBHOOK_URL: https://n8n.laboratory.casa
          N8N_PROXY_HOPS: 2
          # Pinned to the current defaults — upstream is lowering/flipping all four in a
          # future release (deprecation warnings as of 2.33.0). Set explicitly so the
          # change is a decision, not a silent inherit.
          N8N_UNVERIFIED_PACKAGES_ENABLED: true
          N8N_RUNNERS_TASK_TIMEOUT: 300
          N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 2147483648
          N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 5000
        envFrom: *envFrom
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 128Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: n8n
    ports:
      http:
        port: *port

ingress:
  app:
    className: external
    annotations:
      external-dns.alpha.kubernetes.io/target: external.laboratory.casa
    hosts:
      - host: n8n.laboratory.casa
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /home/node/.n8n
