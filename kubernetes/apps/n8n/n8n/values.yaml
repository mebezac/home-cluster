# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.5.0/charts/other/app-template/values.schema.json

controllers:
  n8n:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          # Docker Hub, not ghcr: only Docker Hub gives Renovate publish dates, which the
          # 10-day minimumReleaseAge in .github/renovate.json5 needs (same digests on both).
          repository: n8nio/n8n
          # changelog: GH releases n8n-io/n8n tag "n8n@<version>" (PR body is a stub; upstream skips some patch numbers - check git refs). Check the target is NOT a GH Pre-release: the age gate can land on an aged beta patch (e.g. x.y.1) while the stable x.y.N is still too young - hand-bump to the newest non-pre-release patch of that minor
          tag: 2.44.3@sha256:5032941f437e1daa421cad0cc3ea57cd054f0d44a7256b38a0a3fca1b460834a
        env:
          DB_TYPE: postgresdb
          DB_POSTGRESDB_SCHEMA: public
          EXECUTIONS_DATA_PRUNE: true
          EXECUTIONS_DATA_MAX_AGE: 7
          EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
          GENERIC_TIMEZONE: America/New_York
          N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
          N8N_PROTOCOL: https
          N8N_PORT: &port 8080
          N8N_HOST: n8n.laboratory.casa
          N8N_LOG_LEVEL: info
          N8N_LOG_OUTPUT: console
          # Expressions and Code nodes cannot read process.env ($env), which holds the
          # encryption key and DB password (deep-dive 2026-10-23 WEB-2). No workflow used
          # $env when this was set. A run that needs it fails with "access to env vars
          # denied"; use an n8n credential or Variable for that value instead.
          N8N_BLOCK_ENV_ACCESS_IN_NODE: true
          # Telemetry to telemetry.n8n.io and the version check are on by default.
          N8N_DIAGNOSTICS_ENABLED: false
          N8N_VERSION_NOTIFICATIONS_ENABLED: false
          N8N_GIT_NODE_DISABLE_BARE_REPOS: true
          N8N_WEBHOOK_URL: https://n8n.laboratory.casa
          N8N_PROXY_HOPS: 2
          # Opt in early to the v3 rename ~/.n8n/binaryData -> ~/.n8n/storage (one-shot, no-op once done;
          # both paths sit inside the /home/node/.n8n PVC so no mount change is needed).
          N8N_MIGRATE_FS_STORAGE_PATH: true
          # Pinned to the current defaults — upstream is lowering/flipping all four in a
          # future release (deprecation warnings as of 2.33.0). Set explicitly so the
          # change is a decision, not a silent inherit.
          N8N_UNVERIFIED_PACKAGES_ENABLED: true
          N8N_RUNNERS_TASK_TIMEOUT: 300
          N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 2147483648
          N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 5000
          # Community nodes from git (audit 2026-10-22): n8n installs, updates and
          # REMOVES packages to match this list on start. The Formbricks node was
          # installed in the UI; "Formbricks to Dropbox" uses it.
          N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV: true
          N8N_COMMUNITY_PACKAGES: '[{"name":"@formbricks/n8n-nodes-formbricks","version":"1.0.2"}]'
          # Prometheus /metrics on the app port (blocked publicly, see metrics-block.yaml)
          N8N_METRICS: true
          N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: true
          N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL: true
          N8N_METRICS_INCLUDE_WORKFLOW_STATISTICS: true
        envFrom:
          - secretRef:
              name: n8n-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 359Mi, max 363Mi.
          requests:
            cpu: 5m
            memory: 400Mi
          limits:
            memory: 1536Mi

service:
  app:
    controller: n8n
    ports:
      http:
        port: *port

route:
  app:
    hostnames:
      - n8n.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      # Gateway API paths are case-sensitive but n8n's Express router is not, so
      # /METRICS got past a plain PathPrefix match (deep-dive 2026-10-23 NET-1).
      - matches:
          - path:
              type: PathPrefix
              value: /metrics
          - path:
              type: RegularExpression
              value: "(?i)/metrics(/.*)?"
        filters:
          - type: ExtensionRef
            extensionRef:
              group: gateway.envoyproxy.io
              kind: HTTPRouteFilter
              name: block-metrics
        backendRefs:
          - identifier: app
            port: http
      - backendRefs:
          - identifier: app
            port: http

serviceMonitor:
  app:
    serviceName: n8n
    endpoints:
      - port: http
        path: /metrics

persistence:
  data:
    forceRename: n8n
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /home/node/.n8n
