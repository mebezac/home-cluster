defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  formbricks:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          pullPolicy: IfNotPresent
        envFrom: &envFrom
          - secretRef:
              name: formbricks-secret
    containers:
      app:
        image:
          repository: ghcr.io/formbricks/formbricks
          tag: 5.4.3@sha256:df012326bc900a6872d1a7c46f2a0a8d195744bd6466df6891419dc8e7477b7b
        env:
          EMAIL_VERIFICATION_DISABLED: "1"
          DANGEROUSLY_ALLOW_WEBHOOK_INTERNAL_URLS: "1"
        envFrom: *envFrom
        resources:
          # 7d metrics (2026-09-08): CPU peak 2m against a 500m request - the
          # single largest CPU over-request in the cluster. Memory peak 300Mi,
          # which was slightly OVER the old 256M request, so memory goes up
          # while CPU comes down.
          requests:
            cpu: 25m
            memory: 384Mi
          limits:
            cpu: 2000m
            memory: 768Mi
service:
  app:
    controller: formbricks
    ports:
      http:
        port: 3000
ingress:
  app:
    className: external
    annotations:
      external-dns.kubernetes.io/target: external.heremag.free
    hosts:
      - host: forms.heremag.free
        paths:
          - path: /
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - forms.heremag.free
        secretName: heremag-free-production-tls
