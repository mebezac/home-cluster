defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  formbricks:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
          pullPolicy: IfNotPresent
        envFrom: &envFrom
          - secretRef:
              name: formbricks-secret
    containers:
      app:
        image:
          repository: ghcr.io/formbricks/formbricks
          # changelog: github releases at formbricks/formbricks (not in PR body); majors also need docs/self-hosting/advanced/migration.mdx in that repo
          tag: 6.1.1@sha256:c2f8ccfdf47a3d96c49fa4ae4d71d645c6eab0ce684aafb04519e3354a1d8811
        env:
          EMAIL_VERIFICATION_DISABLED: "1"
          DANGEROUSLY_ALLOW_WEBHOOK_INTERNAL_URLS: "1"
          TELEMETRY_DISABLED: "1"
        envFrom: *envFrom
        resources:
          # 7d metrics (2026-09-08): CPU peak 2m against a 500m request - the
          # single largest CPU over-request in the cluster. Memory peak 300Mi,
          # which was slightly OVER the old 256M request, so memory goes up
          # while CPU comes down.
          requests:
            cpu: 25m
            memory: 384Mi
          limits:
            cpu: 2000m
            memory: 768Mi
service:
  app:
    controller: formbricks
    ports:
      http:
        port: 3000
route:
  app:
    hostnames:
      - forms.heremag.free
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
