defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  formbricks:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/formbricks/formbricks
          # changelog: github releases at formbricks/formbricks (not in PR body); majors also need docs/self-hosting/advanced/migration.mdx in that repo
          tag: 4.9.7@sha256:eb19ee1fe2bbd559fdd463b3bd72a2c2f664402510b446779192f7ffd10ada5d
        env:
          EMAIL_VERIFICATION_DISABLED: "1"
          DANGEROUSLY_ALLOW_WEBHOOK_INTERNAL_URLS: "1"
          TELEMETRY_DISABLED: "1"
        envFrom:
          - secretRef:
              name: formbricks-secret
        resources:
          # 7d metrics (2026-09-08): CPU peak 2m against a 500m request - the
          # single largest CPU over-request in the cluster. Memory peak 300Mi,
          # which was slightly OVER the old 256M request, so memory goes up
          # while CPU comes down.
          requests:
            cpu: 25m
            memory: 384Mi
          limits:
            cpu: 2000m
            memory: 768Mi
service:
  app:
    controller: formbricks
    ports:
      http:
        port: 3000
route:
  app:
    hostnames:
      - forms.heremag.free
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
