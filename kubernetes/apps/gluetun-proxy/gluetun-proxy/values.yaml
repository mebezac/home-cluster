defaultPodOptions:
  automountServiceAccountToken: false
  dnsConfig:
    options:
      - name: ndots
        value: "1"

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      gluetun:
        image:
          repository: ghcr.io/qdm12/gluetun
          tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        env:
          VPN_SERVICE_PROVIDER: windscribe
          VPN_TYPE: openvpn
          FIREWALL: "on"
          FIREWALL_INPUT_PORTS: "8000,8888"
          HTTPPROXY: "on"
          HTTPPROXY_LISTENING_ADDRESS: ":8888"
          HTTPPROXY_STEALTH: "on"
          SERVER_REGIONS: US East, US Central, US West
        envFrom:
          - secretRef:
              name: gluetun-proxy-secret
        securityContext:
          capabilities:
            add:
              - NET_ADMIN

  ip-rotator:
    type: cronjob
    cronjob:
      schedule: "15 * * * *"
      successfulJobsHistory: 1
      failedJobsHistory: 1
    containers:
      rotate:
        image:
          repository: curlimages/curl
          tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Rotating IP..."
            curl -s -X PUT http://gluetun-proxy-main:8000/v1/vpn/status -H "Content-Type: application/json" -d '{"status":"stopped"}'
            sleep 5
            curl -s -X PUT http://gluetun-proxy-main:8000/v1/vpn/status -H "Content-Type: application/json" -d '{"status":"running"}'
            echo "IP rotation complete"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi

service:
  gluetun:
    controller: main
    ports:
      http:
        port: 8888

persistence:
  config:
    type: emptyDir
