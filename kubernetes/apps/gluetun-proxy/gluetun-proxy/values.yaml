defaultPodOptions:
  automountServiceAccountToken: false
  dnsConfig:
    options:
      - name: ndots
        value: "1"

controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      gluetun:
        image:
          repository: ghcr.io/qdm12/gluetun
          tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        env:
          VPN_SERVICE_PROVIDER: windscribe
          VPN_TYPE: openvpn
          FIREWALL: "on"
          FIREWALL_INPUT_PORTS: "8000,8888"
          HTTPPROXY: "on"
          HTTPPROXY_LISTENING_ADDRESS: ":8888"
          HTTPPROXY_STEALTH: "on"
          SERVER_REGIONS: US East, US Central, US West
          # Refresh the Windscribe server list daily. With UPDATER_PERIOD=0
          # gluetun used only the list built into the image (1 Oct), and many
          # of those servers are gone: each dead pick cost a 60s TLS timeout
          # (EHOSTUNREACH), so a rotation took a median 231s and the proxy was
          # down ~2h/day (audit 2026-10-21).
          UPDATER_PERIOD: 24h
          UPDATER_VPN_SERVICE_PROVIDERS: windscribe
        envFrom:
          - secretRef:
              name: gluetun-proxy-secret
        securityContext:
          capabilities:
            add:
              - NET_ADMIN

  ip-rotator:
    type: cronjob
    cronjob:
      schedule: "15 * * * *"
      successfulJobsHistory: 1
      failedJobsHistory: 1
    containers:
      rotate:
        image:
          repository: curlimages/curl
          # changelog: curl.se/ch/<version>.html; CVE list at curl.se/docs/vuln.json. We use curl
          # ONLY for the plain-HTTP PUT to the gluetun control API below - no TLS, cookies, auth,
          # LDAP or HTTP/2 - so TLS/auth CVEs and TLS feature removals (e.g. TLS-SRP dropped in
          # 8.22.0) do not reach us; just confirm -s/-X/-H/-d behaviour is unchanged. Blast radius
          # of a failure: the hourly VPN exit-IP rotation misses a cycle and self-heals next run.
          tag: 8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
        command: ["/bin/sh", "-c"]
        args:
          # -f/set -e: a failed call must fail the Job. Until 2026-10-02 this
          # targeted a non-existent "gluetun-proxy-main" Service and -s hid it.
          # After the restart, wait for traffic to flow through the proxy and
          # print the new exit IP. Fail the Job if the tunnel is not back within
          # 10 minutes, so a broken rotation shows up as a failed Job.
          - |
            set -e
            svc=gluetun-proxy.gluetun-proxy.svc.cluster.local
            api=http://$svc:8000/v1/vpn/status
            px="-x http://$svc:8888 --proxy-user $HTTPPROXY_USER:$HTTPPROXY_PASSWORD"
            old=$(curl -fsS -m 10 $px https://ipinfo.io/ip || echo unknown)
            echo "Rotating IP (was $old)..."
            curl -fsS -X PUT "$api" -H "Content-Type: application/json" -d '{"status":"stopped"}'
            sleep 5
            curl -fsS -X PUT "$api" -H "Content-Type: application/json" -d '{"status":"running"}'
            i=0
            while [ $i -lt 60 ]; do
              sleep 10; i=$((i+1))
              if new=$(curl -fsS -m 8 $px https://ipinfo.io/ip 2>/dev/null); then
                echo "IP rotation complete after $((i*10))s: $old -> $new"
                exit 0
              fi
            done
            echo "Tunnel not back after 10 minutes" >&2
            exit 1
        env:
          HTTPPROXY_USER:
            valueFrom:
              secretKeyRef:
                name: gluetun-proxy-secret
                key: HTTPPROXY_USER
          HTTPPROXY_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: gluetun-proxy-secret
                key: HTTPPROXY_PASSWORD
        securityContext:
          runAsUser: 3000
          runAsGroup: 3000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi

service:
  gluetun:
    controller: main
    ports:
      http:
        port: 8888
      # gluetun control server, used by the ip-rotator CronJob
      control:
        port: 8000

persistence:
  config:
    type: emptyDir
  # The updated servers.json lives here, so a container restart keeps it.
  gluetun-data:
    type: emptyDir
    advancedMounts:
      main:
        gluetun:
          - path: /gluetun
