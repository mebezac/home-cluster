defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  valkey:
    type: statefulset
    containers:
      app:
        command: ["valkey-server", "/config/valkey.conf"]
        image:
          repository: valkey/valkey
          # changelog: VERSION bumps carry full notes in the PR body (valkey-io/valkey GH releases) - read the "Upgrade urgency" line first, and skip the RDMA items, this build has no RDMA listener. DIGEST-only bumps of the same tag are Alpine apk + binary rebuilds with no notes at all: run .claude/skills/dependency-pr-triage/scripts/image-digest-diff.sh instead of hunting for any. Either way the restart briefly drops authelia sessions (SSO re-login) plus grafana/romm/forgejo
          tag: 9.1.2-alpine@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 640Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

service:
  app:
    controller: valkey
    ports:
      valkey:
        port: 6379

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    advancedMounts:
      valkey:
        app:
          - path: /data
  config:
    type: secret
    name: valkey-secret
    advancedMounts:
      valkey:
        app:
          - path: /config/valkey.conf
            subPath: valkey.conf
            readOnly: true
