defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  valkey:
    type: statefulset
    containers:
      app:
        command: ["valkey-server", "/config/valkey.conf"]
        image:
          repository: valkey/valkey
          # changelog: digest-only bumps of the same tag are Alpine apk + binary rebuilds - diff the two image configs (crane config) rather than hunting for release notes; there are none
          tag: 9.1.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 640Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

service:
  app:
    controller: valkey
    ports:
      valkey:
        port: 6379

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    advancedMounts:
      valkey:
        app:
          - path: /data
  config:
    type: secret
    name: valkey-secret
    advancedMounts:
      valkey:
        app:
          - path: /config/valkey.conf
            subPath: valkey.conf
            readOnly: true
