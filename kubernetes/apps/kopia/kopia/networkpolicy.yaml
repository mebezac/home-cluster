---
# Only the envoy-internal proxy pods may reach kopia. Kubelet probes are host
# traffic, which Cilium allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kopia
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kopia
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 51515
