---
csi:
  # Chart default (true) grants the CSI controller sidecars cluster-wide get on
  # Secrets. None of our StorageClasses or PVs carry provisioner/controller Secret
  # parameters and no volume is encrypted, so the grant is unused.
  allowControllerSecretAccess: false
# NOTE: manager/instanceManager were pinned to v1.11.0-hotfix-1 on 2026-02-15 for
# longhorn/longhorn#12573 (runaway instance-manager memory on v1.11.0, stopgap images
# built in #12576). That root bug is milestoned v1.12.0 and closed 2026-02-02, so the
# fix is in every 1.12.x release and the pin is obsolete. Removed 2026-08-24; let the
# chart set all component tags so they cannot drift apart again.
# No backup target since 2026-11-16: Kopiur backs the PVCs up (Kopiur plan
# step B2). Keep both keys, empty: longhorn-manager keeps the old URL when a key
# is missing from longhorn-default-resource, and clears it only when the key is
# there and empty (datastore/longhorn.go syncDefaultBackupTargetResource..., v1.13.0).
defaultBackupStore:
  backupTarget: ""
  backupTargetCredentialSecret: ""
defaultSettings:
  allowCollectingLonghornUsageMetrics: false
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  # These five were UI edits; git owns them since 2026-10-22 (audit). One backup and
  # one restore at a time, each allowed 10 min (default 1): the CIFS target on the
  # NAS is slow. Replica timeout 15s (default 8) rides out talmac USB-disk stalls.
  backupConcurrentLimit: 1
  restoreConcurrentLimit: 1
  backupExecutionTimeout: 10
  engineReplicaTimeout: '{"v1":"15","v2":"15"}'
  logLevel: Warn
  # Live-upgrade volume engines to the new default engine image after a chart bump,
  # one volume per node at a time. 0 (the default) leaves every volume on the old
  # engine until someone upgrades it by hand in the UI.
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  createDefaultDiskLabeledNodes: true
  # Was set under csi: (not a chart key, so it rendered nothing); the live 15 came
  # from a UI edit. Here git owns it.
  storageMinimalAvailablePercentage: 15
  # Empty since the first commit = do-nothing: an RWO pod on a dead node stayed
  # Terminating forever and its volume never moved. Force-delete the pod so the
  # controller reschedules it and Longhorn reattaches the volume elsewhere.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # Empty = orphaned replica dirs (from deleted volumes or replaced replicas) stay on disk
  # forever; 5 had piled up on the talmac USB disks (audit 2026-10-21 #35). Longhorn
  # deletes orphan data and leftover instance processes after the grace period
  # (default 300s). It never touches orphans on failed or unknown nodes.
  orphanResourceAutoDeletion: replica-data;instance
  # Freeze only the volume's own filesystem before a snapshot. Off (the default), the
  # engine runs a node-wide sync() instead, which waits on every dirty page on the
  # node. On 2026-11-08 a 6 GB radarr-tz copy to the slow tz-media SMB share held
  # that sync on talmac-02 for 15 min, and the kopiur homeassistant-config backup
  # timed out. The default is off only for kernels <= 5.17; the nodes run 6.18.
  freezeFilesystemForSnapshot: '{"v1":"true"}'
metrics:
  serviceMonitor:
    # The VM operator converts this to a VMServiceScrape for vmagent.
    enabled: true
networkPolicies:
  # restrictInternalTraffic (chart default true) enforces a longhorn-manager
  # NetworkPolicy that drops vmagent's scrape of TCP/9500 unless it is listed here.
  # 9500 also serves the manager REST API, so keep this to the vmagent pods only.
  metricsScrapeSources:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmagent
httproute:
  enabled: true
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - longhorn.laboratory.casa
# Chart-default images, pinned with a digest; they move with the chart version
# (Renovate group). engine and instanceManager stay unpinned on purpose: a new
# string there makes Longhorn create a new EngineImage / instance managers and
# upgrade every volume engine. A new string here only restarts pods (the manager
# DaemonSet all at once, as on any chart bump; running share managers keep theirs).
image:
  longhorn:
    manager:
      repository: longhornio/longhorn-manager
      tag: "v1.13.0@sha256:7372f3c59239e9a67c0017b3af32fabdf08c4dcc0631140161da9a47e3b142f0"
    ui:
      repository: longhornio/longhorn-ui
      tag: "v1.13.0@sha256:f22fb0254ae50195c1635ce428dfae26375956b3d7bd39640fae8fe33a236023"
    shareManager:
      repository: longhornio/longhorn-share-manager
      tag: "v1.13.0@sha256:53950f78b7af38b8a943c298cd3020622191a4661a13036f69d83c154cc8690d"
    backingImageManager:
      repository: longhornio/backing-image-manager
      tag: "v1.13.0@sha256:49779b9a8ab535f1e86d224f8e2eb5c2c3713b8f1783403fe00612a75de2b3b8"
    supportBundleKit:
      repository: longhornio/support-bundle-kit
      tag: "v0.0.98@sha256:e64a01db35396f967175adcfd0177d2a50e75765c51efe86e55f13f49095d1ae"
  csi:
    attacher:
      repository: longhornio/csi-attacher
      tag: "v4.13.0@sha256:fef34c2d823b78da7d6c29fdf0f80d236293b0ac06944d14e8c366add880a4c8"
    provisioner:
      repository: longhornio/csi-provisioner
      tag: "v6.3.0@sha256:2d2694540109d2e8887f62a0bc711aca8d3033e52dddf1c39bb5c65600d9c5af"
    resizer:
      repository: longhornio/csi-resizer
      tag: "v2.2.1@sha256:63d0aef25114d4a682b25afa6d9623a3cfcc19aca910269124408476bbe2c6fd"
    snapshotter:
      repository: longhornio/csi-snapshotter
      tag: "v8.6.0@sha256:2bca9ac55170efa61dc50e5cc8d9550373db2e3e5161d82d3fdaac5c25150360"
    nodeDriverRegistrar:
      repository: longhornio/csi-node-driver-registrar
      tag: "v2.18.0@sha256:085f63e62fea391734f5668d9cbb20ac8788a8e7faea83ce2c994f0cc1834fce"
    livenessProbe:
      repository: longhornio/livenessprobe
      tag: "v2.20.0@sha256:d1199b77452bfc11cfc62feb8a266758fe8d72953e97faac8065941e3767f1a3"
persistence:
  defaultClassReplicaCount: 2
  defaultDataLocality: best-effort
  volumeBindingMode: WaitForFirstConsumer
preUpgradeChecker:
  # Re-enabled 2026-09-08. upgradeVersionCheck was turned off on 2026-02-15
  # only because manager/instanceManager were pinned to the non-standard
  # v1.11.0-hotfix-1 tag, which the version check rejects. That pin was removed
  # 2026-08-24 (see the note at the top of this file), so the exception is
  # obsolete.
  #
  # Why this matters here: Renovate bumps this chart and Argo has
  # automated.selfHeal, so without a gate a breaking Longhorn release could
  # apply itself unattended to the cluster's only block storage.
  #
  # BOTH flags are required - upgradeVersionCheck gates whether the
  # longhorn-pre-upgrade Job renders at all, so jobEnabled alone does nothing.
  # It also adds --upgrade-version-check to longhorn-manager for runtime
  # version-skew enforcement.
  #
  # The Job carries helm.sh/hook: pre-upgrade, which Argo maps to PreSync. The
  # chart's post-upgrade hook already runs here today, so the hook path is
  # known-good. A failing check now blocks the sync instead of silently
  # upgrading.
  jobEnabled: true
  upgradeVersionCheck: true
service:
  ui:
    type: ClusterIP
