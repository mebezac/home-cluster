---
csi:
  # Chart default (true) grants the CSI controller sidecars cluster-wide get on
  # Secrets. None of our StorageClasses or PVs carry provisioner/controller Secret
  # parameters and no volume is encrypted, so the grant is unused.
  allowControllerSecretAccess: false
# NOTE: manager/instanceManager were pinned to v1.11.0-hotfix-1 on 2026-02-15 for
# longhorn/longhorn#12573 (runaway instance-manager memory on v1.11.0, stopgap images
# built in #12576). That root bug is milestoned v1.12.0 and closed 2026-02-02, so the
# fix is in every 1.12.x release and the pin is obsolete. Removed 2026-08-24; let the
# chart set all component tags so they cannot drift apart again.
defaultBackupStore:
  backupTarget: "cifs://10.25.30.36/longhorn-backup"
  backupTargetCredentialSecret: backup-secret
defaultSettings:
  allowCollectingLonghornUsageMetrics: false
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  # Live-upgrade volume engines to the new default engine image after a chart bump,
  # one volume per node at a time. 0 (the default) leaves every volume on the old
  # engine until someone upgrades it by hand in the UI.
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  createDefaultDiskLabeledNodes: true
  # Was set under csi: (not a chart key, so it rendered nothing); the live 15 came
  # from a UI edit. Here git owns it.
  storageMinimalAvailablePercentage: 15
  # Empty since the first commit = do-nothing: an RWO pod on a dead node stayed
  # Terminating forever and its volume never moved. Force-delete the pod so the
  # controller reschedules it and Longhorn reattaches the volume elsewhere.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
metrics:
  serviceMonitor:
    # The VM operator converts this to a VMServiceScrape for vmagent.
    enabled: true
networkPolicies:
  # restrictInternalTraffic (chart default true) enforces a longhorn-manager
  # NetworkPolicy that drops vmagent's scrape of TCP/9500 unless it is listed here.
  # 9500 also serves the manager REST API, so keep this to the vmagent pods only.
  metricsScrapeSources:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmagent
httproute:
  enabled: true
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - longhorn.laboratory.casa
persistence:
  defaultClassReplicaCount: 2
  defaultDataLocality: best-effort
  volumeBindingMode: WaitForFirstConsumer
preUpgradeChecker:
  # Re-enabled 2026-09-08. upgradeVersionCheck was turned off on 2026-02-15
  # only because manager/instanceManager were pinned to the non-standard
  # v1.11.0-hotfix-1 tag, which the version check rejects. That pin was removed
  # 2026-08-24 (see the note at the top of this file), so the exception is
  # obsolete.
  #
  # Why this matters here: Renovate bumps this chart and Argo has
  # automated.selfHeal, so without a gate a breaking Longhorn release could
  # apply itself unattended to the cluster's only block storage.
  #
  # BOTH flags are required - upgradeVersionCheck gates whether the
  # longhorn-pre-upgrade Job renders at all, so jobEnabled alone does nothing.
  # It also adds --upgrade-version-check to longhorn-manager for runtime
  # version-skew enforcement.
  #
  # The Job carries helm.sh/hook: pre-upgrade, which Argo maps to PreSync. The
  # chart's post-upgrade hook already runs here today, so the hook path is
  # known-good. A failing check now blocks the sync instead of silently
  # upgrading.
  jobEnabled: true
  upgradeVersionCheck: true
service:
  ui:
    type: ClusterIP
