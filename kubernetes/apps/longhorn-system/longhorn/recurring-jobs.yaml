---
# Applies to every volume in the `default` group (all volumes, via
# recurring-job-group.longhorn.io/default=enabled).
# Backups are Kopiur's job since 2026-11-16 (kubernetes/charts/kopiur-backup);
# the Longhorn daily-backup job is gone (plan P7). Keep snapshot-cleanup: it
# removes the Longhorn snapshots Kopiur marks for removal.
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim
spec:
  name: filesystem-trim
  task: filesystem-trim
  cron: "30 4 * * *"
  groups:
    - default
  retain: 0
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
spec:
  name: snapshot-cleanup
  task: snapshot-cleanup
  cron: "30 2 * * *"
  groups:
    - default
  retain: 0
  concurrency: 1
