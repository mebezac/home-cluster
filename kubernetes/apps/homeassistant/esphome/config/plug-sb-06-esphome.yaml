esphome:
  name: plug-sb-06-esphome
  friendly_name: plug-sb-06-esphome
  platformio_options:
    board_build.mcu: esp32c3
    board_build.variant: esp32c3  

esp32:
  variant: ESP32C3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"    

## DO NOT ADD MQTT and API Encryption in this plug - one user reported bootlooping issues in this combination

logger:
api:
  # fixes boot loop issues in esphome 12.5+
  on_client_connected:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_client_disconnected:
    - esp32_ble_tracker.stop_scan:

web_server:
  port: 80

safe_mode:

button:
  - platform: safe_mode
    name: (Safe Mode)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    # Set this to the IP of the ESP
    static_ip: 10.25.30.136
    # Set this to the IP address of the router. Often ends with .1
    gateway: 10.25.30.1
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: 255.255.255.0

## DO NOT ADD MQTT

#  Disable the bluetooth tracker/proxy if they are not needed
esp32_ble_tracker:
  scan_parameters:
# Adjust timing if the defaults do not work in your environment
#    interval: 1100ms
#    window: 1100ms
    active: true
    continuous: false # fixes boot loop issues in esphome 12.5+

bluetooth_proxy:
  active: true

sensor:
  - platform: hlw8012
    sel_pin:
      number: GPIO20
      inverted: true
    cf_pin: GPIO18
    cf1_pin: GPIO19
    model: BL0937
    current_resistor: 0.0011
    voltage_divider: 1450
    current:
      name: Amps
    voltage:
      name: Volts
    power:
      name: Watts
      accuracy_decimals: 0       
    energy:
      name: Energy
    update_interval: 3s
    change_mode_every: 4

switch:
  - platform: gpio
    name: Relay
    id: relay
    device_class: outlet
    pin: GPIO6
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - light.turn_on: white_led
    on_turn_off:
      then:
        - light.turn_off: white_led  

binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    name: Button
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        - switch.toggle: relay 

light:
  - platform: binary
    internal: true
    name: White LED
    id: white_led
    output: white_output
    restore_mode: RESTORE_DEFAULT_OFF

output:
  - id: white_output
    platform: gpio
    pin: GPIO7
    inverted: true

status_led:
  pin:
    number: GPIO8
    inverted: true