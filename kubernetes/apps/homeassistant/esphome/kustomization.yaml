apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
generators:
  - secret-generator.yaml
configMapGenerator:
  # Device configs, edited here (not in the dashboard): mounted read-only.
  - name: esphome-devices
    files:
      - config/plug-sb-01-esphome.yaml
      - config/plug-sb-06-esphome.yaml
      - config/plug-sb-07-esphome.yaml
generatorOptions:
  disableNameSuffixHash: true
