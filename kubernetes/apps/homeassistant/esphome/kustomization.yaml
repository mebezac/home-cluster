apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
generators:
  - secret-generator.yaml
# Device configs are edited here (not in the dashboard) and mounted read-only.
# No devices right now (the plug-sb plugs were retired 2026-11-06). To add one,
# put it in config/<name>.yaml and restore this block and the `devices` mount in
# values.yaml:
#   configMapGenerator:
#     - name: esphome-devices
#       files:
#         - config/<name>.yaml
#   generatorOptions:
#     disableNameSuffixHash: true
