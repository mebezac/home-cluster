---
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # home-operations build: rootless (USER nobody), catatonit + entrypoint.sh that
          # runs esphome-device-builder. Source:
          # https://github.com/home-operations/containers/tree/main/apps/esphome
          repository: ghcr.io/home-operations/esphome
          # changelog: esphome.io/changelog/<major.minor>.0.html ONLY - a patch page 404s, patch notes live in the GH release. Since 2026.10 that page only lists PRs; breaking changes + upgrade checklist are in the linked blog post esphome.io/blog/YYYY/MM/DD/esphome-YYYY-MM/. A bump changes the DASHBOARD only - devices keep old firmware until reflashed
          tag: 2026.11.0@sha256:3395b0c336cd579ac601b59c66dd385609d1efac2bf3258056e43fb9f7956988
        env:
          - name: TZ
            value: "America/New_York"
          # The image defaults these to /cache/*. Keep the build cache and device
          # storage where the official image had them, on the PVC under .esphome/
          # (the Kopiur source ignores platformio/ and build/).
          - name: PLATFORMIO_CORE_DIR
            value: /config/.esphome/platformio
          - name: ESPHOME_BUILD_PATH
            value: /config/.esphome/build
          - name: ESPHOME_DATA_DIR
            value: /config/.esphome
          # Dashboard auth (also gates the /api/mcp endpoint added in 2026.10). The
          # Device Builder reads ESPHOME_*; bare USERNAME/PASSWORD is the deprecated
          # legacy pair. With a password set, HA's mcp integration cannot connect.
          - name: ESPHOME_USERNAME
            value: "esp"
          - name: ESPHOME_PASSWORD
            valueFrom:
              secretKeyRef:
                name: esphome-secret
                key: password
          - name: ESPHOME_DASHBOARD_USE_PING
            value: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 4Gi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.55
      tailscale.com/expose: "true"
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 6052
        targetPort: 6052

route:
  main:
    hostnames:
      - esphome.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 10Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore esphome-config, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: esphome-config
    globalMounts:
      - path: /config
  # Device YAMLs and their secrets.yaml come from git (audit 2026-10-22); before
  # that they lived only on the PVC. Read-only, so the dashboard can't save an
  # edit that a restart would lose: change config/*.yaml and push. Build cache
  # (.esphome/) and dashboard state stay on the PVC. No devices right now; to add
  # one, see kustomization.yaml and add a `devices` configMap mount here:
  #   devices:
  #     type: configMap
  #     name: esphome-devices
  #     globalMounts:
  #       - path: /config/<name>.yaml
  #         subPath: <name>.yaml
  #         readOnly: true
  # The root filesystem is read-only; esphome and platformio write temp files here.
  tmp:
    type: emptyDir
    advancedMounts:
      main:
        app:
          - path: /tmp
  secrets:
    type: secret
    name: esphome-secret
    globalMounts:
      - path: /config/secrets.yaml
        subPath: secrets.yaml
        readOnly: true
