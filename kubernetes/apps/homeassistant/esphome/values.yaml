---
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/esphome/esphome
          # changelog: esphome.io/changelog/<major.minor>.0.html ONLY - a patch page 404s, patch notes live in the GH release. A bump changes the DASHBOARD only - devices keep old firmware until reflashed
          tag: 2026.9.1@sha256:776a845d508909bf426d2ee7bdd81796361ebe6a7f091807ce1d6d0b48985413
        env:
          - name: TZ
            value: "America/New_York"
          - name: ESPHOME_DASHBOARD_USE_PING
            value: "true"
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 4Gi

service:
  main:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.55
      tailscale.com/expose: "true"
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 6052
        targetPort: 6052

route:
  main:
    hostnames:
      - esphome.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 10Gi
    globalMounts:
      - path: /config
