---
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/esphome/esphome
          # changelog: esphome.io/changelog/<major.minor>.0.html ONLY - a patch page 404s, patch notes live in the GH release. Since 2026.10 that page only lists PRs; breaking changes + upgrade checklist are in the linked blog post esphome.io/blog/YYYY/MM/DD/esphome-YYYY-MM/. A bump changes the DASHBOARD only - devices keep old firmware until reflashed
          tag: 2026.10.2@sha256:4a918585150e95e7675be84a347384ff308fde1bd32d0e4472666e1252cc0e8f
        env:
          - name: TZ
            value: "America/New_York"
          # Dashboard auth (also gates the /api/mcp endpoint added in 2026.10). The
          # Device Builder reads ESPHOME_*; bare USERNAME/PASSWORD is the deprecated
          # legacy pair. With a password set, HA's mcp integration cannot connect.
          - name: ESPHOME_USERNAME
            value: "esp"
          - name: ESPHOME_PASSWORD
            valueFrom:
              secretKeyRef:
                name: esphome-secret
                key: password
          - name: ESPHOME_DASHBOARD_USE_PING
            value: "true"
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 4Gi

service:
  main:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.55
      tailscale.com/expose: "true"
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 6052
        targetPort: 6052

route:
  main:
    hostnames:
      - esphome.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 10Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore esphome-config, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: esphome-config
    globalMounts:
      - path: /config
  # Device YAMLs and their secrets.yaml come from git (audit 2026-10-22); before
  # that they lived only on the PVC. Read-only, so the dashboard can't save an
  # edit that a restart would lose: change config/*.yaml and push. Build cache
  # (.esphome/) and dashboard state stay on the PVC. No devices right now; to add
  # one, see kustomization.yaml and add a `devices` configMap mount here:
  #   devices:
  #     type: configMap
  #     name: esphome-devices
  #     globalMounts:
  #       - path: /config/<name>.yaml
  #         subPath: <name>.yaml
  #         readOnly: true
  secrets:
    type: secret
    name: esphome-secret
    globalMounts:
      - path: /config/secrets.yaml
        subPath: secrets.yaml
        readOnly: true
