---
controllers:
  mosquitto:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-config:
        image:
          repository: public.ecr.aws/docker/library/eclipse-mosquitto
          tag: 2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
          pullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          [
            "cp /tmp/secret/* /mosquitto/external_config/ && chmod 0700 /mosquitto/external_config/mosquitto_pwd && mosquitto_passwd -U /mosquitto/external_config/mosquitto_pwd",
          ]
    containers:
      app:
        image:
          repository: public.ecr.aws/docker/library/eclipse-mosquitto
          tag: 2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
        resources:
          requests:
            cpu: 5m
          limits:
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    annotations:
      # k8s-gateway answers mqtt.laboratory.casa with this LB IP. (It used to
      # be an nginx Ingress, which pointed MQTT clients at an HTTP proxy.)
      coredns.io/hostname: mqtt.laboratory.casa
      lbipam.cilium.io/ips: 10.25.30.54
      tailscale.com/expose: "true"
    controller: mosquitto
    type: LoadBalancer
    ports:
      mqtt:
        port: 1883

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 100Mi
    globalMounts:
      - path: /mosquitto/data

  config-file:
    type: configMap
    name: mosquitto-configmap
    advancedMounts:
      mosquitto:
        app:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf

  secret-file:
    type: secret
    name: mosquitto-secret
    advancedMounts:
      mosquitto:
        init-config:
          - path: /tmp/secret

  external-config:
    type: emptyDir
    globalMounts:
      - path: /mosquitto/external_config
