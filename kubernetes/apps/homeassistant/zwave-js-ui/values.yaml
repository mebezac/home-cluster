---
controllers:
  main:
    type: statefulset
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: docker.io/zwavejs/zwave-js-ui
          # changelog: CHANGELOG.md in repo root; patch releases are usually just zwave-js / @zwave-js/server bumps - the server version is the protocol HA's zwave_js integration speaks on :3000
          tag: 11.25.2@sha256:ac4874a3cbea61c0c60002a8fd8ae05104cc8eb2eae91aa05bd184972aa06853
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &httpPort 8091
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: false
        # S0/S2/LR network keys (audit 2026-10-22). They were only in settings.json on
        # the PVC; zwave-js-ui reads KEY_* / KEY_LR_* env over the file, so git now
        # holds them and a lost PVC no longer means re-including every device.
        envFrom:
          - secretRef:
              name: zwave-js-ui-secret
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 50m
            memory: 128M
          limits:
            memory: 512M
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zwave.feature.node.kubernetes.io/zooz-zst39-lr
                    operator: In
                    values:
                      - "true"
      nodeSelector:
        zwave.feature.node.kubernetes.io/zooz-zst39-lr: "true"

service:
  main:
    controller: main
    ports:
      http:
        port: *httpPort
      websocket:
        port: 3000

route:
  main:
    # zwave-js-ui has its own login turned off (gateway.authEnabled false), so
    # Authelia guards the UI. HA reaches the ws server on :3000 via the Service.
    labels:
      auth: authelia
    hostnames:
      - zwave.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: 8091

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 1Gi
    globalMounts:
      - path: /usr/src/app/store
  usb:
    type: hostPath
    hostPath: /dev/ttyACM0
    hostPathType: CharDevice
    globalMounts:
      - path: /dev/ttyACM0
