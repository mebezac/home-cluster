---
controllers:
  main:
    type: statefulset
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: docker.io/zwavejs/zwave-js-ui
          # changelog: CHANGELOG.md in repo root; patch releases are usually just zwave-js / @zwave-js/server bumps. Check zwave-js/zwave-js-server src/lib/const.ts (tags have no "v"): min/maxSchemaVersion must still cover HA's zwave-js-server-python MIN/MAX_SERVER_SCHEMA_VERSION (the protocol on :3000)
          tag: 11.27.0@sha256:0f3ad23ccf5ff2256ad8cc060ab0fc987b8f52a8427eac337f93b058fa628f35
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &httpPort 8091
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: false
        # S0/S2/LR network keys (audit 2026-10-22). They were only in settings.json on
        # the PVC; zwave-js-ui reads KEY_* / KEY_LR_* env over the file, so git now
        # holds them and a lost PVC no longer means re-including every device.
        envFrom:
          - secretRef:
              name: zwave-js-ui-secret
        # The stick comes from generic-device-plugin (devic.es/zwave, a by-id
        # match), so the pod needs no privileged mode or hostPath.
        resources:
          requests:
            cpu: 50m
            memory: 128M
          limits:
            memory: 512M
            devic.es/zwave: 1
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zwave.feature.node.kubernetes.io/zooz-zst39-lr
                    operator: In
                    values:
                      - "true"
      nodeSelector:
        zwave.feature.node.kubernetes.io/zooz-zst39-lr: "true"

service:
  main:
    controller: main
    ports:
      http:
        port: *httpPort
      websocket:
        port: 3000

route:
  main:
    # zwave-js-ui has its own login turned off (gateway.authEnabled false), so
    # Authelia guards the UI. HA reaches the ws server on :3000 via the Service.
    labels:
      auth: authelia
    hostnames:
      - zwave.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: 8091

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 1Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore zwave-js-ui-config, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: zwave-js-ui-config
    globalMounts:
      - path: /usr/src/app/store
