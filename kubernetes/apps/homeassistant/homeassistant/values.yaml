---
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          # changelog: monthly release blog home-assistant.io/blog/YYYY/MM/DD/release-YYYYMM/ - the
          # day is unreliable, find the post via home-assistant.io/blog/categories/release-notes/.
          # The section is titled "Backward-incompatible changes" and lives ONLY there; machine-
          # readable full log at home-assistant.io/changelogs/core-<YYYY.M>/. The real risk is the
          # CROSS-APP contracts, which the blog does not cover: diff home-assistant/core tag-to-tag
          # for components/{zwave_js,esphome,mqtt}/manifest.json (zwave_js MIN/MAX_SERVER_SCHEMA_
          # VERSION must still cover our zwave-js-ui build) and recorder/db_schema.py SCHEMA_VERSION
          # for a one-way recorder migration on the SQLite DB on this PVC. Also unverifiable from
          # git: the auth_oidc HACS component lives on the PVC and patches HA auth internals - a
          # break locks you out of the login page, so confirm you can still log in after the roll.
          tag: 2026.10.3@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f
        env:
          - name: TZ
            value: "America/New_York"
        # Not privileged: HA mounts no device (Z-Wave/Zigbee run in their own
        # pods), and containerd's default caps still include NET_RAW for ping.
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 752Mi, max 767Mi.
          requests:
            cpu: 100m
            memory: 800Mi
          limits:
            memory: 2Gi

service:
  main:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.56
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 8123
        targetPort: 8123
      sonos:
        port: 1400
        targetPort: 1400

serviceMonitor:
  main:
    serviceName: homeassistant
    endpoints:
      - port: http
        path: /api/prometheus
        interval: 1m
        bearerTokenSecret:
          name: homeassistant-metrics
          key: token

route:
  main:
    hostnames:
      - ha.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 5Gi
    globalMounts:
      - path: /config

  config-file:
    type: configMap
    name: homeassistant-config
    advancedMounts:
      main:
        app:
          - path: /config/configuration.yaml
            subPath: configuration.yaml

  secrets:
    type: secret
    name: homeassistant-secret
    advancedMounts:
      main:
        app:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
            readOnly: true
