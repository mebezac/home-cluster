---
controllers:
  main:
    annotations:
      reloader.stakater.com/auto: "true"
    # ONE-TIME (audit 2026-11-26 #103): the official image ran as root, so the PVC
    # holds root- and 1000-owned files. Remove this init container after the first
    # rollout as 3000.
    initContainers:
      chown:
        image:
          repository: ghcr.io/home-operations/home-assistant
          tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
        command:
          - chown
          - -R
          - "3000:3000"
          - /config
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - FOWNER
              - DAC_OVERRIDE
    containers:
      app:
        image:
          # home-operations build: rootless (USER nobody, no s6), catatonit + entrypoint.sh.
          # Requirements of custom integrations (HACS) install at start into /config/.venv,
          # which the entrypoint rebuilds when the image changes. Source:
          # https://github.com/home-operations/containers/tree/main/apps/home-assistant
          repository: ghcr.io/home-operations/home-assistant
          # changelog: monthly release blog home-assistant.io/blog/YYYY/MM/DD/release-YYYYMM/ - the
          # day is unreliable, find the post via home-assistant.io/blog/categories/release-notes/.
          # The section is titled "Backward-incompatible changes" and lives ONLY there; machine-
          # readable full log at home-assistant.io/changelogs/core-<YYYY.M>/. The real risk is the
          # CROSS-APP contracts, which the blog does not cover: diff home-assistant/core tag-to-tag
          # for components/{zwave_js,esphome,mqtt}/manifest.json (zwave_js pins zwave-js-server-python;
          # MIN/MAX_SERVER_SCHEMA_VERSION in that lib's zwave_js_server/const/__init__.py must still
          # be served by our zwave-js-ui build) and recorder/db_schema.py SCHEMA_VERSION
          # for a one-way recorder migration on the SQLite DB on this PVC. Also unverifiable from
          # git: the auth_oidc HACS component lives on the PVC and patches HA auth internals - a
          # break locks you out of the login page, so confirm you can still log in after the roll.
          tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
        env:
          - name: TZ
            value: "America/New_York"
        # No device and no capability: Z-Wave/Zigbee run in their own pods, and the
        # ping integration uses unprivileged ICMP (Talos net.ipv4.ping_group_range
        # is "0 2147483647"). HA writes only to /config and /tmp.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 752Mi, max 767Mi.
          requests:
            cpu: 100m
            memory: 800Mi
          limits:
            memory: 2Gi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    annotations:
      lbipam.cilium.io/ips: 10.25.30.56
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 8123
        targetPort: 8123
      sonos:
        port: 1400
        targetPort: 1400

serviceMonitor:
  main:
    serviceName: homeassistant
    endpoints:
      - port: http
        path: /api/prometheus
        interval: 1m
        bearerTokenSecret:
          name: homeassistant-metrics
          key: token

route:
  main:
    hostnames:
      - ha.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 5Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore homeassistant-config, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: homeassistant-config
    globalMounts:
      - path: /config

  config-file:
    type: configMap
    name: homeassistant-config
    advancedMounts:
      main:
        app:
          - path: /config/configuration.yaml
            subPath: configuration.yaml

  # The root filesystem is read-only; go2rtc and allowlist_external_dirs use /tmp.
  tmp:
    type: emptyDir
    advancedMounts:
      main:
        app:
          - path: /tmp

  secrets:
    type: secret
    name: homeassistant-secret
    advancedMounts:
      main:
        app:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
            readOnly: true
