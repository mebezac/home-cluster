defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }
  # Agents run as child processes of the server. Upstream gives them 90s to
  # finish and write their state before the pod is killed.
  terminationGracePeriodSeconds: 90
  # Chart default, stated here on purpose: no token at the standard path. The
  # observer token is projected explicitly below (persistence.k8s-observer).
  automountServiceAccountToken: false

# Dedicated ServiceAccount. The chart already created this one by default;
# declaring it pins the name that observer-rbac.yaml binds.
serviceAccount:
  paperclip: {}

controllers:
  paperclip:
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      identifier: paperclip
    containers:
      app:
        image:
          repository: ghcr.io/paperclipai/paperclip
          # changelog: GH releases paperclipai/paperclip (date-based versions)
          tag: 2026.1023.0@sha256:40f46940c4612ead131aebe6079cd4651f8cd1434af49f7c621887f4a452a62e
        env:
          TZ: America/New_York
          HOST: 0.0.0.0
          PORT: &port 3100
          # Own email+password login. No SSO exists, and Authelia in front
          # would block the agents' Bearer-token API calls.
          PAPERCLIP_DEPLOYMENT_MODE: authenticated
          PAPERCLIP_DEPLOYMENT_EXPOSURE: private
          PAPERCLIP_PUBLIC_URL: https://paperclip.laboratory.casa
          # The private hostname guard rejects any other Host header. The
          # webhook hostname is the envoy-external route below.
          PAPERCLIP_ALLOWED_HOSTNAMES: paperclip-webhooks.laboratory.casa
          PAPERCLIP_CHAT_WEBHOOK_PUBLIC_URL: https://paperclip-webhooks.laboratory.casa
          # Envoy pods sit on pod IPs (10.x). Trust them for X-Forwarded-For.
          TRUST_PROXY: uniquelocal
          PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
          # The central CNPG cluster has daily backups; skip the hourly pg_dump.
          PAPERCLIP_DB_BACKUP_ENABLED: "false"
          PAPERCLIP_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          # The DB URL lives in config.json (persistence.config), not in env.
          # Agents inherit the server env minus PAPERCLIP_* keys, so an
          # unprefixed DATABASE_URL or BETTER_AUTH_SECRET would reach every
          # agent. The auth secret is PAPERCLIP_AGENT_JWT_SECRET for the same
          # reason (better-auth falls back to it). This removes them from the
          # agent env only: agents still run as the server uid and can read
          # /proc and this file. Upstream: paperclipai/paperclip#16643.
          PAPERCLIP_CONFIG: /etc/paperclip/config.json
        envFrom:
          - secretRef:
              name: paperclip-secret
        probes:
          # /api/health is 503 while Postgres is down. Liveness checks only the
          # socket, so a database failover does not restart the pod and kill
          # running agents. Probes send Host: localhost because the hostname
          # guard rejects the pod IP.
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: &health
                path: /api/health
                port: *port
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: *port
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          # The agent CLIs (claude, codex, opencode) run inside this container.
          # Upstream's ECS example gives the task 2 vCPU and 4 GB. Size from
          # metrics once the org is busy.
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 8Gi

service:
  app:
    controller: paperclip
    ports:
      http:
        port: *port

route:
  app:
    hostnames:
      - paperclip.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
  # Internet callers (Telegram, Slack, GitHub, routine triggers) reach only the
  # webhook paths. Everything else on this hostname gets a 404.
  webhooks:
    hostnames:
      - paperclip-webhooks.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /api/chat-webhooks/
          - path:
              type: PathPrefix
              value: /api/voice-webhooks/
          - path:
              type: PathPrefix
              value: /api/routine-triggers/public/
        backendRefs:
          - identifier: app
            port: http

persistence:
  # PAPERCLIP_HOME and HOME: agent workspaces, uploads, logs, CLI logins.
  data:
    type: persistentVolumeClaim
    suffix: data
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /paperclip
  # Instance config with the DB connection string. Every path in it is
  # absolute: the schema defaults are ~/.paperclip/..., which would resolve
  # to /paperclip/.paperclip/... here. If connectionString is missing, the
  # server silently starts an empty embedded Postgres instead.
  config:
    type: secret
    name: paperclip-config
    defaultMode: 0440
    advancedMounts:
      paperclip:
        app:
          - path: /etc/paperclip
            readOnly: true
  # Read-only Kubernetes observer identity (LAB-1, ClusterRole
  # paperclip-observer). The kubelet rotates the token before it expires;
  # clients must reread the file for each request. Every process in the app
  # container can read it: this is one shared identity, not per agent.
  k8s-observer:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 0440
        sources:
          - serviceAccountToken:
              # The API server's only accepted audience (--api-audiences).
              audience: https://10.25.30.116:6443
              expirationSeconds: 3600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
    advancedMounts:
      paperclip:
        app:
          - path: /var/run/secrets/paperclip-observer
            readOnly: true
