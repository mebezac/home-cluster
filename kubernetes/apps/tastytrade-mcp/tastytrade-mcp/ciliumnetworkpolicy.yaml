---
# Default-deny for tastytrade-mcp, both directions, except:
#  - ingress: MCP over HTTP from the Paperclip server pod only
#  - egress: cluster DNS, and HTTPS to the tastytrade production API
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tastytrade-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tastytrade-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: paperclip
            app.kubernetes.io/name: paperclip
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.tastyworks.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
