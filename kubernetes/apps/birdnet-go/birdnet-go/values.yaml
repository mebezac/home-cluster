defaultPodOptions:
  affinity:
    # Prefer the talmacs (12 cores, 32 GB each); still schedules elsewhere when they are full or down.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [talmac-01, talmac-02, talmac-03]
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  birdnet-go:
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      # BirdNET-Go has env overrides only for a few fixed keys (no stream list,
      # OIDC, trusted proxies or clip format) and writes UI-managed settings back
      # to /config/config.yaml, so patch only the git-managed keys before
      # startup: the stream list (audit 2026-11-26 #6) and settings.yaml, plus
      # the OIDC secrets from birdnet-go-oidc-secret.
      sync-git-config:
        image:
          repository: ghcr.io/mikefarah/yq
          tag: 4.54.3@sha256:7834187596ad56fd5a81436114e0b0b9dd54c91bb43946d1f7145b2be5f9c3d2
        env:
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: birdnet-go-oidc-secret
                key: OIDC_CLIENT_SECRET
          OIDC_ALLOWED_USERS:
            valueFrom:
              secretKeyRef:
                name: birdnet-go-oidc-secret
                key: OIDC_ALLOWED_USERS
        command: ["/bin/sh", "-ec"]
        args:
          - |
            : "${OIDC_CLIENT_SECRET:?}" "${OIDC_ALLOWED_USERS:?}"
            if [ -f /config/config.yaml ]; then
              yq --indent 4 '
                . *= (load("/etc/birdnet-go/settings.yaml") | ... comments = "") |
                .security.oauthProviders[0].clientSecret = strenv(OIDC_CLIENT_SECRET) |
                .security.oauthProviders[0].userId = strenv(OIDC_ALLOWED_USERS) |
                .realtime.rtsp.streams = (load("/etc/birdnet-go/rtsp-streams.yaml") | ... comments = "")
              ' /config/config.yaml > /config/.config.yaml.tmp
              chmod 600 /config/.config.yaml.tmp
              mv /config/.config.yaml.tmp /config/config.yaml
            fi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
    containers:
      app:
        image:
          repository: ghcr.io/tphakala/birdnet-go
          # changelog: PR body usually has full notes; else GH releases tphakala/birdnet-go — release name "BirdNET-Go <tag>". Read "Before you upgrade" against the live /config/config.yaml
          # tags are date-based YYYYMMDD; regex versioning override lives in .github/renovate.json5
          tag: 20261122@sha256:b1d332e82ca18ad5395d107421f30745a0d66a7a0e3a9b7be6b9c19ce5e70f0a
        env:
          TZ: America/New_York
          BIRDNET_UID: "1000"
          BIRDNET_GID: "1000"
        resources:
          requests:
            # 542m on 20260823, ~890m on 20261014 (false-positive filter, Lenient)
            cpu: 900m
            # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 735Mi, max 766Mi.
            memory: 800Mi
          limits:
            memory: 2Gi

service:
  app:
    controller: birdnet-go
    ports:
      http:
        port: 8080
      # Settings > Integrations > Telemetry (realtime.telemetry in /config/config.yaml,
      # no env override): enabled, listen 0.0.0.0:8090
      metrics:
        port: 8090

serviceMonitor:
  app:
    serviceName: birdnet-go
    endpoints:
      - port: metrics
        path: /metrics

route:
  app:
    annotations:
      # Hobby app: on the gatus page, but no alert (GatusEndpointDown skips group hobby).
      gatus.home-operations.com/endpoint: |-
        group: hobby
    hostnames:
      - bird.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 1Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore birdnet-go-config, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: birdnet-go-config
    globalMounts:
      - path: /config
  # data and clips were made by hand with kubectl in 2026-07 (the v2 move) and
  # used as existingClaim. Now the chart owns them under their old names, with
  # the live spec copied exactly (storageClass and accessMode are immutable).
  # Prune=false,Delete=false: Argo never deletes them, even if this key goes away.
  data:
    # db, cache, logs, models — kept on Longhorn (SQLite needs durability + safe locking)
    forceRename: birdnet-go-data-v2
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 5Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore birdnet-go-data-v2, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: birdnet-go-data-v2
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    globalMounts:
      - path: /data
  clips:
    # audio recordings — bulk, non-critical data on TrueNAS NFS (no replication needed)
    forceRename: birdnet-go-clips
    type: persistentVolumeClaim
    storageClass: freenas-api-nfs
    accessMode: ReadWriteOnce
    size: 50Gi
    # No Kopiur backup (2026-11-28, see the Argo app), so the Restore this names is gone.
    # dataSourceRef is immutable, so it stays on the bound PVC; it does nothing there.
    # Remove it when the PVC is replaced: a NEW PVC with it waits for the Restore forever.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: birdnet-go-clips
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    globalMounts:
      - path: /data/clips
  rtsp-streams:
    type: configMap
    name: birdnet-go-rtsp-streams
    advancedMounts:
      birdnet-go:
        sync-git-config:
          - path: /etc/birdnet-go/rtsp-streams.yaml
            subPath: rtsp-streams.yaml
            readOnly: true
  settings:
    type: configMap
    name: birdnet-go-settings
    advancedMounts:
      birdnet-go:
        sync-git-config:
          - path: /etc/birdnet-go/settings.yaml
            subPath: settings.yaml
            readOnly: true
