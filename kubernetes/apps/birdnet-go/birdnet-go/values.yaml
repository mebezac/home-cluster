defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  birdnet-go:
    containers:
      app:
        image:
          repository: ghcr.io/tphakala/birdnet-go
          # changelog: GH releases tphakala/birdnet-go — release name "BirdNET-Go <tag>" (PR body is digest-only)
          # tags are date-based YYYYMMDD; regex versioning override lives in .github/renovate.json5
          tag: 20261010@sha256:d412e7cc07cd77e7a1ef9d91fbffad1428106277a745c5accd90904a7cfb8b73
        env:
          TZ: America/New_York
          BIRDNET_UID: "1000"
          BIRDNET_GID: "1000"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi

service:
  app:
    controller: birdnet-go
    ports:
      http:
        port: 8080
      # Settings > Integrations > Telemetry (realtime.telemetry in /config/config.yaml,
      # no env override): enabled, listen 0.0.0.0:8090
      metrics:
        port: 8090

serviceMonitor:
  app:
    serviceName: birdnet-go
    endpoints:
      - port: metrics
        path: /metrics

route:
  app:
    hostnames:
      - bird.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: config
    size: 1Gi
    globalMounts:
      - path: /config
  data:
    # db, cache, logs, models — kept on Longhorn (SQLite needs durability + safe locking)
    existingClaim: birdnet-go-data-v2
    globalMounts:
      - path: /data
  clips:
    # audio recordings — bulk, non-critical data on TrueNAS NFS (no replication needed)
    existingClaim: birdnet-go-clips
    globalMounts:
      - path: /data/clips
  hls:
    type: emptyDir
    medium: Memory
    sizeLimit: 64Mi
    globalMounts:
      - path: /config/hls
