---
# Lets Envoy Gateway SecurityPolicies (extAuth) in these namespaces call the
# Authelia Service. Without an entry the policy is rejected and its routes fail
# closed (500), so add a namespace here before giving any of its routes auth.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: authelia-ext-authz
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
    # home-cluster-private: kubernetes/apps/downloads/gateway/authelia.yaml
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: downloads
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kube-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: longhorn-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
    # home-cluster-private
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: ps5
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: changedetection
    # policy lives in kubernetes/apps/jellyfin/pinchflat/authelia.yaml (pinchflat only;
    # the jellyfin route has no label)
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: jellyfin
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: cobalt
    # policy lives in kubernetes/apps/kopiur-system/kopiur/authelia.yaml
    # (kopiur-ui and kopia-ui)
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kopiur-system
    # policy lives in kubernetes/apps/homeassistant/zwave-js-ui/authelia.yaml
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: homeassistant
    # policy lives in kubernetes/apps/kopia/kopia/authelia.yaml (kopia web UI)
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kopia
  to:
    - group: ""
      kind: Service
      name: authelia
