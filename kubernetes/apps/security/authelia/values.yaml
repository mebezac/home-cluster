controllers:
  authelia:
    replicas: 1
    strategy: RollingUpdate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          pullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: authelia-initdb-secret
    pod:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: authelia
    containers:
      app:
        image:
          repository: ghcr.io/authelia/authelia
          # changelog: GH releases authelia/authelia - PATCH VERSIONS LIE (4.39.20 -> 4.39.21 was 677
          # commits and a full MUI->tailwind login-portal rewrite). Two mandatory tag-to-tag checks:
          # (1) internal/configuration/schema/keys.go - an unexpected key fatals config load and
          #     crashloops Authelia = total SSO outage across every OIDC client and forward-auth
          #     ingress, INCLUDING the ArgoCD UI, so keep kubectl as the escape hatch;
          # (2) internal/storage/migrations/postgres for new V00xx - they auto-run on startup, are
          #     one-way, and a newer schema makes the OLD image refuse to boot, so reverting the tag
          #     alone will NOT roll back. Back up the authelia DB in central PG before any bump; to
          #     undo, run `authelia storage migrate down --target <N>` from a NEW-version pod first.
          tag: 4.39.22@sha256:936134132eaf01bfa2faf85055afbc1e0cc1cc5ca4547e9c06408fd0dd784646
        env:
          AUTHELIA_SERVER_ADDRESS: tcp://:80
          AUTHELIA_SERVER_DISABLE_HEALTHCHECK: "true"
          AUTHELIA_TELEMETRY_METRICS_ADDRESS: tcp://0.0.0.0:8080
          AUTHELIA_TELEMETRY_METRICS_ENABLED: "true"
          AUTHELIA_THEME: dark
          X_AUTHELIA_CONFIG: /config/configuration.yaml
          X_AUTHELIA_CONFIG_FILTERS: template
        envFrom:
          - secretRef:
              name: authelia-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 80
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 80
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
service:
  app:
    controller: authelia
    ports:
      http:
        port: 80
        primary: true
      metrics:
        port: 8080
serviceMonitor:
  app:
    serviceName: authelia
    endpoints:
      - port: metrics
ingress:
  app:
    className: external
    annotations:
      external-dns.alpha.kubernetes.io/target: external.laboratory.casa
      nginx.ingress.kubernetes.io/configuration-snippet: |
        add_header Cache-Control "no-store";
        add_header Pragma "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
    hosts:
      - host: "login.laboratory.casa"
        paths:
          - path: /
            service:
              identifier: app
              port: http
persistence:
  private-key:
    type: secret
    name: authelia-oidc-private-key
    globalMounts:
      - path: /config/secrets/oidc/jwks/authelia_oidc_private_key.pem
        subPath: authelia_oidc_private_key.pem
        readOnly: true
  config:
    type: configMap
    name: authelia-config
    globalMounts:
      - path: /config/configuration.yaml
        subPath: configuration.yaml
        readOnly: true
