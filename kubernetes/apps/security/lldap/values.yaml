controllers:
  lldap:
    replicas: 2
    strategy: RollingUpdate
    annotations:
      reloader.stakater.com/auto: "true"
    # No postgres-init: CNPG owns the lldap role and database (database/postgres-17-cluster).
    pod:
      # lldap ran as ROOT because it bound :80 and :389, both privileged.
      # Container ports moved to lldap's own defaults (17170/3890) so it can
      # run unprivileged; the Service still publishes 80/389 via targetPort,
      # so authelia's ldap://lldap.security.svc.cluster.local:389 is unchanged.
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lldap
    containers:
      lldap:
        image: &image
          repository: ghcr.io/lldap/lldap
          # changelog: GH releases lldap/lldap. Was pinned to the DATE tag
          # 2025-04-04, which is a dev build off main, not a release - and
          # Renovate cannot version-compare a bare date, so it silently never
          # offered an update and we sat 13 months behind. Stay on the vX.Y.Z
          # stream (`stable` == v0.6.3) so Renovate tracks it normally.
          # v0.6.2 made a MISSING JWT SECRET FATAL at startup - LLDAP_JWT_SECRET
          # is set in lldap-secret, verified before this bump.
          # v0.6.3 also carries the fix for GHSA-qcxq-75wr-5cm8 (crafted LDAP
          # query could crash the server).
          tag: v0.6.3@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        # The image entrypoint (tini -- /docker-entrypoint.sh) starts as ROOT:
        # it runs `find /app /data ! -user $UID -exec chown` and then gosu-drops
        # to $UID:$GID. Under runAsUser 3000 that chown fails with
        # "chown: /app: Operation not permitted" and the container exits 1
        # (this DID crash-loop on first attempt, 2026-09-08).
        # So we skip the entrypoint and do the only other thing it does that we
        # need - seed the config file - then exec the binary directly.
        # /data is an emptyDir, so the template is copied fresh on every start,
        # exactly as the entrypoint would have done. Verified running as
        # 3000:3000 with LDAP on 3890 and HTTP on 17170.
        command: ["/bin/sh", "-c"]
        args:
          - |
            [ -f /data/lldap_config.toml ] || cp /app/lldap_config.docker_template.toml /data/lldap_config.toml
            exec /app/lldap run --config-file /data/lldap_config.toml
        env:
          TZ: America/New_York
          LLDAP_HTTP_PORT: &port 17170
          LLDAP_HTTP_URL: https://lldap.laboratory.casa
          LLDAP_LDAP_PORT: &ldapPort 3890
          LLDAP_LDAP_BASE_DN: dc=laboratory,dc=casa
        envFrom:
          - secretRef:
              name: lldap-secret
        resources:
          requests:
            cpu: 5m
            memory: 36M
          limits:
            memory: 128M

  # Users and groups are declared in git, not edited in the UI.
  # lldap's own /app/bootstrap.sh reads the JSON configs and makes lldap
  # match them over the GraphQL API (upstream:
  # example_configs/bootstrap/bootstrap.md).
  #   users:  lldap-bootstrap-users.sops.yaml (encrypted: names and emails;
  #           this repo is public)
  #   groups: lldap-bootstrap-groups.sops.yaml (encrypted: a group can be
  #           named after a person)
  # Passwords are NOT in the config, so the script never touches them:
  # people still set/reset their own in the UI.
  # Do not add a user or group in the UI: with DO_CLEANUP=true the next run
  # deletes anything not declared here (never admin or the lldap_* groups).
  #
  # Runs as an Argo PostSync hook (applies a push right away) and as a
  # CronJob (reverts UI drift, which Argo cannot see).
  bootstrap:
    type: job
    annotations:
      argocd.argoproj.io/hook: PostSync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    job:
      backoffLimit: 2
    pod: &bootstrapPod
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 3000
        runAsGroup: 3000
        seccompProfile: { type: RuntimeDefault }
    containers:
      app: &bootstrapContainer
        image: *image
        command: ["/app/bootstrap.sh"]
        env:
          LLDAP_URL: http://lldap.security.svc.cluster.local
          LLDAP_ADMIN_USERNAME: admin
          LLDAP_ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: lldap-secret
                key: LLDAP_LDAP_USER_PASS
          USER_CONFIGS_DIR: /bootstrap/user-configs
          GROUP_CONFIGS_DIR: /bootstrap/group-configs
          # Delete users, groups and memberships that are not declared.
          # Turned on after a first run with "false" printed no warnings.
          DO_CLEANUP: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 16M
          limits:
            memory: 64M
  bootstrap-cron:
    type: cronjob
    cronjob:
      schedule: "*/30 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 2
      backoffLimit: 2
    pod: *bootstrapPod
    containers:
      app: *bootstrapContainer

service:
  app:
    controller: lldap
    ports:
      # Service ports stay 80/389 so no consumer changes:
      # authelia uses ldap://lldap.security.svc.cluster.local:389
      http:
        port: 80
        targetPort: *port
      ldap:
        port: 389
        targetPort: *ldapPort
route:
  app:
    hostnames:
      - lldap.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
persistence:
  data:
    type: emptyDir
    advancedMounts:
      lldap:
        lldap:
          - path: /data
  bootstrap-users:
    type: secret
    name: lldap-bootstrap-users
    advancedMounts:
      bootstrap:
        app:
          - path: /bootstrap/user-configs
            readOnly: true
      bootstrap-cron:
        app:
          - path: /bootstrap/user-configs
            readOnly: true
  bootstrap-groups:
    type: secret
    name: lldap-bootstrap-groups
    advancedMounts:
      bootstrap:
        app:
          - path: /bootstrap/group-configs
            readOnly: true
      bootstrap-cron:
        app:
          - path: /bootstrap/group-configs
            readOnly: true
  # Service-account passwords. A user entry's "password_file" points here,
  # and the script sets that password on every run. Source of truth is the
  # consumer's own secret, so a rotation is one edit: change the value in
  # authelia-secret; the next run (<= 30 min) sets it in lldap.
  bootstrap-passwords:
    type: secret
    name: authelia-secret
    items:
      - key: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
        path: authelia
    advancedMounts:
      bootstrap:
        app:
          - path: /bootstrap/passwords
            readOnly: true
      bootstrap-cron:
        app:
          - path: /bootstrap/passwords
            readOnly: true
  bootstrap-tmp:
    type: emptyDir
    advancedMounts:
      bootstrap:
        app:
          - path: /tmp
      bootstrap-cron:
        app:
          - path: /tmp
