# TREK — self-hosted collaborative travel planner (SQLite, self-contained)
# Upstream image (mauriceboe/trek); OIDC support is now merged upstream, so we
# no longer need the mebezac fork build.
# Image entrypoint starts as root and drops to the `node` user (UID 1000) via
# `gosu`, so we intentionally do NOT force a non-root securityContext here —
# doing so would break the entrypoint's privilege-drop and chown of the volumes.
controllers:
  trek:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: mauriceboe/trek
          # changelog: GH releases github.com/liketrek/TREK/releases (repo redirects from
          # mauriceboe/trek; Docker Hub image, never in PR body). Operator-relevant content is under
          # "Upgrading" OR "Read this first" + "Schema" OR (5.x) "Changed > Database / Sign-in and
          # keys / Defaults that changed" - the heading is not consistent, read all; also
          # wiki/Updating.md "Upgrading to X". SQLite on our PVC - migrations run at boot and are
          # one-way. 5.x writes /app/data/pre-migrate-*.db itself before migrating, but 4.3.x starts
          # on a migrated DB with no check, so a tag revert alone is unsafe. Snapshot trek-data
          # (1Gi, longhorn) on any minor/major
          tag: 5.0.1@sha256:6f590b97c09158e92e9bc7d914ea1af207077735f07f7b622b1f6fb690442bc3
        env:
          TZ: America/New_York
          NODE_ENV: production
          PORT: 3000
          APP_URL: https://trek.laboratory.casa
          TRUST_PROXY: "1"
          ALLOW_INTERNAL_NETWORK: "true"
          # OIDC SSO via Authelia. Issuer's standard discovery path is used
          # (<issuer>/.well-known/openid-configuration) so OIDC_DISCOVERY_URL is unset.
          # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET come from the trek-secret.
          OIDC_ISSUER: https://login.laboratory.casa
          OIDC_DISPLAY_NAME: Authelia
          # groups scope is requested so the admin-claim mapping below resolves
          OIDC_SCOPE: openid email profile groups
          OIDC_ADMIN_CLAIM: groups
          OIDC_ADMIN_VALUE: apps_admin
          # SSO only: replaces the UI-only "no password registration" toggle and turns
          # off password login (the one user is an OIDC admin). Audit 2026-10-22.
          OIDC_ONLY: "true"
          # Authelia puts the display name in `name` (TREK's default); only used at account creation.
          OIDC_USERNAME_CLAIM: preferred_username
        envFrom:
          - secretRef:
              name: trek-secret
        resources:
          requests:
            cpu: 25m
            # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 360Mi, max 360Mi.
            memory: 400Mi
          limits:
            memory: 768M
        # Same as upstream charts/trek defaults: startup gives a first boot / long migration 10 min;
        # liveness skips the DB so a DB stall does not restart the pod; readiness asks the DB.
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              periodSeconds: 10
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health/ready
                port: 3000
              periodSeconds: 10
service:
  app:
    controller: trek
    ports:
      http:
        port: 3000
route:
  app:
    hostnames:
      - trek.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    globalMounts:
      - path: /app/data
        subPath: data
      - path: /app/uploads
        subPath: uploads
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
