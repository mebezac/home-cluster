# TREK — self-hosted collaborative travel planner
# Upstream image (mauriceboe/trek); OIDC support is now merged upstream, so we
# no longer need the mebezac fork build.
# Database: central CNPG postgres-17-cluster (role + Database `trek`), via TREK_DB_URL in
# trek-secret (sslmode=disable: TREK treats require as verify, and CNPG's CA is private).
# Moved off SQLite 2026-11-27 with the image's db:move-to-postgres (one-off Job, every table
# verified by row count + checksum). The trek-data PVC still holds uploads, the key files
# (.encryption_key, .jwt_secret), plugin data dirs, logs and the pre-migrate-*.pgdump copies
# TREK writes before a migration, so it keeps its Kopiur backup. The old travel.db stays on
# it untouched as the rollback: drop TREK_DB_URL from trek-secret and TREK starts on it again
# (without anything written since the move).
# Image entrypoint starts as root, fixes ownership of /app/data and /app/uploads, and drops
# to the `node` user (UID 1000) via `setpriv`. Run as root on purpose: forcing a non-root
# securityContext skips that ownership fix (the entrypoint then just runs node as-is).
controllers:
  trek:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: mauriceboe/trek
          # changelog: PR body usually has the notes; else GH releases github.com/liketrek/TREK/releases
          # (repo redirects from mauriceboe/trek). The notes can omit schema changes (5.1.0 did):
          # diff the file list of server/src/db/migrations/ between tags (git trees API; the
          # compare API truncates at 300 files). Operator-relevant content is under
          # "Upgrading" OR "Read this first" + "Schema" OR (5.x) "Changed > Database / Sign-in and
          # keys / Defaults that changed" - the heading is not consistent, read all; also
          # wiki/Updating.md "Upgrading to X" (Postgres rollback: "Rolling back a Postgres
          # update"). Migrations run at boot on Postgres and are one-way; TREK writes
          # /app/data/pre-migrate-*.pgdump itself before migrating, so a tag revert alone is
          # unsafe. Keep one replica (in-memory state). barman covers the database; snapshot
          # trek-data (uploads, keys) on any minor/major
          tag: 5.2.1@sha256:7935eeb96db3202b5af896951fd96379d6eb4d3608ce93a1f2e8f850e10a2257
        env:
          TZ: America/New_York
          NODE_ENV: production
          PORT: 3000
          APP_URL: https://trek.laboratory.casa
          TRUST_PROXY: "1"
          ALLOW_INTERNAL_NETWORK: "true"
          # Opt out of TREK's hosted search/routing/place-details services (5.1.0+):
          # no install key registration or request reporting to the upstream project.
          TREK_SERVICES: "off"
          # OIDC SSO via Authelia. Issuer's standard discovery path is used
          # (<issuer>/.well-known/openid-configuration) so OIDC_DISCOVERY_URL is unset.
          # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET come from the trek-secret.
          OIDC_ISSUER: https://login.laboratory.casa
          OIDC_DISPLAY_NAME: Authelia
          # groups scope is requested so the admin-claim mapping below resolves
          OIDC_SCOPE: openid email profile groups
          OIDC_ADMIN_CLAIM: groups
          OIDC_ADMIN_VALUE: apps_admin
          # SSO only: replaces the UI-only "no password registration" toggle and turns
          # off password login (the one user is an OIDC admin). Audit 2026-10-22.
          OIDC_ONLY: "true"
          # Authelia puts the display name in `name` (TREK's default); only used at account creation.
          OIDC_USERNAME_CLAIM: preferred_username
        envFrom:
          - secretRef:
              name: trek-secret
        resources:
          requests:
            cpu: 25m
            # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 360Mi, max 360Mi.
            memory: 400Mi
          limits:
            memory: 768M
        # Same as upstream charts/trek defaults: startup gives a first boot / long migration 10 min;
        # liveness skips the DB so a DB stall does not restart the pod; readiness asks the DB.
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              periodSeconds: 10
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health/ready
                port: 3000
              periodSeconds: 10
service:
  app:
    controller: trek
    ports:
      http:
        port: 3000
route:
  app:
    hostnames:
      - trek.laboratory.casa
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 1Gi
    # A new PVC fills from the latest Kopiur snapshot (Restore trek-data, kopiur-backup
    # source in the Argo app), or comes up empty on a first install.
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: trek-data
    globalMounts:
      - path: /app/data
        subPath: data
      - path: /app/uploads
        subPath: uploads
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
