defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  jotty:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/fccview/jotty
          # changelog: GH releases fccview/jotty/releases (PR body has been complete so far, but verify on GH - security fixes are described vaguely with a 2wk disclosure delay). Data is flat JSON under /app/data; DATA_SCHEMA_VERSION in app/_consts/files.ts gates migrations - only a bump there needs a snapshot first
          tag: 1.26.1@sha256:20fce87deab74c3b1758126f288fb230a7982a024103b9d65bb8479cede2c405
        env:
          NODE_ENV: production
          PUID: 3000
          PGID: 3000
          APP_URL: https://jotty.laboratory.casa
          STOP_CHECK_UPDATES: yes
          TZ: America/New_York
        envFrom:
          - secretRef:
              name: jotty-secret
        resources:
          requests:
            cpu: 15m
            memory: 128M
          limits:
            memory: 512M

service:
  app:
    controller: jotty
    ports:
      http:
        port: 3000

ingress:
  app:
    className: external
    annotations:
      external-dns.alpha.kubernetes.io/target: external.laboratory.casa
    hosts:
      - host: jotty.laboratory.casa
        paths:
          - path: /
            service:
              identifier: app
              port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 512Mi
    globalMounts:
      - path: /app/data
        subPath: data
      - path: /app/config
        subPath: config
  cache:
    type: emptyDir
    globalMounts:
      - path: /app/.next/cache
