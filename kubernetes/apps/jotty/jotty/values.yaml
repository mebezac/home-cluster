defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  jotty:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/fccview/jotty
          # changelog: GH releases fccview/jotty/releases (PR body has been complete so far, but verify on GH - security fixes are described vaguely with a 2wk disclosure delay). Data is flat JSON under /app/data; DATA_SCHEMA_VERSION in app/_consts/files.ts gates migrations - only a bump there needs a snapshot first. 1.29.0: schema 2->3 (now ATTACHMENTS_SCHEMA_VERSION); if notes/*/{images,videos,files} hold files an admin must start the migration in the UI (dry run first). SERVE_PUBLIC_* retired
          tag: 1.29.2@sha256:5295d8a85aada46519ed6a1822d5989a373583f42017a346e8a62b44d75af71a
        env:
          NODE_ENV: production
          PUID: 3000
          PGID: 3000
          APP_URL: https://jotty.laboratory.casa
          STOP_CHECK_UPDATES: yes
          TZ: America/New_York
        envFrom:
          - secretRef:
              name: jotty-secret
        resources:
          requests:
            cpu: 15m
            memory: 128M
          limits:
            memory: 512M

service:
  app:
    controller: jotty
    ports:
      http:
        port: 3000

route:
  app:
    hostnames:
      - jotty.laboratory.casa
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http

persistence:
  data:
    forceRename: jotty
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 512Mi
    globalMounts:
      - path: /app/data
        subPath: data
      - path: /app/config
        subPath: config
  cache:
    type: emptyDir
    globalMounts:
      - path: /app/.next/cache
