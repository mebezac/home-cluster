defaultPodOptions:
  annotations:
    guildhall.laboratory.casa/native-home-size: 2Gi
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 3600
  imagePullSecrets:
    - name: guildhall-registry
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  guildhall:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      prepare-ssh:
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall
          tag: 3ce7265ec043c06754107118f1a5bb7012e23e35@sha256:9251c9049228dd366099f65411472a67aac2785afb4c7b33d8bbcc135ea62c26
        command: [sh, -c]
        args:
          - |
            set -eu
            umask 077
            cp /ssh-source/id_ed25519 /ssh-source/known_hosts /ssh-source/config /run/guildhall-ssh/
            chmod 600 /run/guildhall-ssh/id_ed25519 /run/guildhall-ssh/known_hosts /run/guildhall-ssh/config
            cat > /run/guildhall-ssh/ssh <<'SCRIPT'
            #!/bin/sh
            host_next=no
            for arg do
              if [ "$host_next" = yes ]; then
                [ "$arg" = guildhall-cachyos ] && exec /usr/bin/ssh -F /run/guildhall-ssh/config "$@"
                break
              fi
              [ "$arg" = -- ] && host_next=yes
            done
            exec /usr/bin/ssh "$@"
            SCRIPT
            chmod 700 /run/guildhall-ssh/ssh
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
    containers:
      control:
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall
          tag: 3ce7265ec043c06754107118f1a5bb7012e23e35@sha256:9251c9049228dd366099f65411472a67aac2785afb4c7b33d8bbcc135ea62c26
        env:
          TZ: America/New_York
          NODE_ENV: production
          PATH: /run/guildhall-ssh:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          HOST: 0.0.0.0
          PORT: "3000"
          VIEW_PORT: "3001"
          APP_ORIGIN: https://guildhall.laboratory.casa
          GUILDHALL_AGENT_URL: https://guildhall.laboratory.casa/mcp
          AUTH_MODE: oidc
          # Owner-authorized browser acceptance; tickets require local admin issuance.
          BROWSER_TEST_LOGIN_ENABLED: "true"
          OIDC_ISSUER: https://login.laboratory.casa
          OIDC_CLIENT_ID: guildhall
          OIDC_REDIRECT_URI: https://guildhall.laboratory.casa/api/auth/oidc/callback
          OIDC_REQUIRED_GROUPS: apps_admin
          VIEW_ORIGIN: https://guildhall-views.laboratory.casa
          GUILDHALL_DATA: /state/control
          GUILDHALL_LOCAL_RUNNER_URL: http://127.0.0.1:4712
          GUILDHALL_WORK_ROOT: /work
          GUILDHALL_LOCAL_NATIVE_POLICY: '{"mode":"trusted","network":"allowed"}'
        envFrom:
          - secretRef:
              name: guildhall-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: &health { path: /health, port: 3000 }
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 1Gi }
      runner:
        command: [sh, -c]
        args:
          - mkdir -p -m 700 "$CODEX_HOME" && exec node apps/runner/dist/http.js
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall-runner
          tag: 3ce7265ec043c06754107118f1a5bb7012e23e35@sha256:a9c80f9056adee6e952c6aa43ddbfc7688567aa53670462920f4b1a6bcbf8522
        env:
          TZ: America/New_York
          HOME: /state/auth
          CODEX_HOME: /state/auth/.codex
          GUILDHALL_RUNNER_DATA: /state/runner
          GUILDHALL_RUNNER_HOST: 127.0.0.1
          GUILDHALL_RUNNER_PORT: "4712"
        envFrom:
          - secretRef:
              name: guildhall-runner-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec: &runnerHealth
                command: [node, -e, "fetch('http://127.0.0.1:4712/v1/capabilities',{headers:{authorization:'Bearer '+process.env.GUILDHALL_RUNNER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              exec: *runnerHealth
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              exec: *runnerHealth
              periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 4Gi }

service:
  app:
    controller: guildhall
    ports:
      http: { port: 3000 }
      views: { port: 3001 }

route:
  app:
    hostnames: [guildhall.laboratory.casa]
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
  views:
    hostnames: [guildhall-views.laboratory.casa]
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: views

persistence:
  control:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    suffix: control
    advancedMounts:
      guildhall:
        control:
          - path: /state/control
  runner:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    suffix: runner
    advancedMounts:
      guildhall:
        runner:
          - path: /state/runner
  # Native homes also retain sessions, plugin caches and daemon packages.
  auth:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    suffix: auth
    advancedMounts:
      guildhall:
        runner:
          - path: /state/auth
  work:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    suffix: work
    advancedMounts:
      guildhall:
        runner:
          - path: /work
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  ssh-source:
    type: secret
    name: guildhall-host-ssh
    defaultMode: 288 # 0440; fsGroup lets the unprivileged init container read it.
    advancedMounts:
      guildhall:
        prepare-ssh:
          - path: /ssh-source
            readOnly: true
  ssh-runtime:
    type: emptyDir
    advancedMounts:
      guildhall:
        prepare-ssh:
          - path: /run/guildhall-ssh
        control:
          - path: /run/guildhall-ssh
            readOnly: true
