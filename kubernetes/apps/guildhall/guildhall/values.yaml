defaultPodOptions:
  annotations:
    guildhall.laboratory.casa/native-home-size: 2Gi
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 3600
  imagePullSecrets:
    - name: guildhall-registry
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  guildhall:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      prepare-ssh:
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall
          tag: 9f797d99ece82a204e5e55dffb59b043bf5e2a6c@sha256:97c16eac8b11e90ce7b873d01cbd14de00473a1c148b92d31e1ff94219a29c67
        command: [sh, -c]
        args:
          - |
            set -eu
            umask 077
            cp /ssh-source/id_ed25519 /ssh-source/known_hosts /ssh-source/config /run/guildhall-ssh/
            chmod 600 /run/guildhall-ssh/id_ed25519 /run/guildhall-ssh/known_hosts /run/guildhall-ssh/config
            cp /builder-source/builder-key /builder-source/builder-known-hosts /builder-source/builder-config /run/guildhall-ssh/
            mkdir -p /run/guildhall-ssh/docker
            chmod 700 /run/guildhall-ssh/docker
            cp /builder-source/builder-docker-config /run/guildhall-ssh/docker/config.json
            chmod 600 /run/guildhall-ssh/builder-key /run/guildhall-ssh/builder-known-hosts /run/guildhall-ssh/builder-config /run/guildhall-ssh/docker/config.json
            cat > /run/guildhall-ssh/kubeconfig <<'KUBE'
            apiVersion: v1
            kind: Config
            clusters:
              - name: in-cluster
                cluster:
                  server: https://kubernetes.default.svc
                  certificate-authority: /run/guildhall-kube/ca.crt
            users:
              - name: guildhall-control
                user:
                  tokenFile: /run/guildhall-kube/token
            contexts:
              - name: guildhall-workers
                context:
                  cluster: in-cluster
                  user: guildhall-control
                  namespace: guildhall-workers
            current-context: guildhall-workers
            KUBE
            chmod 600 /run/guildhall-ssh/kubeconfig
            cat > /run/guildhall-ssh/ssh <<'SCRIPT'
            #!/bin/sh
            host_next=no
            for arg do
              if [ "$host_next" = yes ]; then
                [ "$arg" = guildhall-cachyos ] && exec /usr/bin/ssh -F /run/guildhall-ssh/config "$@"
                [ "$arg" = guildhall-builder-gateway ] && exec /usr/bin/ssh -F /run/guildhall-ssh/builder-config "$@"
                break
              fi
              [ "$arg" = -- ] && host_next=yes
            done
            exec /usr/bin/ssh "$@"
            SCRIPT
            chmod 700 /run/guildhall-ssh/ssh
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
    containers:
      control:
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall
          tag: 9f797d99ece82a204e5e55dffb59b043bf5e2a6c@sha256:97c16eac8b11e90ce7b873d01cbd14de00473a1c148b92d31e1ff94219a29c67
        env:
          TZ: America/New_York
          NODE_ENV: production
          PATH: /run/guildhall-ssh:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          HOST: 0.0.0.0
          PORT: "3000"
          VIEW_PORT: "3001"
          APP_ORIGIN: https://guildhall.laboratory.casa
          GUILDHALL_AGENT_URL: https://guildhall.laboratory.casa/mcp
          AUTH_MODE: oidc
          # Owner-authorized browser acceptance; tickets require local admin issuance.
          BROWSER_TEST_LOGIN_ENABLED: "true"
          OIDC_ISSUER: https://login.laboratory.casa
          OIDC_CLIENT_ID: guildhall
          OIDC_REDIRECT_URI: https://guildhall.laboratory.casa/api/auth/oidc/callback
          OIDC_REQUIRED_GROUPS: apps_admin
          VIEW_ORIGIN: https://guildhall-views.laboratory.casa
          GUILDHALL_DATA: /state/control
          GUILDHALL_LOCAL_RUNNER_URL: http://127.0.0.1:4712
          GUILDHALL_WORK_ROOT: /work
          GUILDHALL_LOCAL_NATIVE_POLICY: '{"mode":"trusted","network":"allowed"}'
          KUBECONFIG: /run/guildhall-ssh/kubeconfig
          GUILDHALL_TOOLING_BUILDER_ENABLED: "true"
          DOCKER_HOST: ssh://guildhall-builder-gateway
          DOCKER_CONFIG: /run/guildhall-ssh/docker
          BUILDX_CONFIG: /tmp/guildhall-buildx
        envFrom:
          - secretRef:
              name: guildhall-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: &health { path: /health, port: 3000 }
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 1Gi }
      runner:
        command: [sh, -c]
        args:
          - mkdir -p -m 700 "$CODEX_HOME" && exec node apps/runner/dist/http.js
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall-runner
          tag: 9f797d99ece82a204e5e55dffb59b043bf5e2a6c@sha256:2e98adcccbaa8dbdcc8a5da4fef7846f3a381c1f6305a620341049a76a38c89a
        env:
          TZ: America/New_York
          HOME: /state/auth
          CODEX_HOME: /state/auth/.codex
          GUILDHALL_RUNNER_DATA: /state/runner
          GUILDHALL_RUNNER_HOST: 127.0.0.1
          GUILDHALL_RUNNER_PORT: "4712"
        envFrom:
          - secretRef:
              name: guildhall-runner-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec: &runnerHealth
                command: [node, -e, "fetch('http://127.0.0.1:4712/v1/capabilities',{headers:{authorization:'Bearer '+process.env.GUILDHALL_RUNNER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              exec: *runnerHealth
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              exec: *runnerHealth
              periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 4Gi }

service:
  app:
    controller: guildhall
    ports:
      http: { port: 3000 }
      views: { port: 3001 }

route:
  app:
    hostnames: [guildhall.laboratory.casa]
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
  views:
    hostnames: [guildhall-views.laboratory.casa]
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: views

persistence:
  control:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    suffix: control
    advancedMounts:
      guildhall:
        control:
          - path: /state/control
  runner:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    suffix: runner
    advancedMounts:
      guildhall:
        runner:
          - path: /state/runner
  # Native homes also retain sessions, plugin caches and daemon packages.
  auth:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    suffix: auth
    advancedMounts:
      guildhall:
        runner:
          - path: /state/auth
  work:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    suffix: work
    advancedMounts:
      guildhall:
        runner:
          - path: /work
  tmp:
    type: emptyDir
    advancedMounts:
      guildhall:
        prepare-ssh:
          - path: /tmp
        control:
          - path: /tmp
  runner-tmp:
    type: emptyDir
    advancedMounts:
      guildhall:
        runner:
          - path: /tmp
  ssh-source:
    type: secret
    name: guildhall-host-ssh
    defaultMode: 288 # 0440; fsGroup lets the unprivileged init container read it.
    advancedMounts:
      guildhall:
        prepare-ssh:
          - path: /ssh-source
            readOnly: true
  ssh-runtime:
    type: emptyDir
    advancedMounts:
      guildhall:
        prepare-ssh:
          - path: /run/guildhall-ssh
        control:
          - path: /run/guildhall-ssh
            readOnly: true
  builder-source:
    type: secret
    name: guildhall-builder-transport
    defaultMode: 288
    advancedMounts:
      guildhall:
        prepare-ssh:
          - path: /builder-source
            readOnly: true
  worker-kube-token:
    type: projected
    defaultMode: 288
    sources:
      - serviceAccountToken:
          expirationSeconds: 3600
          path: token
      - configMap:
          name: kube-root-ca.crt
          items:
            - key: ca.crt
              path: ca.crt
    advancedMounts:
      guildhall:
        control:
          - path: /run/guildhall-kube
            readOnly: true
