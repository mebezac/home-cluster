defaultPodOptions:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 3600
  imagePullSecrets:
    - name: guildhall-registry
  securityContext:
    runAsNonRoot: true
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }

controllers:
  guildhall:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      control:
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall
          tag: a97d4625cf35cbe9098cee55152c288b130faa48@sha256:697da89960b7e5e1c5e9878cd862153c31249efd3b1104f033204d2641938d61
        env:
          TZ: America/New_York
          NODE_ENV: production
          HOST: 0.0.0.0
          PORT: "3000"
          VIEW_PORT: "3001"
          APP_ORIGIN: https://guildhall.laboratory.casa
          VIEW_ORIGIN: https://guildhall-views.laboratory.casa
          GUILDHALL_DATA: /state/control
          GUILDHALL_LOCAL_RUNNER_URL: http://127.0.0.1:4712
          GUILDHALL_WORK_ROOT: /work
          GUILDHALL_LOCAL_NATIVE_POLICY: '{"mode":"trusted","network":"allowed"}'
        envFrom:
          - secretRef:
              name: guildhall-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: &health { path: /health, port: 3000 }
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: *health
              periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 1Gi }
      runner:
        image:
          repository: git.laboratory.casa/laboratory-casa/guildhall-runner
          tag: a97d4625cf35cbe9098cee55152c288b130faa48@sha256:7c150f8dc9fbca3c8a85e8ddcd0d0a8e5c895a9fa3be1a65387bb10cd013a9ef
        env:
          TZ: America/New_York
          HOME: /state/auth
          CODEX_HOME: /state/auth/.codex
          GUILDHALL_RUNNER_DATA: /state/runner
          GUILDHALL_RUNNER_HOST: 127.0.0.1
          GUILDHALL_RUNNER_PORT: "4712"
        envFrom:
          - secretRef:
              name: guildhall-runner-secret
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec: &runnerHealth
                command: [node, -e, "fetch('http://127.0.0.1:4712/v1/capabilities',{headers:{authorization:'Bearer '+process.env.GUILDHALL_RUNNER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              exec: *runnerHealth
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              exec: *runnerHealth
              periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 4Gi }

service:
  app:
    controller: guildhall
    ports:
      http: { port: 3000 }
      views: { port: 3001 }

route:
  app:
    hostnames: [guildhall.laboratory.casa]
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: http
  views:
    hostnames: [guildhall-views.laboratory.casa]
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: views

persistence:
  control:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 128Mi
    suffix: control
    advancedMounts:
      guildhall:
        control:
          - path: /state/control
  runner:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 256Mi
    suffix: runner
    advancedMounts:
      guildhall:
        runner:
          - path: /state/runner
  auth:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 128Mi
    suffix: auth
    advancedMounts:
      guildhall:
        runner:
          - path: /state/auth
  work:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    suffix: work
    advancedMounts:
      guildhall:
        runner:
          - path: /work
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
