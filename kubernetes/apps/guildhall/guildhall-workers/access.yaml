apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guildhall-worker-control
  namespace: guildhall-workers
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guildhall-worker-control
  namespace: guildhall-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guildhall-worker-control
subjects:
  - kind: ServiceAccount
    name: guildhall
    namespace: guildhall
