apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guildhall-worker-control
  namespace: guildhall-workers
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create, get]
  # Network allowlist mode: one CiliumNetworkPolicy per worker, applied with
  # server-side apply. egress-admission.yaml limits what these policies may say.
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [create, get, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guildhall-worker-control
  namespace: guildhall-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guildhall-worker-control
subjects:
  - kind: ServiceAccount
    name: guildhall
    namespace: guildhall
