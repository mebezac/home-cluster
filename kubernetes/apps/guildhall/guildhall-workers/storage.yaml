apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-01-data
  namespace: guildhall-workers
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
