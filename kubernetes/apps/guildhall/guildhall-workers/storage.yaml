apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acceptance-runner-data
  namespace: guildhall-workers
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acceptance-runner-auth
  namespace: guildhall-workers
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
