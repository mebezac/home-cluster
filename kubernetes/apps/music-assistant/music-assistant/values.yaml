---
defaultPodOptions:
  securityContext:
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: "OnRootMismatch"

controllers:
  main:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: ghcr.io/music-assistant/server
          # changelog: GH releases music-assistant/server - PATCH notes are complete in the PR body, but a MINOR (2.x.0) truncates the body and carries breaking changes plus SQLite schema migrations on our /data PVC (DB_SCHEMA_VERSION in music_assistant/controllers/music/constants.py). Snapshot the PVC on a minor: a failed migration deletes library.db and forces a full rescan
          tag: 2.10.1@sha256:e6edefe825b1cdc50223c16d9bc2fca909a158b36555a7763512b76ba04a1b9e
        env:
          TZ: America/New_York
          LOG_LEVEL: info
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"], add: ["SYS_ADMIN", "DAC_READ_SEARCH"] }
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi

service:
  main:
    controller: main
    annotations:
      io.cilium/lb-ipam-ips: 10.25.30.57
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 8095
      stream:
        port: 8097

ingress:
  main:
    enabled: true
    className: internal
    hosts:
      - host: ma.laboratory.casa
        paths:
          - path: /
            service:
              identifier: main
              port: http

persistence:
  media:
    enabled: true
    type: nfs
    server: nas.laboratory.casa
    path: /mnt/data/10tb/Media
    globalMounts:
      - path: /Media

  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 5Gi
    globalMounts:
      - path: /data

  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /.audio
