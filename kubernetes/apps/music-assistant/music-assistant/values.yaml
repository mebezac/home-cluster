---
defaultPodOptions:
  securityContext:
    runAsUser: 3000
    runAsGroup: 3000
    fsGroup: 3000
    fsGroupChangePolicy: "OnRootMismatch"

controllers:
  main:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      main:
        image:
          repository: ghcr.io/music-assistant/server
          # changelog: GH RELEASES music-assistant/server (gh api repos/music-assistant/server/
          # releases/tags/<v>) - the PR body is NOT reliable even for patches, it is often just a
          # bare compare link, and a MINOR (2.x.0) truncates it entirely. Patches here are not small
          # either (2.10.2 was 42 commits). The real signal on every bump is DB_SCHEMA_VERSION in
          # music_assistant/controllers/music/constants.py, diffed tag-to-tag: unchanged means no
          # migration on our /data PVC. Snapshot the PVC when it does change - a failed migration
          # deletes library.db and forces a full rescan
          tag: 2.10.3@sha256:885872224fa541c0faefc936625c939ba705a00e89c180f89e877f58448ea5d5
        env:
          TZ: America/New_York
          LOG_LEVEL: info
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"], add: ["SYS_ADMIN", "DAC_READ_SEARCH"] }
        resources:
          # 7d metrics (2026-09-08): peak 260Mi, p95 254Mi - very stable.
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            memory: 768Mi

service:
  main:
    controller: main
    annotations:
      io.cilium/lb-ipam-ips: 10.25.30.57
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 8095
      stream:
        port: 8097

ingress:
  main:
    enabled: true
    className: internal
    hosts:
      - host: ma.laboratory.casa
        paths:
          - path: /
            service:
              identifier: main
              port: http

persistence:
  media:
    enabled: true
    type: nfs
    server: nas.laboratory.casa
    path: /mnt/data/10tb/Media
    globalMounts:
      - path: /Media

  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 5Gi
    globalMounts:
      - path: /data

  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /.audio
