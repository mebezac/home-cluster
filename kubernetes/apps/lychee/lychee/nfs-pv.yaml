---
# NAS volume lychee/lychee-uploads: dataset data/k8s/pv/lychee/lychee-uploads and its NFS share live in truenas-terraform
# (k8s-volumes.tf). Static PV, reclaim Retain: nothing in the cluster can delete the data.
# Restore in place with Kopiur (task kopiur:restore-path); there is no dataSourceRef.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lychee-lychee-uploads
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 50Gi  # the dataset refquota
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["noatime", "nfsvers=4.2"]
  nfs:
    server: 10.25.30.36
    path: /mnt/data/k8s/pv/lychee/lychee-uploads
  claimRef:
    namespace: lychee
    name: lychee-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lychee-uploads
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: lychee-lychee-uploads
  resources:
    requests:
      storage: 50Gi
