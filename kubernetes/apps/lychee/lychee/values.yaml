---
controllers:
  main:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: lycheeorg/lychee
          # changelog: GH releases LycheeOrg/Lychee (full notes in PR body). Laravel migrations run on container start; watch SECURITY_HEADER_* CSP env when notes touch CSP/WASM. Skip releases titled BROKEN (v7.11.0)
          tag: v7.12.0@sha256:4bcaa1757ac1919a1cba19428a7a97628aecebee8b178778478a88c08d6312cb
        resources:
          # non-file memory (working_set - active_file), 14d to 2026-10-21: p99 767Mi, max 773Mi.
          requests:
            cpu: 100m
            memory: 800Mi
          limits:
            memory: 1536Mi
        env:
          TIMEZONE: America/New_York
          APP_NAME: Lychee
          APP_URL: https://photos.zac.pizza
          DB_CONNECTION: pgsql
          DB_PORT: 5432
          PHP_TZ: America/New_York
          REDIS_PORT: 6379
          TRUSTED_PROXIES: "*"
          # Was set only in a stale /app/.env on the PVC (removed 2026-10-22, audit).
          # Every other key there matched Laravel's defaults (file cache and
          # sessions, sync queue). Code default is false.
          LOG_VIEWER_ENABLED: "true"
          SECURITY_HEADER_SCRIPT_SRC_ALLOW: https://analytics.laboratory.casa/script.js
          # Umami's script POSTs to <origin>/api/send; allowing only /script.js blocked
          # every event (none recorded after 2025-12-30). Allow the origin.
          SECURITY_HEADER_CSP_CONNECT_SRC: https://analytics.laboratory.casa
        envFrom:
          - secretRef:
              name: lychee-secret
        probes:
          liveness: &liveness
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &appPort 8000
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *liveness
          startup:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              # entrypoint chowns the whole upload dir, then runs migrations, before
              # serving; 7.11.1 took ~3 of the old 5 min and it grows with the library
              failureThreshold: 90
              httpGet:
                path: /
                port: *appPort

service:
  main:
    controller: main
    ports:
      http:
        port: *appPort

route:
  main:
    hostnames:
      - photos.zac.pizza
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 2Gi
    globalMounts:
      - path: /sym
        subPath: sym
      - path: /app/storage/app
        subPath: app
      - path: /app/storage/logs
        subPath: logs
  uploads:
    suffix: uploads
    enabled: true
    type: persistentVolumeClaim
    storageClass: freenas-api-nfs
    accessMode: ReadWriteOnce
    size: 50Gi
    globalMounts:
      - path: /app/public/uploads
  tmp:
    type: emptyDir
    globalMounts:
      - path: /app/storage/tmp
