---
controllers:
  main:
    replicas: 1
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      init-db:
        image:
          repository: ghcr.io/home-operations/postgres-init
          tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
          pullPolicy: IfNotPresent
        envFrom: &envFrom
          - secretRef:
              name: lychee-secret
    containers:
      app:
        image:
          repository: lycheeorg/lychee
          # changelog: GH releases LycheeOrg/Lychee (full notes in PR body). Laravel migrations run on container start; watch SECURITY_HEADER_* CSP env when notes touch CSP/WASM. Skip releases titled BROKEN (v7.11.0)
          tag: v7.11.1@sha256:51d867c272c26d2a6a4c6a200e26ed888a35a7ad4652c1871953a85519a78eba
        resources:
          # 7d metrics (2026-09-08): peak 650Mi, p95 648Mi - steady, and well
          # above the old 256Mi request.
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 1536Mi
        env:
          TIMEZONE: America/New_York
          APP_NAME: Lychee
          APP_URL: https://photos.zac.pizza
          DB_CONNECTION: pgsql
          DB_PORT: 5432
          PHP_TZ: America/New_York
          REDIS_PORT: 6379
          TRUSTED_PROXIES: "*"
          SECURITY_HEADER_SCRIPT_SRC_ALLOW: https://analytics.laboratory.casa/script.js
          SECURITY_HEADER_CSP_CONNECT_SRC: https://analytics.laboratory.casa/script.js
        envFrom: *envFrom
        probes:
          liveness: &liveness
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &appPort 8000
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *liveness
          startup:
            enabled: true
            custom: true
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              periodSeconds: 10
              # entrypoint chowns the whole upload dir, then runs migrations, before
              # serving; 7.11.1 took ~3 of the old 5 min and it grows with the library
              failureThreshold: 90
              httpGet:
                path: /
                port: *appPort

service:
  main:
    controller: main
    ports:
      http:
        port: *appPort

route:
  main:
    hostnames:
      - photos.zac.pizza
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: main
            port: http

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    suffix: data
    size: 2Gi
    globalMounts:
      - path: /app/.env
        subPath: conf/.env
      - path: /sym
        subPath: sym
      - path: /app/storage/app
        subPath: app
      - path: /app/storage/logs
        subPath: logs
  uploads:
    suffix: uploads
    enabled: true
    type: persistentVolumeClaim
    storageClass: freenas-api-nfs
    accessMode: ReadWriteOnce
    size: 50Gi
    globalMounts:
      - path: /app/public/uploads
  tmp:
    type: emptyDir
    globalMounts:
      - path: /app/storage/tmp
