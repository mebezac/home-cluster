---
# Only the envoy-internal proxy pods may reach the kopia UI. Anything else in the
# cluster that reached port 51515 would need only kopia's password, and the pod
# can read every backup. Kubelet probes are host traffic, which Cilium allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kopia-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kopia-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      ports:
        - protocol: TCP
          port: 51515
