autoDirectNodeRoutes: true
bpf:
  masquerade: true
  # Ref: https://github.com/siderolabs/talos/issues/10002
  hostLegacyRouting: true
cni:
  # Required for pairing with Multus CNI
  exclusive: false
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# NOTE: devices might need to be set if you have more than one active NIC on your hosts
# devices: eno+ eth+
endpointRoutes:
  enabled: true
envoy:
  enabled: false
  # Pinned: chart 1.20.4 stopped rendering a default (was ads), so agents fell back to split.
  xdsMode: split
dashboards:
  enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    # hubble.laboratory.casa is a plain HTTPRoute in ./config/hubble-ui.yaml
    # (the chart has no Gateway API option for the UI).
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 10.69.0.0/16
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
l2announcements:
  enabled: true
  # Each LoadBalancer IP holds a lease that its node renews every retryPeriod and
  # every other agent polls. With the defaults (15s/5s/2s) the 11 leases were 1/3
  # of all etcd writes and half of the apiserver audit log (2026-11-19, wear
  # investigation on wyse-5070-03's SSD). 5x slower renewals; the cost is IP
  # failover after a node death: 30-90 s (leaseDuration -/+ renewDeadline)
  # instead of 10-20 s (user's choice). Cilium rule: renewDeadline > 1.2 x retryPeriod.
  leaseDuration: 60s
  leaseRenewDeadline: 30s
  leaseRetryPeriod: 10s
loadBalancer:
  algorithm: maglev
  mode: dsr
  # needed for spegel >=0.8 (trafficDistribution: PreferSameNode)
  serviceTopology: true
localRedirectPolicy: true
operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
socketLB:
  hostNamespaceOnly: true
