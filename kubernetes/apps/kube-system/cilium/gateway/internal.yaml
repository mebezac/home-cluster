---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
# Gateway API equivalent of the `internal` ingressClass (ingress-nginx-internal
# on 10.25.30.117). Cilium renders this into a `cilium-gateway-internal` LB
# Service in this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
spec:
  gatewayClassName: cilium
  # Cilium copies these into the LB Service as `lbipam.cilium.io/ips`, so the
  # address comes out of the same CiliumLoadBalancerIPPool as everything else.
  addresses:
    - type: IPAddress
      value: 10.25.30.121
  infrastructure:
    annotations:
      tailscale.com/expose: "true"
  listeners:
    # Plain HTTP is deliberately closed off to other namespaces: everything
    # internal is https-only, matching nginx's force-ssl-redirect.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.laboratory.casa"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.laboratory.casa"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: laboratory-casa-gateway-production-tls
