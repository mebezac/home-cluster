---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  # Cilium takes one L2 lease per Service, not per IP. forgejo-ssh shares
  # 10.25.30.117 with envoy-internal, so both leases answered ARP for .117
  # from different nodes. Let only envoy-internal announce it; port 22 still
  # works because every node's BPF load balancer serves the shared VIP.
  serviceSelector:
    matchExpressions:
      - key: app.kubernetes.io/service
        operator: NotIn
        values:
          - forgejo-ssh
