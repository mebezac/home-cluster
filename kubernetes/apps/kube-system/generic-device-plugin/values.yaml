---
defaultPodOptions:
  priorityClassName: system-node-critical
configMaps:
  config:
    data:
      config.yaml: |-
        devices:
          - name: tun
            groups:
              - count: 1000
                paths:
                  - path: /dev/net/tun
controllers:
  generic-device-plugin:
    type: daemonset
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/squat/generic-device-plugin
          # was `latest`. Upstream DOES publish releases (0.1.0, 0.2.0) - they are
          # just buried past the first page of the tag list, which is why an earlier
          # check concluded there were none. 0.2.0 (built 2026-04-14) is the newest
          # release; the `latest` digest we ran was a 2026-05-15 build off main, so
          # this deliberately steps back from an untagged main build to a real
          # release Renovate can version-track.
          tag: 0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
        args:
          - --log-level=info
          - --config=/config/config.yaml
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /config/config.yaml
        subPath: config.yaml
        readOnly: true
  dev:
    type: hostPath
    hostPath: /dev
    globalMounts:
      - readOnly: true
  sys:
    type: hostPath
    hostPath: /sys
    globalMounts:
      - readOnly: true
  var-lib-kubelet-device-plugins:
    type: hostPath
    hostPath: /var/lib/kubelet/device-plugins
