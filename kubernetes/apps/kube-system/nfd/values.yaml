---
# Chart-default image (master, worker, gc), pinned with a digest; moves with the chart version
# (Renovate group).
image:
  repository: registry.k8s.io/nfd/node-feature-discovery
  tag: "v0.20.1@sha256:6fc5c9af9176e1acb5ce57a4a1d0c0d3eb25cd34f5bdd0efefebf0efe45a8379"
master:
  replicaCount: 1
  # chart default limit is 4Gi against ~14Mi real usage; on the small
  # wyse-5070-03 control-plane node that single limit was 59% of the
  # node's whole memory-limit sum (143% commitment). Sized to reality.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
gc:
  # chart default is a 1Gi limit; 7d peak is 20Mi.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
worker:
  config:
    core:
      sources: ["pci", "usb", "kernel", "cpu", "custom"]
prometheus:
  enable: true
  scrapeInterval: 30s
