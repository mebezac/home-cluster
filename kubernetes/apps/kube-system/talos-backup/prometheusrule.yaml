---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: talos-backup
spec:
  groups:
    - name: talos-backup
      rules:
        # Runs every 6h, so 26h = four missed runs in a row. absent() covers a CronJob that
        # has never succeeded (no last_successful_time series yet).
        - alert: EtcdBackupTooOld
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="kube-system", cronjob="talos-backup"}) > 26 * 3600
            or absent(kube_cronjob_status_last_successful_time{namespace="kube-system", cronjob="talos-backup"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: No etcd snapshot has reached Garage in over 26 hours
            description: 'Check the last kube-system/talos-backup Job: kubectl -n kube-system logs job/<name>.'
