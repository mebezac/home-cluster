---
# SMB/CIFS CSI driver: static PVs that mount a remote SMB share. The Talos
# kernel builds CIFS in (CONFIG_CIFS=y) and the node plugin image carries
# mount.cifs, so no system extension is needed.
#
# The node plugin is hostNetwork with dnsPolicy ClusterFirstWithHostNet (chart
# default), so a PV `source` can name a cluster Service. Point it at a Service
# with a stable ClusterIP: on a reconnect the kernel keeps the IP it mounted
# (Talos has no request-key for the dns_resolver upcall).
windows:
  enabled: false
# Chart-default images, pinned with a digest; they move with the chart version
# (Renovate group). Full repository paths: the chart prepends image.baseRepo
# only to a repository that starts with "/".
image:
  smb:
    repository: registry.k8s.io/sig-storage/smbplugin
    tag: "v1.20.4@sha256:74e049de9d3203b4a968f26c8b73d4b3b15b9c4705688330cfa7281ae5f7b727"
  csiProvisioner:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: "v6.4.1@sha256:9e76a2c599ffd7a66f08feeb62ddec61e3545eaa442f8f8f6a495569c0b06829"
  csiResizer:
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: "v2.3.1@sha256:d5b040c2f6ffb25127169feeb845aaf1fa3279e510d71fbebe386b5becc625cc"
  livenessProbe:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: "v2.20.1@sha256:d06ac4f9242654f278d9c8a4e343b0516542bfc614218d469959c6428765e97f"
  nodeDriverRegistrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: "v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5"
