cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
      # bbolt commits on a timer (default 100 ms) whenever anything changed; with
      # ~13 puts/s (mostly lease renewals) that was ~8 commits/s x ~40 KB = most
      # of each control-plane disk's writes (~26 GB/day; wyse-5070-03's Intel SSD
      # lost ~4% rated life/month, 2026-11-20). 1 s batches repeated updates to the
      # same pages. Durability is unchanged: every write is fsynced to the WAL
      # first and replayed after a crash; the cost is up to 1 s more replay.
      backend-batch-interval: 1s
    advertisedSubnets:
      - 10.25.30.0/24
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 10.25.30.45
  - 10.25.30.35
  - 10.25.30.46
  - 10.25.30.116
  - 10.25.30.127
  - 127.0.0.1
# Talos defaults to requests 200m / 512Mi. 7-day p95 is 2.7-2.8Gi, peak 3.4-3.8Gi,
# CPU p95 0.39-0.57 cores (audit 2026-10-21 #2). No memory limit: an OOM-killed
# apiserver hurts more than a tight node.
resources:
  requests:
    cpu: 500m
    memory: 3Gi
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# CoreDNS is deployed by Helm (kubernetes/argo/apps/kube-system/coredns.yaml)
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
# Cilium is the CNI and replaces kube-proxy
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
