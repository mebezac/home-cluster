# Tool pins and tasks only, shared by humans and agents. The age key, kubeconfig,
# talosconfig and the decrypted MCP token live in .mise.human.toml, which loads
# only with MISE_ENV=human. Agents run with MISE_ENV=agent.

[tools]
# changelog: docs.python.org/3.<minor>/whatsnew (PR body is a bare compare link); only consumer: stdlib python3 -c in .claude/skills/talos-upgrade/scripts/talmac-upgrade.sh
python = "3.15.2"
# Operations tools
# changelog: GH releases argoproj/argo-cd; keep = appVersion of the argo-cd chart in kubernetes/argo/apps/argo-system/argo-cd.yaml
"aqua:argoproj/argo-cd" = "3.5.6"
# changelog: repo RELEASE_NOTES per-release + CHANGES.md for breaking flags - the GH release body is checksums only.
# Keep in step with the 3 cloudflared container pins under kubernetes/apps/network/cloudflared*/values.yaml
"aqua:cloudflare/cloudflared" = "2026.10.7"
"aqua:derailed/k9s" = "0.51.0"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.13.3"
"aqua:google/go-containerregistry" = "0.22.1"  # provides `crane`, used by the dependency-pr-triage skill
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "4.3.1"
# changelog: gh release view vX.Y.Z -R helmfile/helmfile (PR body is a compare link only)
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.36.5"
"aqua:mikefarah/yq" = "4.54.1"
# changelog: see kubernetes/bootstrap/talos/topf.yaml talosVersion - same release, bump in lockstep (Renovate does not group them)
"aqua:siderolabs/talos" = "1.14.5"
# topf renders + applies Talos machine configs from kubernetes/bootstrap/talos/topf.yaml (replaced archived talhelper)
"github:postfinance/topf" = "0.6.2"
"aqua:yannh/kubeconform" = "0.8.0"
"asdf:janpieper/asdf-ksops" = "4.3.3"
# renovate provides `renovate-config-validator` for checking .github/renovate.json5; needs node ^24.11
node = "24.22.2"
# changelog: GH releases renovatebot/renovate (PR body truncates on big jumps; list releases between tags). Local use is renovate-config-validator only; the Mend bot runs its own version
# libzip 3.2.2 was hand-published by the yarn lead (arcanis) without provenance; 3.2.0/3.2.1 had it via yarnbot
"npm:renovate" = { version = "44.195.0", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[tasks.argocd-mcp-token]
description = "Generate a token for the ArgoCD account mcp into mcp-secrets.sops.json (restart Claude Code after)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# argocd --core reads Argo CD from the kube context's namespace. An overlay
# kubeconfig sets argo-system without touching ./kubeconfig.
overlay=$(mktemp)
trap 'rm -f "$overlay" mcp-secrets.sops.json.new' EXIT
ctx=$(kubectl config current-context)
cat > "$overlay" <<YAML
apiVersion: v1
kind: Config
current-context: $ctx
contexts:
  - name: $ctx
    context:
      cluster: $(kubectl config view --minify -o jsonpath='{.contexts[0].context.cluster}')
      user: $(kubectl config view --minify -o jsonpath='{.contexts[0].context.user}')
      namespace: argo-system
YAML
KUBECONFIG="$overlay:$KUBECONFIG" argocd account generate-token --core --account mcp --id "claude-code-$(date +%Y%m%d-%H%M%S)" \
  | jq -eR 'select(length > 0) | {ARGOCD_API_TOKEN: .}' \
  | sops encrypt --input-type json --output-type json --filename-override mcp-secrets.sops.json /dev/stdin > mcp-secrets.sops.json.new
mv mcp-secrets.sops.json.new mcp-secrets.sops.json
echo "Wrote mcp-secrets.sops.json. Restart Claude Code so argocd-mcp gets the token."
'''
