# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds containers/tastytrade-mcp (tastytrade's official MCP server behind
# supergateway) and pushes ghcr.io/mebezac/tastytrade-mcp:<upstream version>-<commit>.
# Renovate bumps the upstream commit, supergateway and the base image; the
# cluster pins the result as tag@sha256.
name: "tastytrade-mcp image"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "containers/tastytrade-mcp/**"
      - ".github/workflows/tastytrade-mcp-image.yaml"

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read upstream version
        id: version
        run: |
          ref=$(sed -n 's/^ARG TASTYTRADE_MCP_REF=//p' containers/tastytrade-mcp/Dockerfile)
          test -n "$ref"
          v=$(curl -fsSL "https://raw.githubusercontent.com/tastytrade/tastytrade-mcp/${ref}/package.json" | jq -r .version)
          test -n "$v" && test "$v" != null
          echo "tag=${v}-${ref:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: containers/tastytrade-mcp
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mebezac/tastytrade-mcp:${{ steps.version.outputs.tag }}
            ghcr.io/mebezac/tastytrade-mcp:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=tastytrade official MCP server over Streamable HTTP (supergateway)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: echo "ghcr.io/mebezac/tastytrade-mcp:${{ steps.version.outputs.tag }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
