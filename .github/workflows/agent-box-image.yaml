# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds containers/agent-box (SSH target for Paperclip "Real Life" agents) and
# pushes ghcr.io/mebezac/agent-box:<codex version>. Renovate bumps the codex ARG
# and the base image; the cluster pins the result as tag@sha256.
name: "agent-box image"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "containers/agent-box/**"
      - ".github/workflows/agent-box-image.yaml"

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read codex version
        id: version
        run: |
          v=$(sed -n 's/^ARG CODEX_VERSION=//p' containers/agent-box/Dockerfile)
          test -n "$v"
          echo "codex=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: containers/agent-box
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mebezac/agent-box:${{ steps.version.outputs.codex }}
            ghcr.io/mebezac/agent-box:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SSH target for Paperclip agents (codex, git, ripgrep)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: echo "ghcr.io/mebezac/agent-box:${{ steps.version.outputs.codex }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
